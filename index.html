<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#05080f;--card:#0f1520;--border:#1a2235;--border2:#243048;--text:#e8edf5;--muted:#4a5568;
  --sky:#0ea5e9;--green:#10b981;--amber:#f59e0b;--red:#ef4444;}
html{background:#05080f;}body{background:#05080f;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px;}
.fade{animation:fadeUp .25s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ─ NAV sidebar → bottom on mobile ─ */
.nav{display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:11px;cursor:pointer;
  font-size:13px;font-weight:600;color:#4a5568;border:none;background:none;width:100%;text-align:left;
  font-family:'Plus Jakarta Sans',sans-serif;transition:all .18s;}
.nav:hover,.nav:active{background:#0f1520;color:#94a3b8;}
.nav.on{background:linear-gradient(135deg,#0c1d35,#0a1829);color:var(--sky);border:1px solid #0e3a5c;}

/* ─ Sidebar: hidden on mobile, visible on desktop ─ */
.sidebar{width:200px;flex-shrink:0;padding:22px 10px;display:flex;flex-direction:column;
  gap:3px;border-right:1px solid #0d1520;position:sticky;top:0;height:100vh;overflow:auto;}

/* ─ Bottom nav: visible on mobile only ─ */
.bottom-nav{display:none;}

@media(max-width:640px){
  /* Hide sidebar */
  .sidebar{display:none !important;}

  /* Show bottom nav */
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;
    background:#080d14;border-top:1px solid #1a2235;
    align-items:center;justify-content:space-around;
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .bnav-btn{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:4px 8px;border:none;background:none;cursor:pointer;
    color:#4a5568;font-family:'Plus Jakarta Sans',sans-serif;
    font-size:10px;font-weight:600;border-radius:8px;
    -webkit-tap-highlight-color:transparent;min-width:48px;
  }
  .bnav-btn.on{color:var(--sky);}
  .bnav-icon{font-size:22px;line-height:1.2;position:relative;display:inline-block;}
  .bnav-badge{position:absolute;top:-3px;right:-6px;background:#ef4444;color:#fff;
    border-radius:10px;font-size:9px;font-weight:700;padding:1px 4px;min-width:15px;text-align:center;}

  /* Main content padding for bottom nav */
  .admin-content{
    padding-bottom:calc(70px + env(safe-area-inset-bottom)) !important;
  }

  /* Modals slide up from bottom */
  .ovl{align-items:flex-end !important;}
  .mdl{border-radius:20px 20px 0 0 !important;
    padding-bottom:calc(24px + env(safe-area-inset-bottom)) !important;}
  .mdl::before{content:'';display:block;width:36px;height:4px;
    background:#1e293b;border-radius:2px;margin:0 auto 16px;}

  /* Cards full width */
  .clients-grid{grid-template-columns:1fr !important;}
  .stats-grid{grid-template-columns:repeat(3,1fr) !important;gap:8px !important;}
  .dash-grid{grid-template-columns:1fr !important;}
  .income-grid{grid-template-columns:1fr 1fr !important;}

  /* Inputs larger for touch */
  .inp{font-size:16px !important;padding:12px 14px !important;}

  /* Top bar on mobile */
  .mobile-topbar{
    display:flex !important;align-items:center;justify-content:space-between;
    padding:12px 14px;border-bottom:1px solid #0d1520;
    background:var(--bg);position:sticky;top:0;z-index:50;
  }
}

@media(min-width:641px){
  .mobile-topbar{display:none;}
  .bottom-nav{display:none;}
  .bnav-btn{display:none;}
}

/* ─ Shared components ─ */
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:16px;}
.btn{border:none;border-radius:9px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;

.sky{background:linear-gradient(135deg,#0369a1,#0ea5e9);color:#fff;padding:9px 16px;}
.sky:active{opacity:.8;}
.grn{background:linear-gradient(135deg,#065f46,#059669);color:#fff;padding:9px 16px;}

.ghost{background:#111827;color:#64748b;padding:9px 14px;border:1px solid var(--border);}

.wa:active{opacity:.8;}
.inp{background:#080d14;border:1px solid var(--border2);border-radius:9px;padding:9px 13px;

  outline:none;transition:border .2s;-webkit-appearance:none;}
.inp:focus{border-color:var(--sky);}
.inp option{background:#0d1117;}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;}
.mdl{background:#0c1220;border-radius:20px;border:1px solid var(--border2);padding:26px;
  width:100%;max-width:480px;max-height:92vh;overflow-y:auto;}
.pbar{height:6px;background:#111827;border-radius:10px;overflow:hidden;}
.pfill{height:100%;border-radius:10px;transition:width .6s;}
.notif{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:400;
  padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;
  animation:slideIn .3s ease;white-space:nowrap;}
@keyframes slideIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.seg{display:flex;background:#080d14;border-radius:10px;padding:3px;gap:2px;}
.sb{flex:1;padding:8px 6px;border:none;border-radius:8px;cursor:pointer;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;
  transition:all .2s;color:#4a5568;background:none;}
.sb.on{background:#0f1829;color:var(--sky);}
.tab{padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;
  border:none;background:none;transition:all .18s;color:#4a5568;
  font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap;}
.tab.on{background:#0f1520;color:var(--sky);border:1px solid #0e3a5c;}
.ring{border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;flex-shrink:0;}
.mono{font-family:'JetBrains Mono',monospace;}
.lbl{font-size:11px;color:#4a5568;display:block;margin-bottom:5px;font-weight:700;letter-spacing:.8px;}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.hero-card{background:linear-gradient(135deg,#090f1e,#0d1830);border-radius:20px;
  border:1px solid #1e3a5a;padding:22px;position:relative;overflow:hidden;}
.hero-card::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;
  border-radius:50%;background:radial-gradient(circle,#0ea5e912,transparent 70%);}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.cal-day{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:13px;font-weight:600;
  transition:all .15s;border:1px solid transparent;}
.cal-day:active{opacity:.7;}
.cal-day.has-session{background:#0c2040;border-color:#1e3a5a;color:#38bdf8;}
.cal-day.today{border-color:#0ea5e9;color:#0ea5e9;}
.cal-day.blocked{background:#1a0808;color:#4a1515;}
.cal-day.other-month{opacity:.25;}
.streak-fire{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
</style>

// ── REMEMBER ME ────────────────────────────────────────────────────────────
function saveSession(type, data) {
  try { localStorage.setItem("kg_session", JSON.stringify({type, data, ts: Date.now()})); } catch(e){}

function loadSession() {

const getWeekDays = (from=TODAY) => Array.from({length:7},(_,i)=>{const d=new Date(from+"T12:00:00");d.setDate(d.getDate()+i);return d.toISOString().split("T")[0];});

function getMonthDays(year, month) {
  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month+1, 0).getDate();
  const prev = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=(first===0?6:first-1); i>0; i--) cells.push({day:prev-i+1,cur:false});
  for(let i=1; i<=days; i++) cells.push({day:i,cur:true});
  while(cells.length%7!==0) cells.push({day:cells.length-days-(first===0?6:first-1)+1,cur:false});
  return cells;
}

function calcStreak(history) {
  if(!history.length) return 0;
  const dates = [...new Set(history.map(h=>h.date))].sort((a,b)=>b.localeCompare(a));
  let streak = 0, prev = null;
  for(const d of dates) {
    if(!prev) { streak=1; prev=d; continue; }
    const diff = Math.round((new Date(prev+"T12:00:00") - new Date(d+"T12:00:00")) / 86400000);
    if(diff<=7) { streak++; prev=d; } else break;
  }
  return streak;
}

// ── ROOT ───────────────────────────────────────────────────────────────────
function App() {
  const [mode, setMode] = React.useState("login");
  const [clients, setClients] = React.useState([]);
  const [sessions, setSessions] = React.useState([]);
  const [history, setHistory] = React.useState([]);
  const [payments, setPayments] = React.useState([]);
  const [blocked, setBlocked] = React.useState([]);
  const [forum, setForum] = React.useState([]);
  const [exercises, setExercises] = React.useState([]);
  const [plans, setPlans] = React.useState([]);
  const [clientPlans, setClientPlans] = React.useState([]);
  const [progress, setProgress] = React.useState([]);
  const [records, setRecords] = React.useState([]);
  const [achievements, setAchievements] = React.useState([]);
  const [annualBlocks, setAnnualBlocks] = React.useState([]);
  const [sessionTemplates, setSessionTemplates] = React.useState([]);
  const [templateExercises, setTemplateExercises] = React.useState([]);
  const [clientWeights, setClientWeights] = React.useState([]);
  const [assignedSessions, setAssignedSessions] = React.useState([]);
  const [assignedExercises, setAssignedExercises] = React.useState([]);
  const [weightHistory, setWeightHistory] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [loggedClient, setLoggedClient] = React.useState(null);
  const [pendingSession, setPendingSession] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const [loginTab, setLoginTab] = React.useState("client");
  const [loginName, setLoginName] = React.useState("");
  const [loginCode, setLoginCode] = React.useState("");
  const [adminPass, setAdminPass] = React.useState("");
  const [loginErr, setLoginErr] = React.useState("");

  const notify = React.useCallback((msg, type="ok") => {
    setToast({msg,type}); setTimeout(()=>setToast(null),3200);
  },[]);

  const loadAll = React.useCallback(async () => {
    try {
      const [c,s,h,p,b,f,ex,pl,cp,pr,rec,ach,ab,st,te,cw,as_,ae,wh] = await Promise.all([
        sb.from("clients").select("*").order("created_at"),
        sb.from("sessions").select("*").order("date").order("time"),
        sb.from("history").select("*").order("date",{ascending:false}),
        sb.from("payments").select("*").order("paid_at",{ascending:false}),
        sb.from("blocked_slots").select("*"),
        sb.from("forum_posts").select("*").order("created_at",{ascending:false}),
        sb.from("exercises").select("*").order("category").order("name"),
        sb.from("training_plans").select("*, plan_days(*, plan_exercises(*))").order("created_at",{ascending:false}),
        sb.from("client_plans").select("*"),
        sb.from("progress").select("*").order("date",{ascending:false}),
        sb.from("personal_records").select("*").order("date",{ascending:false}),
        sb.from("achievements").select("*").order("earned_at",{ascending:false}),
        sb.from("annual_blocks").select("*").order("order_index"),
        sb.from("session_templates").select("*").order("order_index"),
        sb.from("template_exercises").select("*").order("order_index"),
        sb.from("client_weights").select("*").order("exercise_name"),
        sb.from("assigned_sessions").select("*").order("date"),
        sb.from("assigned_exercises").select("*").order("order_index"),
        sb.from("weight_history").select("*").order("changed_at",{ascending:false}),
      ]);
      setClients(c.data||[]); setSessions(s.data||[]); setHistory(h.data||[]);
      setPayments(p.data||[]); setBlocked(b.data||[]); setForum(f.data||[]);
      setExercises(ex.data||[]); setPlans(pl.data||[]); setClientPlans(cp.data||[]);
      setProgress(pr.data||[]); setRecords(rec.data||[]); setAchievements(ach.data||[]);
      setAnnualBlocks(ab.data||[]); setSessionTemplates(st.data||[]); setTemplateExercises(te.data||[]);
      setClientWeights(cw.data||[]); setAssignedSessions(as_.data||[]); setAssignedExercises(ae.data||[]);
      setWeightHistory(wh.data||[]);
    } catch(e) { notify("Error de conexión","err"); }
    setLoading(false);
  },[]);

  React.useEffect(()=>{
    loadAll().then(()=>{
      // Restore saved session
      const s = loadSession();
      if(s) setPendingSession(s);
    });
  },[]);

  // Apply pending session once clients are loaded
  React.useEffect(()=>{
    if(pendingSession && clients.length > 0) {
      if(pendingSession.type === "admin") {
        setMode("admin");
      } else if(pendingSession.type === "client") {
        const c = clients.find(x=>x.id===pendingSession.data.id);
        if(c) { setLoggedClient(c); setMode("client"); }
      }
      setPendingSession(null);
    }
  },[pendingSession, clients]);

  React.useEffect(()=>{
    if(loggedClient) { const u=clients.find(c=>c.id===loggedClient.id); if(u) setLoggedClient(u); }
  },[clients]);

  const handleClientLogin = (remember) => {
    const c = clients.find(x=>x.name.toLowerCase().trim()===loginName.toLowerCase().trim()&&x.code===loginCode.trim());

      setLoggedClient(c);setMode("client");setLoginErr("");

  };
  const handleAdminLogin = (remember) => {
    if(adminPass===ADMIN_PASS){
      setMode("admin");setAdminPass("");setLoginErr("");
      if(remember) saveSession("admin", {});
    }
    else setLoginErr("Contraseña incorrecta");

  if(loading) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div className="mono" style={{fontSize:32,color:"#0ea5e9"}}>⚡</div>
      <div style={{width:24,height:24,border:"3px solid #0ea5e930",borderTopColor:"#0ea5e9",borderRadius:"50%"}} className="spin"/>
      <div style={{color:"#334155",fontSize:13}}>Conectando con {GYM_NAME}...</div>

  return (
    <div>
      {toast&&<div className="notif" style={{background:toast.type==="err"?"#160404":toast.type==="wa"?"#052e16":"#060f1e",color:toast.type==="err"?"#f87171":toast.type==="wa"?"#4ade80":"#38bdf8",border:`1px solid ${toast.type==="err"?"#450a0a":toast.type==="wa"?"#14532d":"#0e3a5c"}`}}>{toast.msg}</div>}
      {mode==="login"&&<LoginScreen {...{loginTab,setLoginTab,loginName,setLoginName,loginCode,setLoginCode,adminPass,setAdminPass,loginErr,setLoginErr,handleClientLogin,handleAdminLogin}}/>}
      {mode==="admin"&&<AdminPanel {...{clients,sessions,history,payments,blocked,forum,exercises,plans,clientPlans,progress,records,achievements,annualBlocks,sessionTemplates,templateExercises,clientWeights,assignedSessions,assignedExercises,weightHistory,loadAll,notify}} onLogout={()=>{clearSession();setMode("login");}}/>}
      {mode==="client"&&loggedClient&&<ClientPortal client={loggedClient} allSessions={sessions} allHistory={history} allClients={clients} blocked={blocked} forum={forum} exercises={exercises} plans={plans} clientPlans={clientPlans} myProgress={progress.filter(p=>p.client_id===loggedClient.id)} myRecords={records.filter(r=>r.client_id===loggedClient.id)} myAchievements={achievements.filter(a=>a.client_id===loggedClient.id)} myAssignedSessions={assignedSessions.filter(s=>s.client_id===loggedClient.id)} myAssignedExercises={assignedExercises} clientWeights={clientWeights.filter(w=>w.client_id===loggedClient.id)} annualBlocks={annualBlocks} loadAll={loadAll} notify={notify} onLogout={()=>{clearSession();setLoggedClient(null);setMode("login");}}/>}
    </div>
  );
}

// ── LOGIN ──────────────────────────────────────────────────────────────────
function LoginScreen({loginTab,setLoginTab,loginName,setLoginName,loginCode,setLoginCode,adminPass,setAdminPass,loginErr,setLoginErr,handleClientLogin,handleAdminLogin}) {
  const [remember, setRemember] = React.useState(true);
  const RememberBox = ({id}) => (
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"2px 0"}}>
      <input type="checkbox" id={id} checked={remember} onChange={e=>setRemember(e.target.checked)} style={{accentColor:"#0ea5e9",width:18,height:18,cursor:"pointer"}}/>
      <label htmlFor={id} style={{fontSize:13,color:"#64748b",cursor:"pointer"}}>Recordarme en este dispositivo</label>
    </div>
  );
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"radial-gradient(ellipse at 50% 0%,#0c1d35,#05080f 60%)"}}>
      <div style={{width:"100%",maxWidth:380}} className="fade">
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:38,marginBottom:8}}>🏋️</div>
          <div className="mono" style={{fontSize:28,fontWeight:700,color:"#0ea5e9",letterSpacing:-1}}>{GYM_NAME}</div>
          <div style={{color:"#334155",fontSize:13,marginTop:5}}>Tu centro de entrenamiento personal</div>
        </div>
        <div className="seg" style={{marginBottom:20}}>
          <button className={`sb ${loginTab==="client"?"on":""}`} onClick={()=>{setLoginTab("client");setLoginErr("");}}>Soy cliente</button>
          <button className={`sb ${loginTab==="admin"?"on":""}`} onClick={()=>{setLoginTab("admin");setLoginErr("");}}>Admin</button>
        </div>
        <div className="card" style={{padding:26}}>
          {loginTab==="client"?(
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <p style={{fontSize:13,color:"#475569",marginBottom:4}}>Ingresa tu nombre y el código de acceso.</p>
              <div><span className="lbl">NOMBRE COMPLETO</span>
                <input className="inp" placeholder="Ej. Carlos Mendoza" value={loginName} onChange={e=>setLoginName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleClientLogin(remember)}/>
              </div>
              <div><span className="lbl">CÓDIGO</span>
                <input className="inp mono" placeholder="••••" maxLength={4} value={loginCode} onChange={e=>setLoginCode(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleClientLogin(remember)} style={{letterSpacing:8,fontSize:20,textAlign:"center"}}/>
              </div>
              {loginErr&&<p style={{fontSize:12,color:"#f87171"}}>{loginErr}</p>}
              <RememberBox id="remC"/>
              <button className="btn sky" style={{width:"100%",padding:13,fontSize:14}} onClick={()=>handleClientLogin(remember)}>Entrar a mi portal</button>
              <p style={{fontSize:11,color:"#1e3a5a",textAlign:"center"}}>¿Sin código? Escribe a tu trainer 📱</p>
            </div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div><span className="lbl">CONTRASEÑA</span>
                <input className="inp" type="password" placeholder="••••••••" value={adminPass} onChange={e=>setAdminPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleAdminLogin(remember)}/>
              </div>
              {loginErr&&<p style={{fontSize:12,color:"#f87171"}}>{loginErr}</p>}
              <RememberBox id="remA"/>
              <button className="btn sky" style={{width:"100%",padding:13,fontSize:14}} onClick={()=>handleAdminLogin(remember)}>Entrar al panel</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── ADMIN ──────────────────────────────────────────────────────────────────
function AdminPanel({clients,sessions,history,payments,blocked,forum,exercises,plans,clientPlans,progress,records,achievements,annualBlocks,sessionTemplates,templateExercises,clientWeights,assignedSessions,assignedExercises,weightHistory,loadAll,notify,onLogout}) {
  const [view,setView] = React.useState("dashboard");
  const [schedView,setSchedView] = React.useState("day");
  const [showVacation,setShowVacation] = React.useState(false);
  const [expanded,setExpanded] = React.useState(null);
  const [waClient,setWaClient] = React.useState(null);
  const [showBulkWA,setShowBulkWA] = React.useState(false);
  const [showNC,setShowNC] = React.useState(false);
  const [showNS,setShowNS] = React.useState(false);
  const [showPay,setShowPay] = React.useState(null);
  const [saving,setSaving] = React.useState(false);
  const [calDate,setCalDate] = React.useState(new Date());
  const [activeDay,setActiveDay] = React.useState(TODAY);
  const [nc,setNc] = React.useState({name:"",code:"",phone:"",email:"",sessions:10,cost:100,nextPayment:"",welcome:"",notes:""});
  const [ns,setNs] = React.useState({clientId:"",date:TODAY,time:"07:00",type:"Fuerza",confirmed:true});
  const [config,setConfig] = React.useState(DEFAULT_SCHEDULE);
  const [showSched,setShowSched] = React.useState(false);
  const [moveSess,setMoveSess] = React.useState(null);

  // Carga la configuración de horario (si la tabla existe; si no, usa los valores por defecto).
  React.useEffect(()=>{
    sb.from("app_settings").select("config").eq("id",1).then(({data})=>{
      if(data&&data[0]&&data[0].config) setConfig({...DEFAULT_SCHEDULE,...data[0].config});
    });
  },[]);
  const saveConfig = (cfg) => w(async()=>{
    setConfig(cfg);
    const {error}=await sb.from("app_settings").upsert({id:1,config:cfg});
    if(error) return notify("Guarda la tabla app_settings (ver docs)","err");
    notify("Horario guardado ✓");
  });

  // Franjas de trabajo derivadas de la config y capacidad (atletas) por hora.
  const workSlots = [...genSlots(config.morningFrom,config.morningTo),...genSlots(config.afternoonFrom,config.afternoonTo)];
  const capOf = (t) => (config.capacity&&config.capacity[t]!=null)?config.capacity[t]:config.defaultCapacity;
  // Franjas visibles del día: las de trabajo + cualquier hora con sesión (para no ocultar nada).
  const daySlots = Array.from(new Set([...workSlots,...sessions.filter(s=>s.date===activeDay).map(s=>s.time)])).sort();

  const reminders = [];
  clients.forEach(c=>{
    const d=daysUntil(c.next_payment);
    if(d<=5) reminders.push({c,type:"payment",days:d,urgent:d<=2});
    if(c.sessions_left<=2&&c.sessions_left>0) reminders.push({c,type:"sessions",urgent:c.sessions_left<=1});
    if(c.sessions_left===0) reminders.push({c,type:"expired",urgent:true});
  });
  const requests = sessions.filter(s=>s.requested);
  const todaySessions = sessions.filter(s=>s.date===TODAY&&!s.requested);
  const alertCount = reminders.filter(r=>r.urgent).length+requests.length;

  // Income stats
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthIncome = payments.filter(p=>p.paid_at&&p.paid_at.startsWith(thisMonth)).reduce((a,p)=>a+parseFloat(p.amount||0),0);
  const totalIncome = payments.reduce((a,p)=>a+parseFloat(p.amount||0),0);

  const w = async (fn) => { setSaving(true); await fn(); await loadAll(); setSaving(false); };

  const addClient = () => w(async()=>{
    if(!nc.name||!nc.code||!nc.nextPayment) return notify("Completa los campos requeridos","err");
    if(nc.code.length!==4) return notify("El código debe tener 4 dígitos","err");
    if(clients.find(c=>c.code===nc.code)) return notify("Ese código ya existe","err");
    const color=COLORS[clients.length%COLORS.length];
    const {error}=await sb.from("clients").insert({name:nc.name,code:nc.code,phone:nc.phone,email:nc.email,color,sessions_left:parseInt(nc.sessions),total_sessions:parseInt(nc.sessions),next_payment:nc.nextPayment,payment_amount:parseFloat(nc.cost),welcome_msg:nc.welcome,notes:nc.notes});
    if(error) return notify("Error: "+error.message,"err");
    setShowNC(false); setNc({name:"",code:"",phone:"",email:"",sessions:10,cost:100,nextPayment:"",welcome:"",notes:""});
    notify("Cliente añadido ✓");
  });

  const saveNotes = (clientId, notes) => w(async()=>{
    await sb.from("clients").update({notes}).eq("id",clientId);
    notify("Notas guardadas ✓");
  });

  const addSession = () => w(async()=>{
    if(!ns.clientId) return notify("Selecciona un cliente","err");
    const {error}=await sb.from("sessions").insert({client_id:ns.clientId,date:ns.date,time:ns.time,type:ns.type,status:ns.confirmed?"confirmed":"pending",requested:false});
    if(error) return notify("Error: "+error.message,"err");
    setShowNS(false); setNs({clientId:"",date:TODAY,time:"07:00",type:"Fuerza",confirmed:true});
    notify("Sesión agendada ✓");
  });

  const completeSession = (sess) => w(async()=>{
    await sb.from("sessions").delete().eq("id",sess.id);
    await sb.from("history").insert({client_id:sess.client_id,date:sess.date,time:sess.time,type:sess.type});
    const client=clients.find(c=>c.id===sess.client_id);
    if(client) await sb.from("clients").update({sessions_left:Math.max(0,client.sessions_left-1)}).eq("id",client.id);
    notify("Sesión completada ✓");
  });

  // Cuenta una sesión suelta (cliente que entrena sin cita previa): la registra
  // hoy en el historial y descuenta 1 del bono.
  const countWalkin = (client) => w(async()=>{
    const now=new Date().toTimeString().slice(0,5);
    await sb.from("history").insert({client_id:client.id,date:TODAY,time:now,type:"Sesión"});
    await sb.from("clients").update({sessions_left:Math.max(0,client.sessions_left-1)}).eq("id",client.id);
    notify("Sesión contada ✓");
  });

  const deleteSession = (id) => w(async()=>{ await sb.from("sessions").delete().eq("id",id); notify("Sesión eliminada"); });

  // Aprobar una solicitud avisa si la clase ya está completa (permite forzar).
  const approveRequest = (id) => {
    const req=sessions.find(s=>s.id===id); if(!req) return;
    const confirmadas=sessions.filter(s=>s.date===req.date&&s.time===req.time&&!s.requested).length;
    const cap=capOf(req.time);
    if(confirmadas>=cap && !window.confirm(`⚠️ La clase de las ${req.time} ya está completa (${confirmadas}/${cap}).\n¿Aprobar de todos modos?`)) return;
    w(async()=>{ await sb.from("sessions").update({requested:false,status:"confirmed"}).eq("id",id); notify("Solicitud aprobada ✓"); });
  };
  const denyRequest = (id) => w(async()=>{ await sb.from("sessions").delete().eq("id",id); notify("Solicitud rechazada"); });

  // Mover una sesión a otro día/hora (reprogramar).
  const rescheduleSession = (sess,date,time) => w(async()=>{
    await sb.from("sessions").update({date,time}).eq("id",sess.id);
    notify("Sesión movida ✓");
  });

  const markPayment = (client, amount) => w(async()=>{
    const next=new Date(client.next_payment+"T12:00:00"); next.setMonth(next.getMonth()+1);
    await sb.from("clients").update({next_payment:next.toISOString().split("T")[0]}).eq("id",client.id);
    await sb.from("payments").insert({client_id:client.id,client_name:client.name,amount:amount||client.payment_amount,paid_at:TODAY});
    setShowPay(null); notify("Pago registrado ✓");
  });

  const renewSessions = (client) => w(async()=>{ await sb.from("clients").update({sessions_left:client.total_sessions}).eq("id",client.id); notify("Sesiones renovadas ✓"); });
  const deleteClient = (id) => w(async()=>{ await sb.from("clients").delete().eq("id",id); setExpanded(null); notify("Cliente eliminado"); });

  const toggleBlockDay = (date) => w(async()=>{
    const ex=blocked.find(b=>b.date===date&&b.time==="ALL");
    if(ex) await sb.from("blocked_slots").delete().eq("id",ex.id);
    else await sb.from("blocked_slots").insert({date,time:"ALL",reason:"Día bloqueado"});
    notify(ex?"Día desbloqueado":"Día bloqueado 🚫");
  });

  const blockVacation = (startDate, endDate, reason="Vacaciones") => w(async()=>{
    const start=new Date(startDate+"T12:00:00");
    const end=new Date(endDate+"T12:00:00");
    const inserts=[];
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      const ds=d.toISOString().split("T")[0];
      const dow=d.getDay();
      if(dow>=1&&dow<=5) inserts.push({date:ds,time:"ALL",reason:"Vacaciones"});
    }
    if(inserts.length>0) await sb.from("blocked_slots").insert(inserts);
    setShowVacation(false);
    const emoji = reason==="Festivo"?"🎉":"🏖";
    notify(`${inserts.length} días marcados como ${reason} ${emoji}`);
  });

  const toggleBlock = (date, time) => w(async()=>{
    const ex=blocked.find(b=>b.date===date&&b.time===time);
    if(ex) await sb.from("blocked_slots").delete().eq("id",ex.id);
    else await sb.from("blocked_slots").insert({date,time});
    notify(ex?"Horario desbloqueado":"Horario bloqueado");
  });

  const isBlocked = (date,time) => blocked.some(b=>b.date===date&&b.time===time);

  // Calendar helpers
  const calYear=calDate.getFullYear(), calMonth=calDate.getMonth();
  const calDays=getMonthDays(calYear,calMonth);
  const getDayStr=(day)=>`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


  return (
    <div style={{minHeight:"100vh"}}>
      {/* Mobile top bar */}
      <div className="mobile-topbar">
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:18}}>🏋️</span>
          <span className="mono" style={{fontSize:14,fontWeight:700,color:"#0ea5e9"}}>{GYM_NAME}</span>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn wa" style={{fontSize:11,padding:"7px 11px"}} onClick={()=>setShowBulkWA(true)}>📱</button>
          <button className="btn ghost" style={{fontSize:11,padding:"7px 11px"}} onClick={onLogout}>⏏</button>
        </div>
      </div>

      {/* Secondary nav tabs */}
      {["forum","reminders","income"].includes(view)&&(
        <div style={{display:"flex",gap:6,padding:"8px 14px 0",overflowX:"auto"}}>
          {[["forum","💬 Foro"],["reminders","🔔 Alertas"],["income","💶 Ingresos"]].map(([id,label])=>(
            <button key={id} className={"tab"+(view===id?" on":"")} onClick={()=>setView(id)} style={{flexShrink:0,fontSize:12}}>{label}</button>
          ))}
          <button className={"tab"} onClick={()=>setView("dashboard")} style={{flexShrink:0,fontSize:12,color:"#475569"}}>← Volver</button>
        </div>
      )}

      {/* Bottom navigation - mobile only */}
      <nav className="bottom-nav">
        {[
          {id:"dashboard",icon:"🏠",label:"Inicio"},
          {id:"clients",icon:"👥",label:"Clientes"},
          {id:"feed",icon:"🎯",label:"Lista"},
          {id:"schedule",icon:"📅",label:"Agenda"},
          {id:"programming",icon:"📊",label:"Programa"},
          {id:"exercises",icon:"🏋️",label:"Ejercicios"},
        ].map(item=>(
          <button key={item.id} className={"bnav-btn"+(view===item.id?" on":"")} onClick={()=>setView(item.id)}>
            <span className="bnav-icon">
              {item.icon}
              {item.count>0&&<span className="bnav-badge">{item.count}</span>}
            </span>
            <span>{item.label}</span>
          </button>
        ))}
      </nav>

      {saving&&<div style={{position:"fixed",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,#0ea5e9,#4ade80)",zIndex:500}}/>}
      {saving&&<div style={{position:"fixed",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,#0ea5e9,#4ade80)",zIndex:500}}/>}


      {/* Content */}
      <div style={{padding:"14px 14px 80px",minHeight:"100vh",background:"#05080f"}} className="fade admin-content">

        {/* DASHBOARD */}
        {view==="dashboard"&&(
          <div>
            <div style={{marginBottom:24}}>
              <h1 className="mono" style={{fontSize:20,fontWeight:700}}>{GYM_NAME} — Dashboard</h1>
              <p style={{color:"#334155",fontSize:12,marginTop:4}}>{fmtLong(TODAY)}</p>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
              {[
                {label:"Clientes",val:clients.length,color:"#38bdf8"},
                {label:"Activos",val:clients.filter(c=>statusOf(c)==="active").length,color:"#4ade80"},
                {label:"Alertas",val:reminders.length,color:"#facc15"},
                {label:"Sesiones hoy",val:todaySessions.length,color:"#a78bfa"},
                {label:"Este mes",val:`${monthIncome}€`,color:"#4ade80"},
              ].map(s=>(
                <div key={s.label} className="card">
                  <div className="mono" style={{fontSize:22,fontWeight:700,color:s.color}}>{s.val}</div>
                  <div style={{fontSize:10,color:"#334155",marginTop:5,fontWeight:700}}>{s.label.toUpperCase()}</div>
                </div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
              <div className="card">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                  <h3 style={{fontSize:13,fontWeight:700}}>Sesiones de hoy</h3>
                  <button className="btn sky" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>{setView("schedule");setShowNS(true);}}>+ Nueva</button>
                </div>
                {todaySessions.length===0?<p style={{fontSize:12,color:"#1e293b"}}>Sin sesiones hoy</p>
                  :todaySessions.sort((a,b)=>a.time.localeCompare(b.time)).map(s=>{
                    const c=clients.find(x=>x.id===s.client_id); if(!c) return null;
                    return(
                      <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #0d1520"}}>
                        <div className="ring" style={{width:32,height:32,background:c.color+"20",color:c.color,fontSize:10}}>{ini(c.name)}</div>
                        <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{c.name}</div><div style={{fontSize:11,color:"#475569"}}>{s.type}</div></div>
                        <div style={{textAlign:"right"}}>
                          <div className="mono" style={{fontSize:13,fontWeight:600,color:"#38bdf8"}}>{s.time}</div>
                          <button className="btn grn" style={{fontSize:10,padding:"3px 7px",marginTop:3}} onClick={()=>completeSession(s)}>✓ Hecha</button>
                        </div>
                      </div>
                    );
                  })
                }
              </div>
              <div className="card">
                <h3 style={{fontSize:13,fontWeight:700,marginBottom:14}}>Solicitudes pendientes</h3>
                {requests.length===0?<p style={{fontSize:12,color:"#1e293b"}}>Sin solicitudes ✓</p>
                  :requests.map(r=>{
                    const c=clients.find(x=>x.id===r.client_id); if(!c) return null;
                    return(
                      <div key={r.id} style={{background:"#080f1e",borderRadius:10,padding:10,marginBottom:8,border:"1px solid #1e3a5a"}}>
                        <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:8}}>
                          <div className="ring" style={{width:30,height:30,background:c.color+"20",color:c.color,fontSize:10}}>{ini(c.name)}</div>
                          <div><div style={{fontSize:12,fontWeight:700}}>{c.name}</div><div style={{fontSize:11,color:"#64748b"}}>{r.type} · {fmtDate(r.date)} {r.time}</div></div>
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          <button className="btn grn" style={{flex:1,fontSize:11,padding:"6px 8px"}} onClick={()=>approveRequest(r.id)}>✓ Aprobar</button>
                          <button className="btn danger" style={{flex:1,fontSize:11,padding:"6px 8px"}} onClick={()=>denyRequest(r.id)}>✕ Rechazar</button>
                        </div>
                      </div>
                    );
                  })
                }
              </div>
            </div>
          </div>
        )}

        {/* FEED — PASAR LISTA */}
        {view==="feed"&&(
          <div>
            <div style={{marginBottom:20}}>
              <h1 className="mono" style={{fontSize:20,fontWeight:700}}>Pasar lista</h1>
              <p style={{color:"#334155",fontSize:12,marginTop:4}}>Marca quién entrena — se descuenta de su bono automáticamente.</p>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:12}}>
              {clients.map(c=>{
                const nextSess=sessions.filter(s=>s.client_id===c.id&&!s.requested&&s.date>=TODAY)
                  .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
                return {c,nextSess,today:!!nextSess&&nextSess.date===TODAY};
              }).sort((a,b)=>{
                if(a.today!==b.today) return a.today?-1:1;                       // sesión hoy primero
                if(a.today&&b.today) return a.nextSess.time.localeCompare(b.nextSess.time); // por hora
                return 0;
              }).map(({c,nextSess,today})=>{
                const st=statusOf(c);
                const pd=daysUntil(c.next_payment);
                const cHist=history.filter(h=>h.client_id===c.id).sort((a,b)=>(b.date+(b.time||"")).localeCompare(a.date+(a.time||"")));
                const last=cHist[0];
                return(
                  <div key={c.id} className="card" style={{border:`1px solid ${today?"#0e3a5c":"var(--border)"}`}}>
                    <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:12}}>
                      {c.avatar_url
                        ?<img src={c.avatar_url} alt={c.name} style={{width:46,height:46,borderRadius:"50%",objectFit:"cover",border:`1.5px solid ${c.color}45`}}/>
                        :<div className="ring" style={{width:46,height:46,background:c.color+"18",color:c.color,border:`1.5px solid ${c.color}35`,fontSize:14}}>{ini(c.name)}</div>}

                        <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>

                        </div>
                        <div style={{fontSize:11,color:"#64748b",marginTop:2}}>Bono {c.total_sessions} · {c.payment_amount}€</div>

                      <span className="pill" style={{background:statusColor(st)+"18",color:statusColor(st),border:`1px solid ${statusColor(st)}30`,whiteSpace:"nowrap"}}>{c.sessions_left}/{c.total_sessions}</span>

                      </div>
                      <div style={{background:"#080d14",borderRadius:9,padding:"8px 10px"}}>
                        <div style={{color:"#334155",fontWeight:700,fontSize:9,marginBottom:3,letterSpacing:.5}}>ÚLTIMA SESIÓN</div>
                        <div style={{fontSize:12,color:"#94a3b8"}}>{last?fmtDate(last.date):"—"}</div>
                      </div>
                      <div style={{background:"#080d14",borderRadius:9,padding:"8px 10px",gridColumn:"1 / -1"}}>
                        <div style={{color:"#334155",fontWeight:700,fontSize:9,marginBottom:3,letterSpacing:.5}}>SESIÓN AGENDADA</div>
                        <div style={{fontSize:12,color:nextSess?"#38bdf8":"#475569"}}>{nextSess?`${nextSess.date===TODAY?"Hoy":fmtDate(nextSess.date)} · ${nextSess.time} · ${nextSess.type}`:"Sin agendar"}</div>
                      </div>
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      <button className="btn grn" style={{flex:1,padding:"9px",justifyContent:"center"}} onClick={()=>nextSess?completeSession(nextSess):countWalkin(c)}>✓ Vino</button>
                      <button className="btn danger" style={{padding:"9px 12px",opacity:nextSess?1:0.35}} disabled={!nextSess} onClick={()=>nextSess&&deleteSession(nextSess.id)}>✗ No vino</button>
                      <button className="btn wa" style={{padding:"9px 12px"}} onClick={()=>setWaClient(c)}>📱</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* CLIENTS */}
        {view==="clients"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
              <div><h1 className="mono" style={{fontSize:20,fontWeight:700}}>Clientes</h1><p style={{color:"#334155",fontSize:12,marginTop:3}}>{clients.length} registrados</p></div>
              <button className="btn sky" onClick={()=>setShowNC(true)}>+ Nuevo</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
              {clients.map(c=>{
                const st=statusOf(c),pct=Math.round(c.sessions_left/c.total_sessions*100),pd=daysUntil(c.next_payment),open=expanded===c.id;
                const cSess=sessions.filter(s=>s.client_id===c.id&&s.date>=TODAY);
                const cHist=history.filter(h=>h.client_id===c.id);
                const streak=calcStreak(cHist);
                return(
                  <div key={c.id} className="card" style={{cursor:"pointer",transition:"all .2s",border:`1px solid ${open?"#0e3a5c":"var(--border)"}`}} onClick={()=>setExpanded(open?null:c.id)}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                      <div style={{display:"flex",gap:11,alignItems:"center"}}>
                        <div className="ring" style={{width:42,height:42,background:c.color+"18",color:c.color,border:`1.5px solid ${c.color}35`,fontSize:13}}>{ini(c.name)}</div>
                        <div>
                          <div style={{fontWeight:700,fontSize:14}}>{c.name}</div>
                          <div style={{display:"flex",gap:6,alignItems:"center",marginTop:2}}>
                            <div className="mono" style={{color:"#334155",fontSize:11}}>#{c.code}</div>
                            {streak>0&&<span style={{fontSize:10,color:"#fb923c"}}>🔥{streak}</span>}
                          </div>
                        </div>
                      </div>
                      <span className="pill" style={{background:statusColor(st)+"18",color:statusColor(st),border:`1px solid ${statusColor(st)}30`}}>{statusLabel(st)}</span>
                    </div>
                    <div style={{marginBottom:11}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                        <span style={{fontSize:10,color:"#475569",fontWeight:700}}>SESIONES</span>
                        <span className="mono" style={{fontSize:11,fontWeight:700}}>{c.sessions_left}/{c.total_sessions}</span>
                      </div>
                      <div className="pbar"><div className="pfill" style={{width:`${pct}%`,background:pct>40?"#4ade80":pct>20?"#facc15":"#f87171"}}/></div>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div>
                        <div style={{fontSize:10,color:"#334155",fontWeight:700}}>PRÓXIMO PAGO</div>
                        <div style={{fontSize:12,color:pd<=3?"#f87171":"#64748b"}}>{pd<0?"Vencido":pd===0?"Hoy":`${pd}d`} · {c.payment_amount}€</div>
                      </div>
                      <button className="btn wa" style={{fontSize:11}} onClick={e=>{e.stopPropagation();setWaClient(c);}}>📱 WA</button>
                    </div>
                    {open&&(
                      <div style={{marginTop:14,borderTop:"1px solid #0d1520",paddingTop:14}} onClick={e=>e.stopPropagation()}>
                        <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:14}}>
                          <button className="btn sky" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>setShowPay(c)}>💳 Pago</button>
                          <button className="btn grn" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>renewSessions(c)}>↺ Renovar</button>
                          <button className="btn danger" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>deleteClient(c.id)}>🗑</button>
                        </div>
                        {/* Avatar upload */}
                        <div style={{marginBottom:14}}>
                          <span className="lbl">FOTO DE PERFIL</span>
                          <div style={{display:"flex",alignItems:"center",gap:12,marginTop:4}}>
                            {c.avatar_url
                              ? <img src={c.avatar_url} style={{width:52,height:52,borderRadius:"50%",objectFit:"cover",border:`2px solid ${c.color}`}}/>
                              : <div className="ring" style={{width:52,height:52,background:c.color+"20",color:c.color,fontSize:16,border:`2px solid ${c.color}40`}}>{ini(c.name)}</div>
                            }
                            <div style={{flex:1}}>
                              <input type="file" accept="image/*" id={"av"+c.id} style={{display:"none"}}
                                onChange={async(e)=>{
                                  const file=e.target.files[0]; if(!file) return;
                                  const ext=file.name.split(".").pop();
                                  const path=`${c.id}.${ext}`;
                                  const {error:upErr}=await sb.storage.from("avatars").upload(path,file,{upsert:true});
                                  if(upErr){notify("Error subiendo foto","err");return;}
                                  const {data}=sb.storage.from("avatars").getPublicUrl(path);
                                  await sb.from("clients").update({avatar_url:data.publicUrl+"?t="+Date.now()}).eq("id",c.id);
                                  await loadAll();
                                  notify("Foto actualizada ✓");
                                }}
                              />
                              <label htmlFor={"av"+c.id} className="btn sky" style={{fontSize:11,padding:"7px 12px",cursor:"pointer",display:"inline-block"}}>
                                📷 {c.avatar_url?"Cambiar foto":"Subir foto"}
                              </label>
                              {c.avatar_url&&<button className="btn danger" style={{fontSize:11,padding:"7px 10px",marginLeft:6}} onClick={async()=>{
                                await sb.from("clients").update({avatar_url:null}).eq("id",c.id);
                                await loadAll(); notify("Foto eliminada");
                              }}>✕</button>}
                            </div>
                          </div>
                        </div>

                        {/* Private notes */}
                        <div style={{marginBottom:14}}>
                          <span className="lbl">NOTAS PRIVADAS (solo tú las ves)</span>
                          <NotesEditor initialNotes={c.notes||""} onSave={(n)=>saveNotes(c.id,n)}/>
                        </div>
                        <div style={{fontSize:10,color:"#334155",fontWeight:700,marginBottom:8}}>PRÓXIMAS SESIONES</div>
                        {cSess.length===0?<p style={{fontSize:12,color:"#1e293b"}}>Sin sesiones agendadas</p>
                          :cSess.sort((a,b)=>a.date.localeCompare(b.date)).map(s=>(
                            <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #090f1a"}}>
                              <div>
                                <div style={{fontSize:12}}>{fmtDate(s.date)} · {s.time}</div>
                                <div style={{fontSize:11,color:"#475569"}}>{s.type}{s.requested&&<span style={{color:"#fb923c",marginLeft:6,fontWeight:700}}>· solicitud</span>}</div>
                              </div>
                              <div style={{display:"flex",gap:5}}>
                                {s.requested
                                  ?<><button className="btn grn" style={{fontSize:10,padding:"4px 7px"}} onClick={()=>approveRequest(s.id)}>✓</button>
                                    <button className="btn danger" style={{padding:"4px 7px"}} onClick={()=>denyRequest(s.id)}>✕</button></>
                                  :<><button className="btn sky" style={{fontSize:10,padding:"4px 7px"}} onClick={()=>completeSession(s)}>✓ Hecha</button>
                                    <button className="btn danger" style={{padding:"4px 7px"}} onClick={()=>deleteSession(s.id)}>✕</button></>
                                }
                              </div>
                            </div>
                          ))
                        }
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* SCHEDULE */}
        {view==="schedule"&&(
          <div>
            {/* Header */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <h1 className="mono" style={{fontSize:18,fontWeight:700}}>Agenda</h1>
              <div style={{display:"flex",gap:8}}>
                <button className="btn ghost" style={{fontSize:12,padding:"8px 12px"}} onClick={()=>setShowSched(true)}>⚙️ Horario</button>
                <button className="btn sky" style={{fontSize:12,padding:"8px 14px"}} onClick={()=>setShowNS(true)}>+ Nueva</button>
              </div>
            </div>

            {/* View switcher */}
            <div className="seg" style={{marginBottom:14}}>
              {[["day","Día"],["week","Semana"],["month","Mes"]].map(([id,label])=>(
                <button key={id} className={"sb"+(schedView===id?" on":"")} onClick={()=>setSchedView(id)}>{label}</button>
              ))}
            </div>

            {/* Day nav */}
            {(schedView==="day"||schedView==="week")&&(
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,overflowX:"auto",paddingBottom:4}}>
                <button className="btn ghost" style={{padding:"6px 10px",fontSize:13,flexShrink:0}} onClick={()=>{
                  const d=new Date(activeDay+"T12:00:00");
                  d.setDate(d.getDate()-(schedView==="week"?7:1));
                  setActiveDay(d.toISOString().split("T")[0]);
                }}>‹</button>
                {schedView==="week"
                  ? getWeekDays(activeDay).map(day=>{
                      const cnt=sessions.filter(s=>s.date===day).length;
                      const isBlk=blocked.some(b=>b.date===day&&b.time==="ALL");
                      return(
                        <button key={day} className={"tab"+(activeDay===day?" on":"")} onClick={()=>setActiveDay(day)}
                          style={{flexShrink:0,opacity:isBlk?0.4:1}}>
                          <div>{fmtDate(day)}</div>
                          {cnt>0&&<div style={{fontSize:9,color:"#38bdf8"}}>{cnt}</div>}
                          {isBlk&&<div style={{fontSize:9,color:"#f87171"}}>🚫</div>}
                        </button>
                      );
                    })
                  : <span style={{fontSize:14,fontWeight:600,color:"#94a3b8",flex:1,textAlign:"center"}}>{fmtLong(activeDay)}</span>
                }
                <button className="btn ghost" style={{padding:"6px 10px",fontSize:13,flexShrink:0}} onClick={()=>{
                  const d=new Date(activeDay+"T12:00:00");
                  d.setDate(d.getDate()+(schedView==="week"?7:1));
                  setActiveDay(d.toISOString().split("T")[0]);
                }}>›</button>
              </div>
            )}

            {/* Block day / vacation buttons */}
            <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
              <button className="btn ghost" style={{fontSize:11,padding:"7px 12px"}}
                onClick={()=>toggleBlockDay(activeDay)}>
                {blocked.some(b=>b.date===activeDay&&b.time==="ALL")?"✓ Día desbloqueado":"🚫 Bloquear día"}
              </button>
              <button className="btn ghost" style={{fontSize:11,padding:"7px 12px",color:"#facc15"}}
                onClick={()=>setShowVacation(true)}>🏖 Vacaciones</button>
            </div>

            {/* DAY VIEW */}
            {schedView==="day"&&(
              <div className="card" style={{padding:0,overflow:"hidden"}}>
                {daySlots.map((time,i)=>{
                  const slotBlocked=isBlocked(activeDay,time)||blocked.some(b=>b.date===activeDay&&b.time==="ALL");
                  const slots=!slotBlocked?sessions.filter(s=>s.date===activeDay&&s.time===time)
                    .map(s=>({...s,client:clients.find(c=>c.id===s.client_id)})).filter(s=>s.client):[];
                  const cap=capOf(time), isWork=workSlots.includes(time), full=slots.length>=cap;
                  return(
                    <div key={time} style={{display:"flex",borderBottom:i<daySlots.length-1?"1px solid #0d1520":"none",minHeight:52,background:slotBlocked?"#0d0505":isWork?"transparent":"#070a10"}}>
                      <div className="mono" style={{width:56,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",borderRight:"1px solid #0d1520",color:slotBlocked?"#4a1515":"#1e3a5a",fontSize:11,fontWeight:700}}>{time}</div>
                      <div style={{flex:1,padding:"7px 10px",display:"flex",flexWrap:"wrap",gap:5,alignItems:"center"}}>
                        {slotBlocked
                          ?<span style={{fontSize:11,color:"#4a1515",cursor:"pointer"}} onClick={()=>toggleBlock(activeDay,time)}>🚫 Bloqueado · toca para desbloquear</span>
                          :<>
                            {slots.map(s=>(
                              <div key={s.id} style={{background:s.client.color+"18",border:`1px solid ${s.client.color}40`,borderRadius:10,padding:"5px 10px 5px 5px",fontSize:12,display:"flex",alignItems:"center",gap:7}}>
                                {s.client.avatar_url
                                  ?<img src={s.client.avatar_url} style={{width:26,height:26,borderRadius:"50%",objectFit:"cover",border:`1.5px solid ${s.client.color}55`}}/>
                                  :<div className="ring" style={{width:26,height:26,background:s.client.color+"30",color:s.client.color,fontSize:9,border:`1.5px solid ${s.client.color}55`}}>{ini(s.client.name)}</div>
                                }
                                <div style={{lineHeight:1.2}}>
                                  <div style={{color:s.client.color,fontWeight:700}}>{s.client.name}</div>
                                  <div style={{color:"#475569",fontSize:10}}>{s.type}{s.requested&&<span style={{color:"#fb923c"}}> · pendiente</span>}</div>
                                </div>
                                <button title="Mover" style={{background:"none",border:"none",cursor:"pointer",color:"#38bdf8",fontSize:13,padding:0,marginLeft:2}} onClick={()=>setMoveSess(s)}>🕐</button>
                                <button title="Completar" style={{background:"none",border:"none",cursor:"pointer",color:"#4ade80",fontSize:14,padding:0}} onClick={()=>completeSession(s)}>✓</button>
                              </div>
                            ))}
                            {slots.length===0&&<span style={{fontSize:11,color:"#1e293b",cursor:"pointer"}} onClick={()=>toggleBlock(activeDay,time)}>{isWork?"Libre · 🔒":"Fuera de horario · 🔒"}</span>}
                            {isWork&&<span style={{marginLeft:"auto",fontSize:10,fontWeight:700,color:full?"#facc15":"#4ade80",background:(full?"#facc15":"#4ade80")+"14",border:`1px solid ${(full?"#facc15":"#4ade80")}30`,borderRadius:20,padding:"2px 8px",whiteSpace:"nowrap"}}>{slots.length}/{cap}</span>}
                          </>
                        }
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* WEEK VIEW - horizontal grid */}
            {schedView==="week"&&(
              <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
                <div style={{minWidth:560}}>
                  {/* Header row - days */}
                  <div style={{display:"grid",gridTemplateColumns:"52px repeat(5,1fr)",gap:2,marginBottom:4}}>
                    <div/>
                    {getWeekDays(activeDay).slice(0,5).map(day=>{
                      const isToday=day===TODAY;
                      const isBlkDay=blocked.some(b=>b.date===day&&b.time==="ALL");
                      const cnt=sessions.filter(s=>s.date===day).length;
                      return(
                        <div key={day} style={{textAlign:"center",padding:"6px 2px",borderRadius:8,
                          background:isToday?"#0c2040":isBlkDay?"#1a0808":"#080d14",
                          border:isToday?"1px solid #1e3a5a":isBlkDay?"1px solid #3f0f0f":"1px solid #0d1520"}}>
                          <div style={{fontSize:10,color:isBlkDay?"#4a1515":isToday?"#38bdf8":"#475569",fontWeight:700,textTransform:"capitalize"}}>
                            {new Date(day+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short"})}
                          </div>
                          <div className="mono" style={{fontSize:14,fontWeight:700,color:isBlkDay?"#4a1515":isToday?"#38bdf8":"#e2e8f0"}}>
                            {new Date(day+"T12:00:00").getDate()}
                          </div>
                          {cnt>0&&!isBlkDay&&<div style={{fontSize:9,color:"#38bdf8"}}>{cnt} sesiones</div>}
                          {isBlkDay&&<div style={{fontSize:9,color:"#f87171"}}>🚫</div>}
                        </div>
                      );
                    })}
                  </div>
                  {/* Time rows */}
                  {TIME_SLOTS.map((time,i)=>(
                    <div key={time} style={{display:"grid",gridTemplateColumns:"52px repeat(5,1fr)",gap:2,marginBottom:2}}>
                      <div className="mono" style={{display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#1e3a5a",fontWeight:700,paddingRight:4}}>{time}</div>
                      {getWeekDays(activeDay).slice(0,5).map(day=>{
                        const isBlkDay=blocked.some(b=>b.date===day&&b.time==="ALL");
                        const slotBlocked=isBlkDay||isBlocked(day,time);
                        const daySessions=sessions.filter(s=>s.date===day&&s.time===time)
                          .map(s=>({...s,client:clients.find(c=>c.id===s.client_id)})).filter(s=>s.client);
                        return(
                          <div key={day} style={{minHeight:40,borderRadius:6,padding:"3px",
                            background:slotBlocked?"#0d0505":daySessions.length>0?"#080d14":"#060a10",
                            border:slotBlocked?"1px solid #3f0f0f":daySessions.length>0?"1px solid #1e293b":"1px solid #0d1520",
                            cursor:"pointer"}}
                            onClick={()=>{if(!slotBlocked)toggleBlock(day,time);}}>
                            {slotBlocked&&<div style={{fontSize:9,color:"#4a1515",textAlign:"center",paddingTop:4}}>🚫</div>}
                            {daySessions.map(s=>(
                              <div key={s.id} style={{background:s.client.color+"25",borderRadius:4,padding:"2px 4px",marginBottom:2,cursor:"default"}}
                                onClick={e=>e.stopPropagation()}>
                                <div style={{fontSize:9,color:s.client.color,fontWeight:700,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                                  {s.client.name.split(" ")[0]}
                                </div>
                                <div style={{fontSize:8,color:"#475569"}}>{s.type}</div>
                                <button style={{background:"none",border:"none",cursor:"pointer",color:"#4ade80",fontSize:10,padding:0,display:"block"}} onClick={()=>completeSession(s)}>✓</button>
                              </div>
                            ))}
                          </div>
                        );
                      })}
                    </div>
                  ))}
                  <p style={{fontSize:10,color:"#334155",marginTop:8,paddingLeft:56}}>💡 Toca celda vacía para bloquear/desbloquear ese slot</p>
                </div>
              </div>
            )}

            {/* Month view */}
            {schedView==="month"&&(
              <div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                  <button className="btn ghost" style={{padding:"6px 10px",fontSize:13}} onClick={()=>{const d=new Date(calDate);d.setMonth(d.getMonth()-1);setCalDate(d);}}>‹</button>
                  <span style={{fontSize:14,fontWeight:600,textTransform:"capitalize"}}>{fmtMonth(calDate.toISOString().split("T")[0])}</span>
                  <button className="btn ghost" style={{padding:"6px 10px",fontSize:13}} onClick={()=>{const d=new Date(calDate);d.setMonth(d.getMonth()+1);setCalDate(d);}}>›</button>
                </div>
                <div className="card">
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:6}}>
                    {["L","M","X","J","V","S","D"].map(d=>(
                      <div key={d} style={{textAlign:"center",fontSize:10,color:"#334155",fontWeight:700,padding:"3px 0"}}>{d}</div>
                    ))}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
                    {getMonthDays(calDate.getFullYear(),calDate.getMonth()).map((cell,i)=>{
                      const dateStr=cell.cur?getDayStr(cell.day):"";
                      const hasSess=dateStr&&sessions.some(s=>s.date===dateStr);
                      const isToday=dateStr===TODAY;
                      const blkEntry=dateStr&&blocked.find(b=>b.date===dateStr&&b.time==="ALL");
                      const isBlk=!!blkEntry&&blkEntry.reason==="Día bloqueado";
                      const isVac=!!blkEntry&&blkEntry.reason==="Vacaciones";
                      const isFest=!!blkEntry&&blkEntry.reason==="Festivo";
                      return(
                        <div key={i} style={{
                          aspectRatio:"1",borderRadius:8,display:"flex",flexDirection:"column",
                          alignItems:"center",justifyContent:"center",cursor:cell.cur?"pointer":"default",

// ── MOVER SESIÓN (reprogramar) ─────────────────────────────────────────────
function MoveSessionModal({sess,sessions,clients,config,onMove,onClose}) {
  const [date,setDate] = React.useState(sess.date);
  const cliente = clients.find(c=>c.id===sess.client_id);
  const workSlots = [...genSlots(config.morningFrom,config.morningTo),...genSlots(config.afternoonFrom,config.afternoonTo)];
  const capOf = (t)=>(config.capacity&&config.capacity[t]!=null)?config.capacity[t]:config.defaultCapacity;
  // Ocupación del destino sin contar la propia sesión que estamos moviendo.
  const takenAt = (t)=>sessions.filter(s=>s.date===date&&s.time===t&&s.id!==sess.id).length;
  const slots = Array.from(new Set([...workSlots, sess.date===date?sess.time:null].filter(Boolean))).sort();

  const pick = (t)=>{
    if(date===sess.date && t===sess.time) return onClose(); // sin cambios
    const free = capOf(t)-takenAt(t);
    if(free<=0 && !window.confirm(`⚠️ Las ${t} ya están completas (${takenAt(t)}/${capOf(t)}).\n¿Mover igualmente?`)) return;
    onMove(date,t);
  };

  return(
    <div className="ovl" onClick={onClose}>
      <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
        <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:4}}>🕐 Mover sesión</h2>
        <p style={{fontSize:12,color:"#475569",marginBottom:16}}>{cliente?cliente.name:"Cliente"} · {sess.type} — ahora el {fmtDate(sess.date)} a las {sess.time}</p>

        <div style={{marginBottom:14}}><span className="lbl">NUEVO DÍA</span>
          <input type="date" className="inp" value={date} min={TODAY} onChange={e=>setDate(e.target.value)}/>
        </div>

        <span className="lbl">NUEVA HORA</span>
        <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:6,maxHeight:280,overflowY:"auto"}}>
          {slots.map(t=>{
            const actual = date===sess.date && t===sess.time;
            const cap=capOf(t), taken=takenAt(t), free=cap-taken, full=free<=0, isWork=workSlots.includes(t);
            return(
              <button key={t} onClick={()=>pick(t)}
                style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:11,cursor:"pointer",fontFamily:"inherit",textAlign:"left",
                  background:actual?"#0c2040":isWork?"#050e05":"#0a0d12",
                  border:`1px solid ${actual?"#1e3a5a":full?"#3f1a1a":isWork?"#14532d":"#161c28"}`}}>
                <span className="mono" style={{fontSize:14,fontWeight:700,color:actual?"#38bdf8":"#e8edf5",minWidth:44}}>{t}</span>
                <span style={{flex:1,fontSize:12,color:actual?"#38bdf8":full?"#f87171":"#4ade80",fontWeight:700}}>
                  {actual?"Actual":full?`Completa ${taken}/${cap}`:`${free} libre${free>1?"s":""} · ${taken}/${cap}`}
                </span>
                {!actual&&<span style={{fontSize:11,color:"#475569"}}>Mover aquí →</span>}
              </button>
            );
          })}
        </div>

        <button className="btn ghost" style={{width:"100%",marginTop:16,padding:11}} onClick={onClose}>Cancelar</button>
      </div>
    </div>
  );
}

// ── SCHEDULE / HORARIO MODAL ───────────────────────────────────────────────
// Configura las franjas de mañana y tarde (sesiones de 1h) y los atletas por hora.
function ScheduleModal({config,onSave,onClose}) {
  const [cfg,setCfg] = React.useState({...DEFAULT_SCHEDULE,...config,capacity:{...(config.capacity||{})}});
  const slots = [...genSlots(cfg.morningFrom,cfg.morningTo),...genSlots(cfg.afternoonFrom,cfg.afternoonTo)];
  // Capacidad entre 1 y 5 atletas por hora.
  const capOf = (t) => cfg.capacity[t]!=null?cfg.capacity[t]:cfg.defaultCapacity;
  const setCap = (t,v) => setCfg(c=>({...c,capacity:{...c.capacity,[t]:Math.min(5,Math.max(1,parseInt(v||1,10)))}}));
  const hourSel = (val,onCh) => (
    <select className="inp" style={{appearance:"none"}} value={val} onChange={e=>onCh(e.target.value)}>
      {HOURS.map(h=><option key={h} value={h}>{h}</option>)}
    </select>
  );
  return(
    <div className="ovl" onClick={onClose}>
      <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:440}}>
        <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:4}}>⚙️ Horario de trabajo</h2>
        <p style={{fontSize:12,color:"#475569",marginBottom:18}}>Clases de 1 hora en punto. Define tus franjas y cuántos atletas admites por hora (de 1 a 5).</p>

        <div style={{marginBottom:16}}>
          <span className="lbl">☀️ MAÑANA</span>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {hourSel(cfg.morningFrom,v=>setCfg(c=>({...c,morningFrom:v})))}
            <span style={{color:"#475569",fontSize:13}}>a</span>
            {hourSel(cfg.morningTo,v=>setCfg(c=>({...c,morningTo:v})))}
          </div>
        </div>
        <div style={{marginBottom:16}}>
          <span className="lbl">🌙 TARDE</span>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {hourSel(cfg.afternoonFrom,v=>setCfg(c=>({...c,afternoonFrom:v})))}
            <span style={{color:"#475569",fontSize:13}}>a</span>
            {hourSel(cfg.afternoonTo,v=>setCfg(c=>({...c,afternoonTo:v})))}
          </div>
        </div>

        <div style={{marginBottom:8}}>
          <span className="lbl">👥 ATLETAS POR HORA (1–5)</span>
          {slots.length===0
            ?<p style={{fontSize:12,color:"#334155"}}>Ajusta las franjas para ver las horas.</p>
            :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:8}}>
              {slots.map(t=>{const cap=capOf(t);return(
                <div key={t} style={{background:"#080d14",borderRadius:9,padding:"7px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:6}}>
                  <span className="mono" style={{fontSize:12,color:"#94a3b8"}}>{t}</span>
                  <div style={{display:"flex",alignItems:"center",gap:5}}>
                    <button className="btn ghost" style={{padding:"3px 8px",fontSize:15,lineHeight:1,opacity:cap<=1?0.35:1}} disabled={cap<=1} onClick={()=>setCap(t,cap-1)}>−</button>
                    <span className="mono" style={{width:14,textAlign:"center",fontWeight:700,fontSize:13,color:"#38bdf8"}}>{cap}</span>
                    <button className="btn ghost" style={{padding:"3px 8px",fontSize:15,lineHeight:1,opacity:cap>=5?0.35:1}} disabled={cap>=5} onClick={()=>setCap(t,cap+1)}>+</button>
                  </div>
                </div>
              );})}
            </div>
          }
        </div>

        <div style={{display:"flex",gap:8,marginTop:18}}>
          <button className="btn sky" style={{flex:1,padding:11}} onClick={()=>{onSave(cfg);onClose();}}>Guardar horario</button>
          <button className="btn ghost" style={{flex:1,padding:11}} onClick={onClose}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}

// ── BULK WA MODAL ──────────────────────────────────────────────────────────
// Plantillas por grupo. Los comodines {nombre} {sesiones} {importe} {vence}
// se rellenan solos con los datos de cada cliente.
const WA_TEMPLATES = {
  pay: "Hola {nombre}! 👋 Te recuerdo que tu cuota de {importe}€ vence {vence}. ¡Cualquier duda aquí estoy! 💪",
  low: "Hola {nombre}! Te quedan {sesiones} sesión(es). ¿Renovamos el paquete para no interrumpir tu progreso? 🔥💪",
  expired: "Hola {nombre}! Se te agotaron las sesiones. ¿Renovamos para seguir entrenando? 💪",
  all: "Hola {nombre}! 👋 Te escribo desde Kikote Gym. ",
};
// Rellena una plantilla con los datos reales de un cliente.
const fillWA = (tpl,c) => {
  const pd = daysUntil(c.next_payment);
  const abs = Math.abs(pd);
  const vence = isNaN(pd) ? "pronto" : pd===0 ? "hoy" : pd<0 ? `hace ${abs} día${abs===1?"":"s"}` : `en ${pd} día${pd===1?"":"s"}`;
  return tpl
    .split("{nombre}").join(c.name.split(" ")[0])
    .split("{sesiones}").join(c.sessions_left)
    .split("{importe}").join(c.payment_amount??"")
    .split("{vence}").join(vence);
};

function BulkWAModal({clients,onClose,notify}) {
  const [selected,setSelected]=React.useState("pay");
  const [msg,setMsg]=React.useState(WA_TEMPLATES.pay);

  // "Ya avisados hoy" se guarda en el móvil (no repites a nadie ni al recargar).
  const doneKey = `kikote_wa_${TODAY}`;
  const [done,setDone]=React.useState(()=>{
    try { return new Set(JSON.parse(localStorage.getItem(doneKey)||"[]")); } catch { return new Set(); }
  });
  const marcar = (id)=>setDone(prev=>{
    const n=new Set(prev); n.add(id);
    try { localStorage.setItem(doneKey,JSON.stringify([...n])); } catch {}
    return n;
  });
  const reiniciar = ()=>{ try{localStorage.removeItem(doneKey);}catch{} setDone(new Set()); };

  const grupos = {
    pay: clients.filter(c=>daysUntil(c.next_payment)<=5),
    low: clients.filter(c=>c.sessions_left<=2&&c.sessions_left>0),
    expired: clients.filter(c=>c.sessions_left===0),
    all: clients,
  };
  const targets = grupos[selected]||clients;
  // Sin avisar primero, avisados abajo: así vas tocando en fila.
  const ordenados = [...targets].sort((a,b)=>(done.has(a.id)?1:0)-(done.has(b.id)?1:0));
  const hechos = targets.filter(c=>done.has(c.id)).length;

  const cambiarGrupo = (g)=>{ setSelected(g); setMsg(WA_TEMPLATES[g]); };

  return(
    <div className="ovl" onClick={onClose}>
      <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:500}}>
        <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:6}}>📱 WhatsApp masivo</h2>
        <p style={{fontSize:12,color:"#475569",marginBottom:16}}>Elige el grupo, el mensaje ya viene escrito. Toca cada cliente para abrir WhatsApp y enviar.</p>
        <div className="seg" style={{marginBottom:14,flexWrap:"wrap"}}>
          <button className={`sb ${selected==="pay"?"on":""}`} onClick={()=>cambiarGrupo("pay")}>💳 Pago ({grupos.pay.length})</button>
          <button className={`sb ${selected==="low"?"on":""}`} onClick={()=>cambiarGrupo("low")}>⚡ Pocas ({grupos.low.length})</button>
          <button className={`sb ${selected==="expired"?"on":""}`} onClick={()=>cambiarGrupo("expired")}>🚫 Sin sesiones ({grupos.expired.length})</button>
          <button className={`sb ${selected==="all"?"on":""}`} onClick={()=>cambiarGrupo("all")}>Todos ({grupos.all.length})</button>
        </div>
        <div>
          <span className="lbl">MENSAJE (se personaliza por cliente)</span>
          <textarea className="inp" rows={3} style={{resize:"vertical"}} value={msg} onChange={e=>setMsg(e.target.value)}/>
          <p style={{fontSize:10,color:"#334155",marginTop:5}}>Comodines: {"{nombre} {sesiones} {importe} {vence}"} — se rellenan solos.</p>
        </div>
        {targets.length>0?(
          <div style={{marginTop:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:11,color:"#334155",fontWeight:700}}>AVISADOS {hechos}/{targets.length}</div>
              {hechos>0&&<button className="btn ghost" style={{fontSize:10,padding:"3px 9px"}} onClick={reiniciar}>Reiniciar</button>}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:260,overflowY:"auto"}}>
              {ordenados.map(c=>{
                const ok=done.has(c.id);
                return(
                  <a key={c.id} href={msg?waLink(c.phone||TRAINER_PHONE,fillWA(msg,c)):"#"} target="_blank" rel="noreferrer"
                    style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:ok?"#0a0f0a":"#050e05",
                      border:`1px solid ${ok?"#1e3a24":"#14532d"}`,borderRadius:10,textDecoration:"none",opacity:ok?0.55:1}}
                    onClick={()=>{marcar(c.id);notify(`Abriendo WA de ${c.name}...`,"wa");}}>
                    <div className="ring" style={{width:30,height:30,background:c.color+"20",color:c.color,fontSize:10}}>{ini(c.name)}</div>
                    <div style={{flex:1,fontSize:13,fontWeight:600,color:ok?"#475569":"#4ade80"}}>{c.name}</div>
                    <span style={{fontSize:11,color:ok?"#4ade80":"#475569"}}>{ok?"✓ avisado":"📱 Abrir"}</span>
                  </a>
                );
              })}
            </div>
          </div>
        ):(
          <p style={{fontSize:12,color:"#334155",marginTop:14}}>No hay clientes en este grupo ahora mismo. 🎉</p>
        )}
        <button className="btn ghost" style={{width:"100%",marginTop:14,padding:10}} onClick={onClose}>Cerrar</button>
      </div>
    </div>
  );
}

  const [config,setConfig]=React.useState(DEFAULT_SCHEDULE);

  // Carga el horario/capacidad definidos por el coach (para mostrar los huecos).
  React.useEffect(()=>{
    sb.from("app_settings").select("config").eq("id",1).then(({data})=>{
      if(data&&data[0]&&data[0].config) setConfig({...DEFAULT_SCHEDULE,...data[0].config});
    });

  const mySessions=allSessions.filter(s=>s.client_id===client.id&&s.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date));
