      {tab==="plans"&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <h2 style={{fontSize:15,fontWeight:700}}>Planes de entrenamiento</h2>
            <button className="btn sky" style={{fontSize:12,padding:"8px 13px"}} onClick={()=>setShowNewPlan(true)}>+ Nuevo plan</button>
          </div>

          {editPlan?(
            <div>
              <button className="btn ghost" style={{fontSize:12,padding:"7px 12px",marginBottom:14}} onClick={()=>setEditPlan(null)}>← Volver a planes</button>
              <div className="card" style={{marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:16,marginBottom:4}}>{editPlan.name}</div>
                <div style={{fontSize:12,color:"#64748b"}}>{editPlan.category} · {editPlan.duration_weeks} semanas</div>
              </div>
              {(editPlan.plan_days||[]).sort((a,b)=>a.day_number-b.day_number).map(day=>(
                <div key={day.id} className="card" style={{marginBottom:10}}>
                  <div style={{fontWeight:700,fontSize:13,color:"#0284c7",marginBottom:10}}>{day.day_name||`Día ${day.day_number}`}</div>
                  {(day.plan_exercises||[]).sort((a,b)=>a.order_index-b.order_index).map(pe=>(
                    <div key={pe.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #e6ebf3"}}>
                      <div>
                        <div style={{fontSize:13,fontWeight:600}}>{pe.exercise_name}</div>
                        <div style={{fontSize:11,color:"#64748b"}}>{pe.sets} series × {pe.reps} · {pe.rest_seconds}s descanso</div>
                      </div>
                      <button className="btn danger" style={{fontSize:10,padding:"3px 7px"}} onClick={()=>removeEx(pe.id)}>✕</button>
                    </div>
                  ))}
                  <div style={{marginTop:10}}>
                    <select className="inp" style={{appearance:"none",fontSize:12}} onChange={e=>{
                      const ex = exercises.find(x=>x.id===e.target.value);
                      if(ex) addExToDay(day.id,ex.id,ex.name);
                      e.target.value="";
                    }}>
                      <option value="">+ Añadir ejercicio...</option>
                      {exercises.map(e=><option key={e.id} value={e.id}>{e.name} ({e.category})</option>)}
                    </select>
                  </div>
                </div>
              ))}
              <button className="btn ghost" style={{width:"100%",padding:10,fontSize:12,marginTop:4}} onClick={()=>addDay(editPlan.id)}>+ Añadir día</button>
            </div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {plans.map(plan=>(
                <div key={plan.id} className="card">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                    <div>
                      <div style={{fontWeight:700,fontSize:14}}>{plan.name}</div>
                      <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{plan.category} · {plan.duration_weeks} sem · {(plan.plan_days||[]).length} días</div>
                    </div>
                    <div style={{display:"flex",gap:6}}>
                      <button className="btn sky" style={{fontSize:11,padding:"5px 9px"}} onClick={()=>setEditPlan(plan)}>✏️</button>
                      <button className="btn grn" style={{fontSize:11,padding:"5px 9px"}} onClick={()=>setShowAssign(plan.id)}>👥</button>
                      <button className="btn danger" style={{fontSize:10,padding:"5px 8px"}} onClick={()=>deletePlan(plan.id)}>🗑</button>
                    </div>
                  </div>
                  {plan.description&&<div style={{fontSize:12,color:"#94a3b8"}}>{plan.description}</div>}
                </div>
              ))}
              {plans.length===0&&<div className="card" style={{textAlign:"center",padding:32,color:"#94a3b8"}}>Sin planes creados aún</div>}
            </div>
          )}
        </div>
      )}

      {tab==="assign"&&(
        <div>
          <h2 style={{fontSize:15,fontWeight:700,marginBottom:14}}>Planes asignados</h2>
          {clients.map(c=>{
            const cp = clientPlans.filter(x=>x.client_id===c.id&&x.active);
            return(
              <div key={c.id} className="card" style={{marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:cp.length>0?10:0}}>
                  <div className="ring" style={{width:34,height:34,background:c.color+"20",color:c.color,fontSize:11}}>{ini(c.name)}</div>
                  <div style={{flex:1,fontWeight:600,fontSize:13}}>{c.name}</div>
                  <button className="btn sky" style={{fontSize:11,padding:"5px 9px"}} onClick={()=>{setShowAssign("new");setAssignClient(c.id);}}>+ Plan</button>
                </div>
                {cp.map(a=>{
                  const plan=plans.find(p=>p.id===a.plan_id);
                  return plan?(
                    <div key={a.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderTop:"1px solid #e6ebf3"}}>
                      <div>
                        <div style={{fontSize:12,fontWeight:600}}>{plan.name}</div>
                        <div style={{fontSize:10,color:"#64748b"}}>Desde {a.start_date}</div>
                      </div>
                      <button className="btn danger" style={{fontSize:10,padding:"3px 7px"}} onClick={async()=>{
                        await sb.from("client_plans").delete().eq("id",a.id);
                        await loadAll();
                        notify("Plan desasignado");
                      }}>✕</button>
                    </div>
                  ):null;
                })}
              </div>
            );
          })}
        </div>
      )}

      {showNewPlan&&(
        <div className="ovl" onClick={()=>setShowNewPlan(false)}>
          <div className="mdl fade" onClick={e=>e.stopPropagation()}>
            <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:18}}>Nuevo plan</h2>
            <div style={{display:"flex",flexDirection:"column",gap:13}}>
              <div><span className="lbl">NOMBRE *</span><input className="inp" placeholder="Ej. Plan Fuerza 4 semanas" value={np.name} onChange={e=>setNp(v=>({...v,name:e.target.value}))}/></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div><span className="lbl">CATEGORÍA</span>
                  <select className="inp" style={{appearance:"none"}} value={np.category} onChange={e=>setNp(v=>({...v,category:e.target.value}))}>
                    {["Fuerza","Cardio","HIIT","Funcional","Movilidad","Mixto"].map(c=><option key={c}>{c}</option>)}
                  </select>
                </div>
                <div><span className="lbl">SEMANAS</span><input type="number" className="inp" value={np.duration_weeks} onChange={e=>setNp(v=>({...v,duration_weeks:parseInt(e.target.value)}))}/></div>
              </div>
              <div><span className="lbl">DESCRIPCIÓN</span><textarea className="inp" rows={2} style={{resize:"none"}} value={np.description} onChange={e=>setNp(v=>({...v,description:e.target.value}))}/></div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn sky" style={{flex:1,padding:11}} onClick={createPlan}>Crear plan</button>
                <button className="btn ghost" style={{flex:1,padding:11}} onClick={()=>setShowNewPlan(false)}>Cancelar</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {showAssign&&showAssign!=="new"&&(
        <div className="ovl" onClick={()=>setShowAssign(null)}>
          <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:360}}>
            <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:18}}>Asignar plan</h2>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div><span className="lbl">CLIENTE</span>
                <select className="inp" style={{appearance:"none"}} value={assignClient} onChange={e=>setAssignClient(e.target.value)}>
                  <option value="">Seleccionar...</option>
                  {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn sky" style={{flex:1,padding:11}} onClick={()=>assignPlan(showAssign)}>Asignar</button>
                <button className="btn ghost" style={{flex:1,padding:11}} onClick={()=>setShowAssign(null)}>Cancelar</button>
              </div>
            </div>
          </div>
        </div>
      )}
      {showAssign==="new"&&assignClient&&(
        <div className="ovl" onClick={()=>{setShowAssign(null);setAssignClient("");}}>
          <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:360}}>
            <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:18}}>Asignar plan a {clients.find(c=>c.id===assignClient)?.name}</h2>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {plans.map(plan=>(
                <button key={plan.id} className="btn ghost" style={{textAlign:"left",padding:12}} onClick={()=>assignPlan(plan.id)}>
                  <div style={{fontWeight:700}}>{plan.name}</div>
                  <div style={{fontSize:11,color:"#64748b"}}>{plan.category} · {plan.duration_weeks} semanas</div>
                </button>
              ))}
              {plans.length===0&&<p style={{fontSize:13,color:"#94a3b8"}}>Crea un plan primero</p>}
              <button className="btn ghost" style={{padding:10}} onClick={()=>{setShowAssign(null);setAssignClient("");}}>Cancelar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── PROGRESS TAB ──────────────────────────────────────────────────────────
function ProgressTab({client, myProgress, myRecords, myAchievements, exercises, loadAll, notify}) {
  const [view, setView] = React.useState("stats");
  const [showLog, setShowLog] = React.useState(false);
  const [showPR, setShowPR] = React.useState(false);
  const [log, setLog] = React.useState({date:TODAY,weight:"",body_fat:"",waist:"",notes:""});
  const [pr, setPr] = React.useState({exercise_id:"",exercise_name:"",value:"",unit:"kg",date:TODAY,notes:""});
  const [saving, setSaving] = React.useState(false);

  const latest = myProgress[0];
  const prev = myProgress[1];

  const saveLog = async() => {
    if(!log.weight&&!log.waist) return notify("Introduce al menos un dato","err");
    setSaving(true);
    await sb.from("progress").insert({...log,client_id:client.id,weight:log.weight||null,body_fat:log.body_fat||null,waist:log.waist||null});
    // Check achievements
    if(myProgress.length===0) {
      await sb.from("achievements").insert({client_id:client.id,type:"first_log",title:"Primera medición",description:"Registraste tu primer dato de progreso",emoji:"📊"});
    }
    setLog({date:TODAY,weight:"",body_fat:"",waist:"",notes:""});
    setShowLog(false);
    await loadAll();
    setSaving(false);
    notify("Progreso registrado ✓");
  };

  const savePR = async() => {
    if(!pr.exercise_name||!pr.value) return notify("Completa los campos","err");
    setSaving(true);
    await sb.from("personal_records").insert({...pr,client_id:client.id,value:parseFloat(pr.value)});
    // Check PR achievement
    if(myRecords.length===0) {
      await sb.from("achievements").insert({client_id:client.id,type:"first_pr",title:"Primera marca personal",description:"Registraste tu primer récord personal",emoji:"🏆"});
    }
    setPr({exercise_id:"",exercise_name:"",value:"",unit:"kg",date:TODAY,notes:""});
    setShowPR(false);
    await loadAll();
    setSaving(false);
    notify("¡Nueva marca personal! 🏆");
  };

  const diff = (field) => {
    if(!latest||!prev||!latest[field]||!prev[field]) return null;
    const d = parseFloat(latest[field]) - parseFloat(prev[field]);
    return d;
  };

  const StatCard = ({label,value,unit,diffVal}) => (
    <div className="stat-box">
      <div className="mono" style={{fontSize:18,fontWeight:700,color:"#0f172a"}}>{value||"—"}<span style={{fontSize:11,color:"#64748b",marginLeft:2}}>{value?unit:""}</span></div>
      {diffVal!==null&&diffVal!==undefined&&<div style={{fontSize:10,color:diffVal>0?"#dc2626":"#16a34a",marginTop:2}}>{diffVal>0?"+":""}{diffVal?.toFixed(1)}</div>}
      <div style={{fontSize:9,color:"#94a3b8",fontWeight:700,marginTop:3}}>{label.toUpperCase()}</div>
    </div>
  );

  const ACHIEVEMENT_LIST = [
    {type:"first_log",emoji:"📊",title:"Primera medición"},
    {type:"first_pr",emoji:"🏆",title:"Primera marca"},
    {type:"sessions_10",emoji:"💪",title:"10 sesiones"},
    {type:"sessions_25",emoji:"🔥",title:"25 sesiones"},
    {type:"streak_4",emoji:"⚡",title:"Racha 4 semanas"},
  ];

  return(
    <div>
      <div className="seg" style={{marginBottom:14}}>
        {[["stats","📊 Medidas"],["records","🏆 Marcas"],["badges","🎖 Logros"]].map(([id,label])=>(
          <button key={id} className={"sb"+(view===id?" on":"")} onClick={()=>setView(id)} style={{fontSize:12}}>{label}</button>
        ))}
      </div>

      {view==="stats"&&(
        <div>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <button className="btn sky" style={{flex:1,padding:10,fontSize:12}} onClick={()=>setShowLog(true)}>+ Registrar medidas</button>
          </div>
          {latest?(
            <div>
              <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,marginBottom:10}}>ÚLTIMA MEDICIÓN — {latest.date}</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
                <StatCard label="Peso" value={latest.weight} unit="kg" diffVal={diff("weight")}/>
                <StatCard label="% Grasa" value={latest.body_fat} unit="%" diffVal={diff("body_fat")}/>
                <StatCard label="Cintura" value={latest.waist} unit="cm" diffVal={diff("waist")}/>
              </div>
              {latest.notes&&<div style={{fontSize:12,color:"#64748b",padding:"10px 12px",background:"#f1f4fa",borderRadius:10,marginBottom:14}}>{latest.notes}</div>}
              <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,marginBottom:10}}>HISTORIAL</div>
              {myProgress.map(p=>(
                <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #e6ebf3",fontSize:12}}>
                  <span style={{color:"#64748b"}}>{p.date}</span>
                  <span>{p.weight?`${p.weight}kg`:""} {p.body_fat?`${p.body_fat}%`:""} {p.waist?`${p.waist}cm`:""}</span>
                </div>
              ))}
            </div>
          ):(
            <div className="card" style={{textAlign:"center",padding:36}}>
              <div style={{fontSize:28,marginBottom:8}}>📊</div>
              <div style={{color:"#64748b",fontSize:13,marginBottom:14}}>Sin mediciones aún. ¡Empieza hoy!</div>
              <button className="btn sky" style={{padding:"10px 20px"}} onClick={()=>setShowLog(true)}>Registrar primera medición</button>
            </div>
          )}
        </div>
      )}

      {view==="records"&&(
        <div>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <button className="btn sky" style={{flex:1,padding:10,fontSize:12}} onClick={()=>setShowPR(true)}>+ Nueva marca personal</button>
          </div>
          {myRecords.length===0
            ?<div className="card" style={{textAlign:"center",padding:36}}>
              <div style={{fontSize:28,marginBottom:8}}>🏆</div>
              <div style={{color:"#64748b",fontSize:13}}>Aún no tienes marcas registradas</div>
            </div>
            :<div>
              {Object.entries(myRecords.reduce((acc,r)=>{
                if(!acc[r.exercise_name]) acc[r.exercise_name]=[];
                acc[r.exercise_name].push(r);
                return acc;
              },{})).map(([name,recs])=>{
                const best = recs.sort((a,b)=>b.value-a.value)[0];
                return(
                  <div key={name} className="card" style={{marginBottom:8}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:14}}>{name}</div>
                        <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{recs.length} registros · Mejor: <span style={{color:"#ca8a04",fontWeight:700}}>{best.value}{best.unit}</span></div>
                      </div>
                      <div className="mono" style={{fontSize:20,fontWeight:700,color:"#ca8a04"}}>{best.value}<span style={{fontSize:11}}>{best.unit}</span></div>
                    </div>
                    <div style={{marginTop:8}}>
                      {recs.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(r=>(
                        <div key={r.id} style={{display:"flex",justifyContent:"space-between",fontSize:11,padding:"4px 0",borderTop:"1px solid #e6ebf3",color:"#64748b"}}>
                          <span>{r.date}</span><span style={{fontWeight:600,color:"#0f172a"}}>{r.value}{r.unit}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          }
        </div>
      )}

      {view==="badges"&&(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {ACHIEVEMENT_LIST.map(a=>{
              const earned = myAchievements.find(x=>x.type===a.type);
              return(
                <div key={a.type} className="card" style={{textAlign:"center",padding:16,opacity:earned?1:0.35,border:earned?"1px solid #bcd3ee":"1px solid var(--border)"}}>
                  <div style={{fontSize:30,marginBottom:6}}>{a.emoji}</div>
                  <div style={{fontSize:12,fontWeight:700,color:earned?"#0f172a":"#94a3b8"}}>{a.title}</div>
                  {earned&&<div style={{fontSize:10,color:"#94a3b8",marginTop:4}}>{new Date(earned.earned_at).toLocaleDateString("es-ES",{day:"numeric",month:"short"})}</div>}
                  {!earned&&<div style={{fontSize:10,color:"#cbd5e1",marginTop:4}}>Por conseguir</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {showLog&&(
        <div className="ovl" onClick={()=>setShowLog(false)}>
          <div className="mdl fade" onClick={e=>e.stopPropagation()}>
            <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:18}}>Registrar medidas</h2>
            <div style={{display:"flex",flexDirection:"column",gap:13}}>
              <div><span className="lbl">FECHA</span><input type="date" className="inp" value={log.date} onChange={e=>setLog(v=>({...v,date:e.target.value}))}/></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div><span className="lbl">PESO (kg)</span><input type="number" className="inp" placeholder="75.5" value={log.weight} onChange={e=>setLog(v=>({...v,weight:e.target.value}))}/></div>
                <div><span className="lbl">% GRASA</span><input type="number" className="inp" placeholder="18.5" value={log.body_fat} onChange={e=>setLog(v=>({...v,body_fat:e.target.value}))}/></div>
                <div><span className="lbl">CINTURA (cm)</span><input type="number" className="inp" placeholder="80" value={log.waist} onChange={e=>setLog(v=>({...v,waist:e.target.value}))}/></div>
                <div><span className="lbl">MASA MUSCULAR (kg)</span><input type="number" className="inp" placeholder="35" value={log.muscle_mass||""} onChange={e=>setLog(v=>({...v,muscle_mass:e.target.value}))}/></div>
              </div>
              <div><span className="lbl">NOTAS</span><input className="inp" placeholder="Cómo me siento..." value={log.notes} onChange={e=>setLog(v=>({...v,notes:e.target.value}))}/></div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn sky" style={{flex:1,padding:11}} onClick={saveLog} disabled={saving}>{saving?"Guardando...":"Guardar"}</button>
                <button className="btn ghost" style={{flex:1,padding:11}} onClick={()=>setShowLog(false)}>Cancelar</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {showPR&&(
        <div className="ovl" onClick={()=>setShowPR(false)}>
          <div className="mdl fade" onClick={e=>e.stopPropagation()}>
            <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:18}}>🏆 Nueva marca personal</h2>
            <div style={{display:"flex",flexDirection:"column",gap:13}}>
              <div><span className="lbl">EJERCICIO</span>
                <select className="inp" style={{appearance:"none"}} value={pr.exercise_id} onChange={e=>{
                  const ex=exercises.find(x=>x.id===e.target.value);
                  setPr(v=>({...v,exercise_id:e.target.value,exercise_name:ex?.name||""}));
                }}>
                  <option value="">Seleccionar ejercicio...</option>
                  {exercises.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
                </select>
                <input className="inp" placeholder="O escribe el nombre" style={{marginTop:6}} value={pr.exercise_name} onChange={e=>setPr(v=>({...v,exercise_name:e.target.value}))}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10}}>
                <div><span className="lbl">MARCA</span><input type="number" className="inp" placeholder="100" value={pr.value} onChange={e=>setPr(v=>({...v,value:e.target.value}))}/></div>
                <div><span className="lbl">UNIDAD</span>
                  <select className="inp" style={{appearance:"none"}} value={pr.unit} onChange={e=>setPr(v=>({...v,unit:e.target.value}))}>
                    {["kg","reps","seg","min","km","m"].map(u=><option key={u}>{u}</option>)}
                  </select>
                </div>
              </div>
              <div><span className="lbl">FECHA</span><input type="date" className="inp" value={pr.date} onChange={e=>setPr(v=>({...v,date:e.target.value}))}/></div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn sky" style={{flex:1,padding:11}} onClick={savePR} disabled={saving}>{saving?"Guardando...":"Guardar marca 🏆"}</button>
                <button className="btn ghost" style={{flex:1,padding:11}} onClick={()=>setShowPR(false)}>Cancelar</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── PLAN TAB ───────────────────────────────────────────────────────────────
function PlanTab({client, plans, clientPlans, exercises}) {
  const myActivePlans = clientPlans.filter(cp=>cp.client_id===client.id&&cp.active);

  if(myActivePlans.length===0) return(
    <div className="card" style={{textAlign:"center",padding:40}}>
      <div style={{fontSize:30,marginBottom:10}}>📋</div>
      <div style={{color:"#64748b",fontSize:13,marginBottom:6}}>No tienes ningún plan asignado</div>
      <div style={{fontSize:12,color:"#94a3b8"}}>Tu trainer te asignará un plan de entrenamiento pronto</div>
    </div>
  );

  return(
    <div>
      {myActivePlans.map(cp=>{
        const plan = plans.find(p=>p.id===cp.plan_id);
        if(!plan) return null;
        return(
          <div key={cp.id}>
            <div className="hero-card" style={{marginBottom:16}}>
              <div style={{fontWeight:800,fontSize:16,marginBottom:4}}>{plan.name}</div>
              <div style={{fontSize:12,color:"#64748b",marginBottom:10}}>{plan.category} · {plan.duration_weeks} semanas · Inicio: {cp.start_date}</div>
              {plan.description&&<div style={{fontSize:13,color:"#64748b"}}>{plan.description}</div>}
            </div>
            {(plan.plan_days||[]).sort((a,b)=>a.day_number-b.day_number).map(day=>(
              <div key={day.id} className="card" style={{marginBottom:10}}>
                <div style={{fontWeight:700,fontSize:14,color:"#0284c7",marginBottom:12}}>{day.day_name||`Día ${day.day_number}`}</div>
                {(day.plan_exercises||[]).sort((a,b)=>a.order_index-b.order_index).map((pe,i)=>{
                  const ex = exercises.find(e=>e.id===pe.exercise_id);
                  return(
                    <div key={pe.id} style={{display:"flex",gap:12,padding:"10px 0",borderBottom:i<day.plan_exercises.length-1?"1px solid #e6ebf3":"none",alignItems:"flex-start"}}>
                      <div style={{minWidth:24,height:24,borderRadius:6,background:"#dcebfb",color:"#0284c7",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:600,fontSize:14}}>{pe.exercise_name}</div>
                        <div style={{display:"flex",gap:12,marginTop:4}}>
                          <span style={{fontSize:12,color:"#0284c7",fontWeight:700}}>{pe.sets} × {pe.reps}</span>
                          {pe.rest_seconds&&<span style={{fontSize:11,color:"#64748b"}}>⏱ {pe.rest_seconds}s</span>}
                        </div>
                        {ex?.muscle_group&&<div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{ex.muscle_group}</div>}
                        {pe.notes&&<div style={{fontSize:11,color:"#64748b",marginTop:4,fontStyle:"italic"}}>{pe.notes}</div>}
                        {ex?.description&&<div style={{fontSize:11,color:"#bcd3ee",marginTop:4,lineHeight:1.4}}>{ex.description}</div>}
                      </div>
                    </div>
                  );
                })}
                {(day.plan_exercises||[]).length===0&&<div style={{fontSize:12,color:"#cbd5e1"}}>Sin ejercicios asignados</div>}
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}


// ── PROGRAMMING ADMIN ──────────────────────────────────────────────────────
// Macrociclo base: Recomposición / Salud (48 semanas). Los BLOQUES (esqueleto
// del año) son comunes; las PLANTILLAS de sesión se adaptan al objetivo:
//  · salud    → concurrente: fuerza + cardio/circuitos (menos días de aislamiento)
//  · estetica → más volumen de fuerza/hipertrofia y estabilidad
// Las plantillas se crean vacías (sin ejercicios), listas para rellenar y asignar.
const GOAL_LABEL = {salud:"Salud", estetica:"Estética/Masa"};
const MACRO_RECOMP = [
  {name:"Acondicionamiento · Volumen", type:"acondicionamiento", weeks:2, rep:"12-15",
   note:"Fullbody. Subida gradual de VOLUMEN.",
   tpls:{salud:[["Fullbody A","series_planas"],["Fullbody B","series_planas"],["Cardio ligero","emom"]],
         estetica:[["Fullbody A","series_planas"],["Fullbody B","series_planas"]]}},
  {name:"Acondicionamiento · Intensidad", type:"acondicionamiento", weeks:2, rep:"8-12",
   note:"Fullbody. Subida gradual de INTENSIDAD.",
   tpls:{salud:[["Fullbody A","series_planas"],["Fullbody B","series_planas"],["Cardio/Circuito","amrap"]],
         estetica:[["Fullbody A","series_planas"],["Fullbody B","series_planas"]]}},
  {name:"Fuerza · Inespecífico", type:"fuerza", weeks:8, rep:"6-10",
   note:"Torso/Piernas/Fullbody. Inestabilidad en multiarticulares · intensidad supramáxima opcional (+%1RM) · singles en días secundarios.",
   tpls:{salud:[["Torso","top_set_backoff"],["Piernas","top_set_backoff"],["Circuito concurrente","emom"]],
         estetica:[["Torso","top_set_backoff"],["Piernas","top_set_backoff"],["Fullbody","series_planas"]]}},
  {name:"Fuerza · Específico", type:"fuerza", weeks:8, rep:"1-6",
   note:"Aumento de intensidad (+%RM) · rango de reps menor · singles en días primarios.",
   tpls:{salud:[["Torso","ramp_up"],["Piernas","ramp_up"],["Circuito concurrente","amrap"]],
         estetica:[["Torso","ramp_up"],["Piernas","ramp_up"],["Fullbody","top_set_backoff"]]}},
  {name:"Fuerza · Semana TEST", type:"fuerza", weeks:1, rep:"3-8",
   note:"AMRAP básicos: serie AMRAP para test entre 3-8 reps.",
   tpls:{salud:[["Test AMRAP básicos","amrap"]], estetica:[["Test AMRAP básicos","amrap"]]}},
  {name:"Fuerza · Descarga", type:"descarga", weeks:1, rep:"6-8",
   note:"Descarga: bajar volumen e intensidad.",
   tpls:{salud:[["Descarga Fullbody","series_planas"]], estetica:[["Descarga Fullbody","series_planas"]]}},
  {name:"Híbrido / Comodín", type:"hibrido", weeks:4, rep:"var",
   note:"Resensibilizar: planos/ejercicios menos usados (frontal, transversal) · protocolos inusuales (cluster, AMRAP, superserie antagonistas) · más densidad · cardio/HIIT/EMOM/LEADER.",
   tpls:{salud:[["Circuito EMOM","emom"],["Circuito AMRAP","amrap"],["HIIT/Tabata","tabata"]],
         estetica:[["Circuito EMOM","emom"],["Superserie antagonistas","superset"],["Cluster","cluster"]]}},
  {name:"Hipertrofia · Inespecífico", type:"hipertrofia", weeks:8, rep:"8-12",
   note:"Push/Pull/Legs/Cadena post/Brazos. Mayor estabilidad en multiarticulares · rango de reps mayor.",
   tpls:{salud:[["Push","series_planas"],["Pull","series_planas"],["Legs","series_planas"],["Circuito/cardio","emom"]],
         estetica:[["Push","series_planas"],["Pull","series_planas"],["Legs","series_planas"],["Cadena posterior","series_planas"],["Brazos","series_planas"]]}},
  {name:"Hipertrofia · Específico", type:"hipertrofia", weeks:8, rep:"6-10",
   note:"Técnicas avanzadas al final · monoarticular al inicio · rango de reps menor.",
   tpls:{salud:[["Push","drop_set"],["Pull","drop_set"],["Legs","rest_pause"],["Circuito/cardio","amrap"]],
         estetica:[["Push","drop_set"],["Pull","drop_set"],["Legs","rest_pause"],["Cadena posterior","drop_set"],["Brazos","drop_set"]]}},
  {name:"Hipertrofia · Semana TEST", type:"hipertrofia", weeks:1, rep:"3-8",
   note:"AMRAP básicos: serie AMRAP para test entre 3-8 reps.",
   tpls:{salud:[["Test AMRAP básicos","amrap"]], estetica:[["Test AMRAP básicos","amrap"]]}},
  {name:"Hipertrofia · Descarga", type:"descarga", weeks:1, rep:"8-10",
   note:"Descarga: bajar volumen e intensidad.",
   tpls:{salud:[["Descarga Fullbody","series_planas"]], estetica:[["Descarga Fullbody","series_planas"]]}},
  {name:"Híbrido / Comodín (2)", type:"hibrido", weeks:4, rep:"var",
   note:"Resensibilizar: planos/ejercicios menos usados · protocolos inusuales · más densidad · cardio/HIIT/interválico.",
   tpls:{salud:[["Circuito EMOM","emom"],["Circuito AMRAP","amrap"],["HIIT/Tabata","tabata"]],
         estetica:[["Circuito EMOM","emom"],["Superserie antagonistas","superset"],["Cluster","cluster"]]}},
];

function ProgrammingAdmin({clients,annualBlocks,sessionTemplates,templateExercises,clientWeights,assignedSessions,assignedExercises,weightHistory,loadAll,notify}) {
  const [tab,setTab] = React.useState("macrocycle");
  const [selBlock,setSelBlock] = React.useState(null);
  const [selTemplate,setSelTemplate] = React.useState(null);
  const [selClient,setSelClient] = React.useState(clients[0]?.id||"");
  const [showAssignModal,setShowAssignModal] = React.useState(null); // date
  const [showWeightModal,setShowWeightModal] = React.useState(null); // client
  const [showTemplateModal,setShowTemplateModal] = React.useState(null); // block
  const [saving,setSaving] = React.useState(false);
  const [genMacro,setGenMacro] = React.useState(false);

  // Genera el macrociclo (48 semanas) para un objetivo. Los bloques se crean una
  // vez; las plantillas se añaden etiquetadas por objetivo (Salud / Masa).
  const generarMacro = async(goal)=>{
    const tag = goal==="salud"?"Salud":"Masa";
    if(!window.confirm(`Se generará el macrociclo de Recomposición (48 semanas) con plantillas para ${GOAL_LABEL[goal]}. Los bloques se crean una vez; puedes generar también el otro objetivo. ¿Continuar?`)) return;
    setGenMacro(true);
    let wk = annualBlocks.length ? Math.max(...annualBlocks.map(b=>b.end_week||0))+1 : 1;
    let order = annualBlocks.length ? Math.max(...annualBlocks.map(b=>b.order_index||0)) : 0;
    try{
      for(const b of MACRO_RECOMP){
        let blk=annualBlocks.find(x=>x.name===b.name);
        if(!blk){
          order++; const start=wk, end=wk+b.weeks-1; wk=end+1;
          const {data,error}=await sb.from("annual_blocks").insert({
            name:b.name,type:b.type,start_week:start,end_week:end,week_count:b.weeks,
            rep_range:b.rep,intensity_note:b.note,order_index:order}).select().single();
          if(error){ notify("Error al crear bloque: "+error.message,"err"); setGenMacro(false); return; }
          blk=data;
        }
        const existing=sessionTemplates.filter(t=>t.block_id===blk.id).map(t=>t.name);
        const rows=(b.tpls[goal]||[]).map(t=>[`${t[0]} · ${tag}`,t[1]])
          .filter(t=>!existing.includes(t[0]))
          .map((t,i)=>({name:t[0],protocol:t[1],block_id:blk.id,order_index:i}));
        if(rows.length){ const {error:te}=await sb.from("session_templates").insert(rows); if(te){ notify("Error en plantillas: "+te.message,"err"); setGenMacro(false); return; } }
      }
      await loadAll(); notify(`Macrociclo · ${GOAL_LABEL[goal]} generado ✓`);
    }catch(e){ notify("Error al generar el macrociclo","err"); }
    setGenMacro(false);
  };

  // Week number helpers
  const getWeekNumber = (date) => {
    const d = new Date(date+"T12:00:00");
    const startOfYear = new Date(d.getFullYear(), 0, 1);
    return Math.ceil(((d - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
  };
  const currentWeek = getWeekNumber(new Date().toISOString().split("T")[0]);
  const currentBlock = annualBlocks.find(b => currentWeek >= b.start_week && currentWeek <= b.end_week);

  const w = async(fn) => { setSaving(true); await fn(); await loadAll(); setSaving(false); };

  // Get next 14 days for session assignment
  const next14Days = Array.from({length:14},(_,i) => {
    const d = new Date(); d.setDate(d.getDate()+i);
    return d.toISOString().split("T")[0];
  });

  const BLOCK_COLORS = {
    acondicionamiento:"#64748b",fuerza:"#16a34a",hipertrofia:"#f472b6",
    hibrido:"#f59e0b",descarga:"#94a3b8"
  };

  const PROTOCOL_LABELS = {
    series_planas:"Series planas",top_set_backoff:"Top Set + Back Off",
    ramp_up:"Ramp Up",amrap:"AMRAP",superset:"Superserie",
    drop_set:"Drop Set",rest_pause:"Rest Pause",cluster:"Cluster",
    emom:"EMOM",leader:"LEADER",tabata:"TABATA"
  };

  // Assign session to client
  const assignSession = async(clientId, date, templateId, customExercises) => {
    // Create assigned session
    const {data:sess, error} = await sb.from("assigned_sessions").insert({
      client_id: clientId,
      template_id: templateId,
      date: date,
      status: "pending"
    }).select().single();
    if(error) { notify("Error al asignar sesión","err"); return; }

    // Get template exercises and create assigned exercises with client weights
    const tmplExercises = templateExercises.filter(te => te.template_id === templateId)
      .sort((a,b) => a.order_index - b.order_index);

    const clientWts = clientWeights.filter(cw => cw.client_id === clientId);

    const assigns = (customExercises || tmplExercises).map(ex => {
      const cw = clientWts.find(w => w.exercise_name.toLowerCase() === ex.exercise_name.toLowerCase());
      return {
        session_id: sess.id,
        exercise_name: ex.exercise_name,
        prescribed_weight: cw?.weight || null,
        sets: ex.sets,
        reps: ex.reps,
        protocol: ex.protocol,
        rest_seconds: ex.rest_seconds,
        notes: ex.notes,
        order_index: ex.order_index,
      };
    });

    if(assigns.length > 0) {
      await sb.from("assigned_exercises").insert(assigns);
    }
  };

  // Update client weight
  const updateWeight = async(clientId, exerciseName, newWeight, oldWeight) => {
    await sb.from("client_weights").upsert({
      client_id: clientId,
      exercise_name: exerciseName,
      weight: newWeight,
      updated_at: new Date().toISOString()
    }, {onConflict:"client_id,exercise_name"});

    if(oldWeight && oldWeight !== newWeight) {
      await sb.from("weight_history").insert({
        client_id: clientId,
        exercise_name: exerciseName,
        old_weight: oldWeight,
        new_weight: newWeight,
        reason: "Actualización manual"
      });
    }
  };

  // Check progression suggestions (3 sessions completed well)
  const progressionSuggestions = React.useMemo(() => {
    const suggestions = [];
    clients.forEach(c => {
      const cSessions = assignedSessions.filter(s => s.client_id === c.id && s.status === "completed");
      // Group completed exercises by name
      const byExercise = {};
      cSessions.forEach(sess => {
        const exes = assignedExercises.filter(ae => ae.session_id === sess.id && ae.completed);
        exes.forEach(ae => {
          if(!byExercise[ae.exercise_name]) byExercise[ae.exercise_name] = [];
          byExercise[ae.exercise_name].push(ae);
        });
      });
      // Check if any exercise has 3+ consecutive completions
      Object.entries(byExercise).forEach(([name, logs]) => {
        if(logs.length >= 3) {
          const cw = clientWeights.find(w => w.client_id === c.id && w.exercise_name === name);
          suggestions.push({client: c, exercise: name, sessions: logs.length, currentWeight: cw?.weight});
        }
      });
    });
    return suggestions;
  }, [clients, assignedSessions, assignedExercises, clientWeights]);

  const selClientObj = clients.find(c=>c.id===selClient);

  return (
    <div>
      {saving&&<div style={{position:"fixed",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,#0284c7,#16a34a)",zIndex:500}}/>}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h1 className="mono" style={{fontSize:18,fontWeight:700}}>📊 Programación</h1>
        {currentBlock&&<span className="pill" style={{background:(BLOCK_COLORS[currentBlock.type]||"#94a3b8")+"20",color:BLOCK_COLORS[currentBlock.type]||"#64748b",border:`1px solid ${(BLOCK_COLORS[currentBlock.type]||"#94a3b8")}30`,fontSize:11}}>Semana {currentWeek} · {currentBlock.name}</span>}
      </div>

      <div style={{display:"flex",gap:4,overflowX:"auto",marginBottom:16,paddingBottom:4}}>
        {[["macrocycle","🗓 Macrociclo"],["assign","📅 Asignar"],["weights","⚖️ Pesos"],["progress_view","📈 Progresión"]].map(([id,label])=>(
          <button key={id} className={"tab"+(tab===id?" on":"")} onClick={()=>setTab(id)} style={{flexShrink:0,fontSize:11}}>{label}</button>
        ))}
      </div>

      {/* ── MACROCICLO TAB ── */}
      {tab==="macrocycle"&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,gap:10,flexWrap:"wrap"}}>
            <div style={{fontSize:11,color:"#94a3b8",fontWeight:700}}>PROGRAMACIÓN ANUAL — {annualBlocks.reduce((a,b)=>a+(b.week_count||0),0)} SEMANAS</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <button className="btn grn" style={{fontSize:11,padding:"7px 11px"}} disabled={genMacro} onClick={()=>generarMacro("salud")}>{genMacro?"…":"🩺 Salud"}</button>
              <button className="btn sky" style={{fontSize:11,padding:"7px 11px"}} disabled={genMacro} onClick={()=>generarMacro("estetica")}>{genMacro?"…":"💪 Estética/Masa"}</button>
            </div>
          </div>
          {annualBlocks.length===0&&(
            <div className="card" style={{marginBottom:14,textAlign:"center",padding:20}}>
              <div style={{fontSize:30,marginBottom:8}}>🗓️</div>
              <div style={{fontWeight:700,marginBottom:4}}>Aún no tienes el año programado</div>
              <div style={{fontSize:12,color:"#64748b",marginBottom:14,lineHeight:1.5}}>Genera el macrociclo de <b>Recomposición</b> (48 semanas). Elige el objetivo — puedes generar los dos y luego asignar a cada cliente el que le toque:<br/><b style={{color:"#16a34a"}}>🩺 Salud</b> = concurrente (fuerza + cardio/circuitos) · <b style={{color:"#0284c7"}}>💪 Estética/Masa</b> = más volumen de fuerza/hipertrofia y estabilidad.</div>
              <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
                <button className="btn grn" style={{padding:"10px 16px"}} disabled={genMacro} onClick={()=>generarMacro("salud")}>{genMacro?"Generando…":"🩺 Generar (Salud)"}</button>
                <button className="btn sky" style={{padding:"10px 16px"}} disabled={genMacro} onClick={()=>generarMacro("estetica")}>{genMacro?"Generando…":"💪 Generar (Estética/Masa)"}</button>
              </div>
            </div>
          )}

          {/* Visual timeline */}
          <div style={{background:"#f1f4fa",borderRadius:12,padding:12,marginBottom:16,overflowX:"auto"}}>
            <div style={{display:"flex",gap:2,minWidth:480,height:32,alignItems:"center"}}>
              {annualBlocks.map(block=>{
                const pct = (block.week_count / 46) * 100;
                const isActive = currentBlock?.id === block.id;
                return(
                  <div key={block.id} style={{
                    flex:block.week_count,height:isActive?32:24,borderRadius:6,
                    background:(BLOCK_COLORS[block.type]||"#94a3b8")+(isActive?"":"40"),
                    border:isActive?`2px solid ${BLOCK_COLORS[block.type]||"#94a3b8"}`:"none",
                    display:"flex",alignItems:"center",justifyContent:"center",
                    cursor:"pointer",transition:"all .2s",position:"relative",
                    minWidth:20,
                  }} onClick={()=>setSelBlock(selBlock?.id===block.id?null:block)}>
                    <span style={{fontSize:8,fontWeight:700,color:"#fff",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",padding:"0 3px"}}>{block.week_count}s</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Block list */}
          {annualBlocks.map(block=>{
            const isActive = currentBlock?.id === block.id;
            const blockTemplates = sessionTemplates.filter(t=>t.block_id===block.id);
            const open = selBlock?.id === block.id;
            return(
              <div key={block.id} className="card" style={{marginBottom:8,border:`1px solid ${isActive?(BLOCK_COLORS[block.type]||"#94a3b8")+"60":"var(--border)"}`}} onClick={()=>setSelBlock(open?null:block)}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div style={{display:"flex",gap:10,alignItems:"center"}}>
                    <div style={{width:12,height:12,borderRadius:3,background:BLOCK_COLORS[block.type]||"#94a3b8",flexShrink:0}}/>
                    <div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontWeight:700,fontSize:14}}>{block.name}</span>
                        {isActive&&<span style={{fontSize:10,background:"#dcebfb",color:"#0284c7",padding:"2px 7px",borderRadius:8,fontWeight:700}}>← Ahora</span>}
                      </div>
                      <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{block.week_count} semanas · Sem {block.start_week}-{block.end_week} · {block.rep_range} reps · {blockTemplates.length} plantillas</div>
                    </div>
                  </div>
                  <span style={{fontSize:18,color:"#94a3b8"}}>{open?"▲":"▼"}</span>
                </div>

                {open&&(
                  <div style={{marginTop:12,borderTop:"1px solid #e6ebf3",paddingTop:12}} onClick={e=>e.stopPropagation()}>
                    <div style={{fontSize:11,color:"#94a3b8",marginBottom:8,lineHeight:1.5}}>{block.intensity_note}</div>

                    <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,marginBottom:8}}>PLANTILLAS DE SESIÓN</div>
                    {blockTemplates.map(t=>{
                      const texes = templateExercises.filter(te=>te.template_id===t.id);
                      return(
                        <div key={t.id} style={{background:"#f1f4fa",borderRadius:10,padding:"10px 12px",marginBottom:6}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:texes.length>0?8:0}}>
                            <div>
                              <div style={{fontSize:13,fontWeight:600}}>{t.name}</div>
                              <div style={{fontSize:11,color:"#64748b"}}>{PROTOCOL_LABELS[t.protocol]||t.protocol} · {texes.length} ejercicios</div>
                            </div>
                            <button className="btn sky" style={{fontSize:10,padding:"4px 8px"}} onClick={()=>setShowTemplateModal(t)}>✏️ Editar</button>
                          </div>
                          {texes.map(ex=>(
                            <div key={ex.id} style={{fontSize:11,color:"#64748b",padding:"3px 0",borderTop:"1px solid #eef1f7",display:"flex",gap:8}}>
                              <span style={{flex:1}}>{ex.exercise_name}</span>
                              <span className="mono" style={{color:"#0284c7"}}>{ex.sets}×{ex.reps}</span>
                              {ex.is_main&&<span style={{color:"#ca8a04",fontSize:9,fontWeight:700}}>★</span>}
                            </div>
                          ))}
                        </div>
                      );
                    })}
                    <button className="btn ghost" style={{fontSize:11,padding:"7px 12px",marginTop:4}} onClick={()=>{
                      sb.from("session_templates").insert({block_id:block.id,name:"Nueva plantilla",session_type:"fullbody",protocol:"series_planas",order_index:blockTemplates.length}).then(()=>loadAll());
                    }}>+ Nueva plantilla</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* ── ASSIGN TAB ── */}
      {tab==="assign"&&(
        <div>
          <div style={{marginBottom:14}}>
            <span className="lbl">CLIENTE</span>
            <select className="inp" style={{appearance:"none"}} value={selClient} onChange={e=>setSelClient(e.target.value)}>
              {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>

          {selClientObj&&(
            <div>
              <div style={{fontSize:11,color:"#94a3b8",fontWeight:700,marginBottom:10}}>PRÓXIMOS 14 DÍAS — {selClientObj.name}</div>

              {next14Days.map(date=>{
                const dayName = new Date(date+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short"});
                const isToday = date === new Date().toISOString().split("T")[0];
                const existing = assignedSessions.filter(s=>s.client_id===selClient&&s.date===date);
                const wk = getWeekNumber(date);
                const blk = annualBlocks.find(b=>wk>=b.start_week&&wk<=b.end_week);
                const isWeekend = [0,6].includes(new Date(date+"T12:00:00").getDay());

                if(isWeekend) return null;

                return(
                  <div key={date} className="card" style={{marginBottom:8,border:`1px solid ${isToday?"#bcd3ee":"var(--border)"}`}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:existing.length>0?10:0}}>
                      <div>
                        <div style={{fontSize:13,fontWeight:600,textTransform:"capitalize"}}>{dayName}{isToday&&<span style={{fontSize:10,color:"#0284c7",marginLeft:6,fontWeight:700}}>HOY</span>}</div>
                        {blk&&<div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{blk.name}</div>}
                      </div>
                      <button className="btn sky" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>setShowAssignModal({date,clientId:selClient,block:blk})}>+ Sesión</button>
                    </div>

                    {existing.map(sess=>{
                      const tmpl = sessionTemplates.find(t=>t.id===sess.template_id);
                      const sessExes = assignedExercises.filter(ae=>ae.session_id===sess.id);
                      return(
                        <div key={sess.id} style={{background:"#f1f4fa",borderRadius:10,padding:"10px 12px",marginBottom:6}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                            <div>
                              <div style={{fontSize:12,fontWeight:700,color:"#0284c7"}}>{tmpl?.name||"Sesión"}</div>

      {/* ── WEIGHTS TAB ── */}

          {selClientObj&&(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div style={{fontSize:11,color:"#94a3b8",fontWeight:700}}>PESOS BASE — {selClientObj.name}</div>

                ?<div className="card" style={{textAlign:"center",padding:32,color:"#94a3b8"}}>
                  Sin pesos registrados. Añade los ejercicios principales.
                </div>
                :clientWeights.filter(cw=>cw.client_id===selClient).map(cw=>{
                  const hist = weightHistory.filter(h=>h.client_id===selClient&&h.exercise_name===cw.exercise_name).slice(0,3);
                  return(
                    <div key={cw.id} className="card" style={{marginBottom:8}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:hist.length>0?8:0}}>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:600,fontSize:14}}>{cw.exercise_name}</div>
                          <div style={{fontSize:11,color:"#64748b",marginTop:2}}>Actualizado: {new Date(cw.updated_at).toLocaleDateString("es-ES",{day:"numeric",month:"short"})}</div>
                        </div>
                        <div style={{display:"flex",gap:8,alignItems:"center"}}>
                          <div className="mono" style={{fontSize:22,fontWeight:700,color:"#ca8a04"}}>{cw.weight}<span style={{fontSize:12,color:"#64748b"}}>kg</span></div>
                          <WeightEditor cw={cw} onSave={(newW)=>w(async()=>{
                            await updateWeight(selClient,cw.exercise_name,newW,cw.weight);
                            notify(`${cw.exercise_name}: ${cw.weight}→${newW}kg ✓`);
                          })}/>
                        </div>
                      </div>
                      {hist.length>0&&(
                        <div style={{display:"flex",gap:8,overflowX:"auto"}}>
                          {hist.reverse().map((h,i)=>(
                            <div key={i} style={{fontSize:10,color:"#94a3b8",flexShrink:0}}>
                              {h.old_weight}→<span style={{color:"#16a34a"}}>{h.new_weight}kg</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })
              }
            </div>
          )}
        </div>
      )}

      {/* ── PROGRESSION TAB ── */}
      {tab==="progress_view"&&(
        <div>
          <div style={{fontSize:11,color:"#94a3b8",fontWeight:700,marginBottom:12}}>SUGERENCIAS DE PROGRESIÓN</div>

          {progressionSuggestions.length===0
            ?<div className="card" style={{textAlign:"center",padding:32,color:"#94a3b8"}}>

            </div>
            :progressionSuggestions.map((s,i)=>(
              <div key={i} className="card" style={{marginBottom:10,border:"1px solid #e2f2e2"}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div className="ring" style={{width:38,height:38,background:s.client.color+"20",color:s.client.color,fontSize:12,border:`1.5px solid ${s.client.color}35`}}>{s.client.name.split(" ").map(w=>w[0]).join("").slice(0,2)}</div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13}}>{s.client.name}</div>
                    <div style={{fontSize:12,color:"#16a34a",marginTop:2}}>
                      ✓ {s.exercise} — {s.sessions} sesiones completadas
                    </div>
                    {s.currentWeight&&<div style={{fontSize:11,color:"#64748b"}}>Peso actual: <span className="mono" style={{color:"#ca8a04"}}>{s.currentWeight}kg</span></div>}
                  </div>
                  <button className="btn grn" style={{fontSize:11,padding:"7px 11px",flexShrink:0}} onClick={()=>setShowWeightModal(s.client.id)}>↑ Subir peso</button>

          <div style={{marginTop:20}}>
            <div style={{fontSize:11,color:"#94a3b8",fontWeight:700,marginBottom:10}}>RESUMEN DE PESOS POR CLIENTE</div>
            {clients.map(c=>{
              const cWts = clientWeights.filter(w=>w.client_id===c.id);
              const cSessions = assignedSessions.filter(s=>s.client_id===c.id);
              const completed = cSessions.filter(s=>s.status==="completed").length;
              return(
                <div key={c.id} className="card" style={{marginBottom:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:cWts.length>0?10:0}}>
                    <div className="ring" style={{width:34,height:34,background:c.color+"20",color:c.color,fontSize:11}}>{c.name.split(" ").map(w=>w[0]).join("").slice(0,2)}</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600}}>{c.name}</div>
                      <div style={{fontSize:11,color:"#64748b"}}>{cWts.length} ejercicios · {completed} sesiones completadas</div>
                    </div>
                  </div>
                  {cWts.slice(0,4).map(cw=>(
                    <div key={cw.id} style={{display:"flex",justifyContent:"space-between",fontSize:11,padding:"3px 0",borderTop:"1px solid #e6ebf3",color:"#64748b"}}>
                      <span>{cw.exercise_name}</span>
                      <span className="mono" style={{color:"#ca8a04",fontWeight:700}}>{cw.weight}kg</span>
                    </div>
                  ))}
                  {cWts.length>4&&<div style={{fontSize:10,color:"#94a3b8",marginTop:4}}>+{cWts.length-4} más...</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── ASSIGN SESSION MODAL ── */}
      {showAssignModal&&(
        <AssignSessionModal
          data={showAssignModal}
          clients={clients}
          sessionTemplates={sessionTemplates}
          templateExercises={templateExercises}
          clientWeights={clientWeights}
          onAssign={async(clientId,date,templateId)=>{
            setSaving(true);
            await assignSession(clientId,date,templateId,null);
            await loadAll();
            setSaving(false);
            setShowAssignModal(null);
            notify("Sesión asignada ✓");
          }}
          onClose={()=>setShowAssignModal(null)}
        />
      )}

      {/* ── WEIGHT MODAL ── */}
      {showWeightModal&&(
        <AddWeightModal
          clientId={showWeightModal}
          clientWeights={clientWeights.filter(cw=>cw.client_id===showWeightModal)}
          onSave={async(exerciseName,weight)=>{
            const existing = clientWeights.find(cw=>cw.client_id===showWeightModal&&cw.exercise_name===exerciseName);
            setSaving(true);
            await updateWeight(showWeightModal,exerciseName,weight,existing?.weight);
            await loadAll();
            setSaving(false);
            setShowWeightModal(null);
            notify(`${exerciseName}: ${weight}kg guardado ✓`);
          }}
          onClose={()=>setShowWeightModal(null)}
        />
      )}

      {/* ── TEMPLATE EDITOR MODAL ── */}
      {showTemplateModal&&(
        <TemplateEditorModal
          template={showTemplateModal}
          exercises={templateExercises.filter(te=>te.template_id===showTemplateModal.id)}
          onClose={()=>setShowTemplateModal(null)}
          loadAll={loadAll}
          notify={notify}
        />
      )}
    </div>
  );
}

}

              <option value="">Seleccionar...</option>
              {MAIN_EXERCISES.map(e=><option key={e} value={e}>{e}{clientWeights.find(cw=>cw.exercise_name===e)?` (${clientWeights.find(cw=>cw.exercise_name===e).weight}kg)`:""}</option>)}

// ── TEMPLATE EDITOR MODAL ──────────────────────────────────────────────────
function TemplateEditorModal({template, exercises, onClose, loadAll, notify}) {
  const [saving,setSaving] = React.useState(false);
  const [newEx,setNewEx] = React.useState({exercise_name:"",sets:3,reps:"8-10",protocol:"",rest_seconds:90,notes:"",is_main:false});

  const w = async(fn)=>{ setSaving(true); await fn(); await loadAll(); setSaving(false); };

  const addExercise = ()=>w(async()=>{
    if(!newEx.exercise_name) return notify("Escribe el nombre","err");
    await sb.from("template_exercises").insert({...newEx,template_id:template.id,order_index:exercises.length});
    setNewEx({exercise_name:"",sets:3,reps:"8-10",protocol:"",rest_seconds:90,notes:"",is_main:false});
    notify("Ejercicio añadido ✓");
  });

  const deleteEx = (id)=>w(async()=>{
    await sb.from("template_exercises").delete().eq("id",id);
    notify("Ejercicio eliminado");
  });

  const updateEx = (id,field,val)=>w(async()=>{
    await sb.from("template_exercises").update({[field]:val}).eq("id",id);
  });

  return(
    <div className="ovl" onClick={onClose}>
      <div className="mdl fade" onClick={e=>e.stopPropagation()}>
        <h2 className="mono" style={{fontSize:16,fontWeight:700,marginBottom:4}}>✏️ {template.name}</h2>
        <p style={{fontSize:11,color:"#64748b",marginBottom:16}}>{template.protocol} · Edita los ejercicios base de esta plantilla</p>

        {exercises.sort((a,b)=>a.order_index-b.order_index).map((ex,i)=>(
          <div key={ex.id} style={{background:"#f1f4fa",borderRadius:10,padding:10,marginBottom:6}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <div style={{flex:1}}>
                <input className="inp" style={{fontSize:13,padding:"5px 8px"}} value={ex.exercise_name}
                  onChange={e=>updateEx(ex.id,"exercise_name",e.target.value)}/>
              </div>
              <div style={{display:"flex",gap:5,marginLeft:8}}>
                <button style={{background:ex.is_main?"#fbf3df":"none",border:"1px solid #f5ecd0",borderRadius:6,color:ex.is_main?"#ca8a04":"#94a3b8",fontSize:10,padding:"3px 6px",cursor:"pointer"}} onClick={()=>updateEx(ex.id,"is_main",!ex.is_main)}>★</button>
                <button className="btn danger" style={{padding:"3px 7px"}} onClick={()=>deleteEx(ex.id)}>✕</button>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
              <div><span className="lbl" style={{fontSize:9}}>SERIES</span><input type="number" className="inp" style={{padding:"5px 7px",fontSize:12}} value={ex.sets} onChange={e=>updateEx(ex.id,"sets",parseInt(e.target.value))}/></div>
              <div><span className="lbl" style={{fontSize:9}}>REPS</span><input className="inp" style={{padding:"5px 7px",fontSize:12}} value={ex.reps} onChange={e=>updateEx(ex.id,"reps",e.target.value)}/></div>
              <div><span className="lbl" style={{fontSize:9}}>DESCANSO(s)</span><input type="number" className="inp" style={{padding:"5px 7px",fontSize:12}} value={ex.rest_seconds} onChange={e=>updateEx(ex.id,"rest_seconds",parseInt(e.target.value))}/></div>
            </div>
            {ex.is_main&&<div style={{fontSize:10,color:"#ca8a04",marginTop:5}}>★ Ejercicio principal — se usará el peso base del cliente</div>}
          </div>
        ))}

        <div style={{background:"#f1f4fa",borderRadius:10,padding:10,marginTop:10,border:"1px dashed #cbd5e1"}}>
          <div style={{fontSize:11,color:"#0284c7",fontWeight:700,marginBottom:8}}>+ Nuevo ejercicio</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <input className="inp" placeholder="Nombre del ejercicio" value={newEx.exercise_name} onChange={e=>setNewEx(v=>({...v,exercise_name:e.target.value}))}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
              <div><span className="lbl" style={{fontSize:9}}>SERIES</span><input type="number" className="inp" style={{padding:"5px 7px",fontSize:12}} value={newEx.sets} onChange={e=>setNewEx(v=>({...v,sets:parseInt(e.target.value)}))}/></div>
              <div><span className="lbl" style={{fontSize:9}}>REPS</span><input className="inp" style={{padding:"5px 7px",fontSize:12}} value={newEx.reps} onChange={e=>setNewEx(v=>({...v,reps:e.target.value}))}/></div>
              <div><span className="lbl" style={{fontSize:9}}>DESCANSO(s)</span><input type="number" className="inp" style={{padding:"5px 7px",fontSize:12}} value={newEx.rest_seconds} onChange={e=>setNewEx(v=>({...v,rest_seconds:parseInt(e.target.value)}))}/></div>
            </div>
            <input className="inp" placeholder="Notas técnicas..." value={newEx.notes} onChange={e=>setNewEx(v=>({...v,notes:e.target.value}))}/>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <input type="checkbox" id="isMain" checked={newEx.is_main} onChange={e=>setNewEx(v=>({...v,is_main:e.target.checked}))} style={{accentColor:"#ca8a04"}}/>
              <label htmlFor="isMain" style={{fontSize:12,color:"#64748b",cursor:"pointer"}}>Ejercicio principal (usa peso base del cliente ★)</label>
            </div>
            <button className="btn sky" style={{width:"100%",padding:9,fontSize:12}} onClick={addExercise} disabled={saving}>{saving?"Guardando...":"Añadir ejercicio"}</button>
          </div>
        </div>

        <button className="btn ghost" style={{width:"100%",padding:10,marginTop:10,fontSize:13}} onClick={onClose}>Cerrar</button>
      </div>
    </div>
  );
}


// ── TODAY SESSION (client view) ────────────────────────────────────────────
function TodaySession({client, myAssignedSessions, myAssignedExercises, clientWeights, annualBlocks, loadAll, notify}) {
  const TODAY_STR = new Date().toISOString().split("T")[0];
  const [saving,setSaving] = React.useState(false);

  // Get week number
  const getWeekNumber = (date) => {
    const d = new Date(date+"T12:00:00");
    const startOfYear = new Date(d.getFullYear(), 0, 1);
    return Math.ceil(((d - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
  };
  const currentWeek = getWeekNumber(TODAY_STR);
  const currentBlock = annualBlocks.find(b => currentWeek >= b.start_week && currentWeek <= b.end_week);

  const todaySessions = myAssignedSessions.filter(s=>s.date===TODAY_STR);
  const completedAll = todaySessions.length>0 && todaySessions.every(s=>s.status==="completed");

  const markExerciseComplete = async(exerciseId, actualWeight, actualReps, rpeFelt) => {
    setSaving(true);
    await sb.from("assigned_exercises").update({
      completed: true,
      actual_weight: actualWeight||null,
      actual_reps: actualReps||null,
      rpe_felt: rpeFelt||null,
    }).eq("id",exerciseId);

    // Check if all exercises in session are completed
    const sessId = myAssignedExercises.find(ae=>ae.id===exerciseId)?.session_id;
    if(sessId) {
      const sessExes = myAssignedExercises.filter(ae=>ae.session_id===sessId);
      const allDone = sessExes.every(ae=>ae.id===exerciseId?true:ae.completed);
      if(allDone) {
        await sb.from("assigned_sessions").update({status:"completed"}).eq("id",sessId);
      }
    }
    await loadAll();
    setSaving(false);
    notify("Serie registrada ✓");
  };

  if(todaySessions.length===0) return(
    <div>
      {currentBlock&&(
        <div style={{background:"linear-gradient(135deg,#f1f4fa,#ffffff)",borderRadius:14,border:`1px solid ${currentBlock.color||"#cbd5e1"}30`,padding:14,marginBottom:16}}>
          <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,marginBottom:4}}>BLOQUE ACTUAL — SEMANA {currentWeek}</div>
          <div style={{fontWeight:700,fontSize:15,color:currentBlock.color||"#64748b"}}>{currentBlock.name}</div>
          <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{currentBlock.rep_range} reps · {currentBlock.split_type}</div>
        </div>
      )}
      <div className="card" style={{textAlign:"center",padding:40}}>
        <div style={{fontSize:30,marginBottom:10}}>😴</div>
        <div style={{fontWeight:700,fontSize:15,marginBottom:6}}>Sin sesión programada hoy</div>
        <div style={{fontSize:12,color:"#64748b"}}>Tu trainer asignará tu próxima sesión</div>
      </div>

      {/* Next session */}
      {myAssignedSessions.filter(s=>s.date>TODAY_STR&&s.status==="pending").length>0&&(
        <div style={{marginTop:16}}>
          <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,marginBottom:8}}>PRÓXIMA SESIÓN</div>
          {myAssignedSessions.filter(s=>s.date>TODAY_STR&&s.status==="pending").sort((a,b)=>a.date.localeCompare(b.date)).slice(0,1).map(sess=>{
            const sessExes = myAssignedExercises.filter(ae=>ae.session_id===sess.id);
            return(
              <div key={sess.id} className="card" style={{border:"1px solid #bcd3ee"}}>
                <div style={{fontWeight:700,fontSize:14,color:"#0284c7",marginBottom:4}}>
                  {new Date(sess.date+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}
                </div>
                {sessExes.map(ae=>(
                  <div key={ae.id} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"5px 0",borderTop:"1px solid #e6ebf3",color:"#64748b"}}>
                    <span>{ae.exercise_name}</span>
                    <div style={{display:"flex",gap:8}}>
                      <span className="mono">{ae.sets}×{ae.reps}</span>
                      {ae.prescribed_weight&&<span style={{color:"#ca8a04",fontWeight:700}}>{ae.prescribed_weight}kg</span>}
                    </div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );

  return(
    <div>
      {currentBlock&&(
        <div style={{background:"linear-gradient(135deg,#f1f4fa,#ffffff)",borderRadius:14,border:`1px solid ${currentBlock.color||"#cbd5e1"}30`,padding:14,marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:10,color:"#94a3b8",fontWeight:700}}>SEMANA {currentWeek}</div>
            <div style={{fontWeight:700,fontSize:14,color:currentBlock.color||"#64748b",marginTop:2}}>{currentBlock.name}</div>
          </div>
          {completedAll&&<div style={{fontSize:24}}>🏆</div>}
        </div>
      )}

      {todaySessions.map(sess=>{
        const sessExes = myAssignedExercises.filter(ae=>ae.session_id===sess.id).sort((a,b)=>a.order_index-b.order_index);
        const completedCount = sessExes.filter(ae=>ae.completed).length;
        const pct = sessExes.length>0 ? Math.round(completedCount/sessExes.length*100) : 0;

        return(
          <div key={sess.id}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div>
                <div style={{fontWeight:800,fontSize:17}}>Sesión de hoy ⚡</div>
                <div style={{fontSize:12,color:"#64748b",marginTop:2}}>{completedCount}/{sessExes.length} ejercicios · {pct}%</div>
              </div>
              {sess.status==="completed"&&<span style={{fontSize:13,color:"#16a34a",fontWeight:700}}>✓ Completada</span>}
            </div>

            <div className="pbar" style={{marginBottom:16,height:8}}>
              <div className="pfill" style={{width:`${pct}%`,background:`linear-gradient(90deg,#0284c7,#16a34a)`}}/>
            </div>

            {sessExes.map((ae,i)=>(
              <ExerciseCard key={ae.id} ae={ae} index={i} onComplete={markExerciseComplete} saving={saving}/>
            ))}

            {sess.notes&&(
              <div style={{background:"#f1f4fa",borderRadius:10,padding:"10px 12px",marginTop:10,fontSize:12,color:"#64748b",border:"1px solid #cbd5e1"}}>
                📝 {sess.notes}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── EXERCISE CARD (client registers completion) ────────────────────────────
function ExerciseCard({ae, index, onComplete, saving}) {
  const [expanded,setExpanded] = React.useState(false);
  const [actualWeight,setActualWeight] = React.useState(ae.prescribed_weight||"");
  const [actualReps,setActualReps] = React.useState(ae.reps||"");
  const [rpe,setRpe] = React.useState("");

  if(ae.completed) return(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid #e6ebf3",opacity:0.6}}>
      <div style={{display:"flex",gap:10,alignItems:"center"}}>
        <div style={{width:22,height:22,borderRadius:6,background:"#e2f4e8",border:"1px solid #14532d",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>✓</div>
        <div>
          <div style={{fontSize:13,fontWeight:600,color:"#16a34a"}}>{ae.exercise_name}</div>
          <div style={{fontSize:11,color:"#94a3b8"}}>{ae.actual_weight||ae.prescribed_weight}kg · {ae.actual_reps||ae.reps} reps{ae.rpe_felt?` · RPE ${ae.rpe_felt}`:""}</div>
        </div>
      </div>
      <span style={{fontSize:16}}>✅</span>
    </div>
  );

  return(
    <div style={{borderBottom:"1px solid #e6ebf3",paddingBottom:10,marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>setExpanded(!expanded)}>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <div style={{width:22,height:22,borderRadius:6,background:"#e6f0fb",border:"1px solid #bcd3ee",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#0284c7",flexShrink:0}}>{index+1}</div>
          <div>
            <div style={{fontSize:13,fontWeight:600}}>{ae.exercise_name}</div>
            <div style={{display:"flex",gap:8,marginTop:2}}>
              <span className="mono" style={{fontSize:12,color:"#0284c7",fontWeight:700}}>{ae.sets}×{ae.reps}</span>
              {ae.prescribed_weight&&<span style={{fontSize:12,color:"#ca8a04",fontWeight:700}}>{ae.prescribed_weight}kg</span>}
              {ae.rest_seconds&&<span style={{fontSize:11,color:"#94a3b8"}}>⏱{ae.rest_seconds}s</span>}
            </div>
          </div>
        </div>
        <span style={{color:"#94a3b8",fontSize:16}}>{expanded?"▲":"▼"}</span>
      </div>

      {ae.notes&&<div style={{fontSize:11,color:"#94a3b8",marginTop:6,paddingLeft:32,fontStyle:"italic"}}>{ae.notes}</div>}

      {expanded&&(
        <div style={{marginTop:10,paddingLeft:32,display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            <div>
              <span className="lbl" style={{fontSize:9}}>PESO REAL (kg)</span>
              <input type="number" className="inp" step="0.5" style={{padding:"8px",fontSize:14,textAlign:"center"}} value={actualWeight} onChange={e=>setActualWeight(e.target.value)} placeholder={ae.prescribed_weight||"0"}/>
            </div>
            <div>
              <span className="lbl" style={{fontSize:9}}>REPS REALES</span>
              <input className="inp" style={{padding:"8px",fontSize:14,textAlign:"center"}} value={actualReps} onChange={e=>setActualReps(e.target.value)} placeholder={ae.reps}/>
            </div>
            <div>
              <span className="lbl" style={{fontSize:9}}>RPE</span>
              <input type="number" className="inp" min="1" max="10" step="0.5" style={{padding:"8px",fontSize:14,textAlign:"center"}} value={rpe} onChange={e=>setRpe(e.target.value)} placeholder="8"/>
            </div>
          </div>
          <button className="btn grn" style={{width:"100%",padding:10,fontSize:13}} onClick={()=>onComplete(ae.id,parseFloat(actualWeight)||null,actualReps||null,parseFloat(rpe)||null)} disabled={saving}>
            ✓ Marcar como completado
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>

    navigator.serviceWorker.register('/sw.js')

      .catch(function(e){ console.log('SW err', e); });
