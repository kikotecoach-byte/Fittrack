// ── BULK WA MODAL ──────────────────────────────────────────────────────────
// Plantillas por grupo. Los comodines {nombre} {sesiones} {importe} {vence}
// se rellenan solos con los datos de cada cliente.
const WA_TEMPLATES = {
  pay: "Hola {nombre}! 👋 Te recuerdo que tu cuota de {importe}€ vence {vence}. ¡Cualquier duda aquí estoy! 💪",
  low: "Hola {nombre}! Te quedan {sesiones} sesión(es). ¿Renovamos el paquete para no interrumpir tu progreso? 🔥💪",
  expired: "Hola {nombre}! Se te agotaron las sesiones. ¿Renovamos para seguir entrenando? 💪",
  all: "Hola {nombre}! 👋 Te escribo desde Kikote Gym. ",
};
// Rellena una plantilla con los datos reales de un cliente.
const fillWA = (tpl,c) => {
  const pd = daysUntil(c.next_payment);
  const abs = Math.abs(pd);
  const vence = isNaN(pd) ? "pronto" : pd===0 ? "hoy" : pd<0 ? `hace ${abs} día${abs===1?"":"s"}` : `en ${pd} día${pd===1?"":"s"}`;
  return tpl
    .split("{nombre}").join(c.name.split(" ")[0])
    .split("{sesiones}").join(c.sessions_left)
    .split("{importe}").join(c.payment_amount??"")
    .split("{vence}").join(vence);
};

function BulkWAModal({clients,onClose,notify}) {
  const [selected,setSelected]=React.useState("pay");
  const [msg,setMsg]=React.useState(WA_TEMPLATES.pay);

  // "Ya avisados hoy" se guarda en el móvil (no repites a nadie ni al recargar).
  const doneKey = `kikote_wa_${TODAY}`;
  const [done,setDone]=React.useState(()=>{
    try { return new Set(JSON.parse(localStorage.getItem(doneKey)||"[]")); } catch { return new Set(); }
  });
  const marcar = (id)=>setDone(prev=>{
    const n=new Set(prev); n.add(id);
    try { localStorage.setItem(doneKey,JSON.stringify([...n])); } catch {}
    return n;
  });
  const reiniciar = ()=>{ try{localStorage.removeItem(doneKey);}catch{} setDone(new Set()); };

  const grupos = {
    pay: clients.filter(c=>daysUntil(c.next_payment)<=5),
    low: clients.filter(c=>c.sessions_left<=2&&c.sessions_left>0),
    expired: clients.filter(c=>c.sessions_left===0),
    all: clients,
  };
  const targets = grupos[selected]||clients;
  // Sin avisar primero, avisados abajo: así vas tocando en fila.
  const ordenados = [...targets].sort((a,b)=>(done.has(a.id)?1:0)-(done.has(b.id)?1:0));
  const hechos = targets.filter(c=>done.has(c.id)).length;

  const cambiarGrupo = (g)=>{ setSelected(g); setMsg(WA_TEMPLATES[g]); };

  return(
    <div className="ovl" onClick={onClose}>
      <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:500}}>
        <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:6}}>📱 WhatsApp masivo</h2>
        <p style={{fontSize:12,color:"#64748b",marginBottom:16}}>Elige el grupo, el mensaje ya viene escrito. Toca cada cliente para abrir WhatsApp y enviar.</p>
        <div className="seg" style={{marginBottom:14,flexWrap:"wrap"}}>
          <button className={`sb ${selected==="pay"?"on":""}`} onClick={()=>cambiarGrupo("pay")}>💳 Pago ({grupos.pay.length})</button>
          <button className={`sb ${selected==="low"?"on":""}`} onClick={()=>cambiarGrupo("low")}>⚡ Pocas ({grupos.low.length})</button>
          <button className={`sb ${selected==="expired"?"on":""}`} onClick={()=>cambiarGrupo("expired")}>🚫 Sin sesiones ({grupos.expired.length})</button>
          <button className={`sb ${selected==="all"?"on":""}`} onClick={()=>cambiarGrupo("all")}>Todos ({grupos.all.length})</button>
        </div>
        <div>
          <span className="lbl">MENSAJE (se personaliza por cliente)</span>
          <textarea className="inp" rows={3} style={{resize:"vertical"}} value={msg} onChange={e=>setMsg(e.target.value)}/>
          <p style={{fontSize:10,color:"#94a3b8",marginTop:5}}>Comodines: {"{nombre} {sesiones} {importe} {vence}"} — se rellenan solos.</p>
        </div>
        {targets.length>0?(
          <div style={{marginTop:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:11,color:"#94a3b8",fontWeight:700}}>AVISADOS {hechos}/{targets.length}</div>
              {hechos>0&&<button className="btn ghost" style={{fontSize:10,padding:"3px 9px"}} onClick={reiniciar}>Reiniciar</button>}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:260,overflowY:"auto"}}>
              {ordenados.map(c=>{
                const ok=done.has(c.id);
                return(
                  <a key={c.id} href={msg?waLink(c.phone||TRAINER_PHONE,fillWA(msg,c)):"#"} target="_blank" rel="noreferrer"
                    style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:ok?"#f2f5f2":"#edf7ed",
                      border:`1px solid ${ok?"#c9e6d1":"#14532d"}`,borderRadius:10,textDecoration:"none",opacity:ok?0.55:1}}
                    onClick={()=>{marcar(c.id);notify(`Abriendo WA de ${c.name}...`,"wa");}}>
                    <div className="ring" style={{width:30,height:30,background:c.color+"20",color:c.color,fontSize:10}}>{ini(c.name)}</div>
                    <div style={{flex:1,fontSize:13,fontWeight:600,color:ok?"#64748b":"#16a34a"}}>{c.name}</div>
                    <span style={{fontSize:11,color:ok?"#16a34a":"#64748b"}}>{ok?"✓ avisado":"📱 Abrir"}</span>
                  </a>
                );
              })}
            </div>
          </div>
        ):(
          <p style={{fontSize:12,color:"#94a3b8",marginTop:14}}>No hay clientes en este grupo ahora mismo. 🎉</p>
        )}
        <button className="btn ghost" style={{width:"100%",marginTop:14,padding:10}} onClick={onClose}>Cerrar</button>
      </div>
    </div>
  );
}

// ── CLIENT PORTAL ──────────────────────────────────────────────────────────
function ClientPortal({client,allSessions,allHistory,allClients,blocked,waitlist,forum,exercises,plans,clientPlans,myProgress,myRecords,myAchievements,myAssignedSessions,myAssignedExercises,clientWeights,annualBlocks,loadAll,notify,onLogout}) {
  const [tab,setTab]=React.useState("home");
  const [reqDate,setReqDate]=React.useState(TODAY);
  const [reqTime,setReqTime]=React.useState("07:00");
  const [reqType,setReqType]=React.useState("Fuerza");
  const [saving,setSaving]=React.useState(false);
  const [config,setConfig]=React.useState(DEFAULT_SCHEDULE);

  // Carga el horario/capacidad definidos por el coach (para mostrar los huecos).
  React.useEffect(()=>{
    sb.from("app_settings").select("config").eq("id",1).then(({data})=>{
      if(data&&data[0]&&data[0].config) setConfig({...DEFAULT_SCHEDULE,...data[0].config});
    });
  },[]);

  const mySessions=allSessions.filter(s=>s.client_id===client.id&&s.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date));
  const myHistory=allHistory.filter(s=>s.client_id===client.id).sort((a,b)=>b.date.localeCompare(a.date));
  const pct=Math.round(client.sessions_left/client.total_sessions*100);
  const pd=daysUntil(client.next_payment);
  const streak=calcStreak(myHistory);
  const nextSess=mySessions.find(s=>!s.requested);
  const nextCountdown=nextSess?daysUntil(nextSess.date):null;
  const thisMonthSessions=myHistory.filter(h=>h.date&&h.date.startsWith(new Date().toISOString().slice(0,7))).length;

  const submitRequest=async()=>{
    if(client.sessions_left===0) return notify("Sin sesiones. Contacta a tu trainer.","err");
    setSaving(true);
    const {error}=await sb.from("sessions").insert({client_id:client.id,date:reqDate,time:reqTime,type:reqType,status:"pending",requested:true});
    if(error){notify("Error al enviar","err");setSaving(false);return;}
    await loadAll(); setSaving(false);
    notify("¡Solicitud enviada! Tu trainer la confirmará pronto 🎯");
    setTab("home");
  };

  // Lista de espera: detecta si se ha liberado un hueco en una clase que el
  // cliente esperaba, para avisarle y dejar que lo reserve.
  const capOfC=(t)=>(config.capacity&&config.capacity[t]!=null)?config.capacity[t]:config.defaultCapacity;
  const myWaits=(waitlist||[]).filter(w=>w.client_id===client.id&&w.date>=TODAY);
  const freedWaits=myWaits.filter(w=>{
    const blk=blocked.some(b=>b.date===w.date&&(b.time===w.time||b.time==="ALL"));
    const taken=allSessions.filter(s=>s.date===w.date&&s.time===w.time).length;
    return !blk && taken<capOfC(w.time);
  });
  const grabWaitlistSpot=async(wtry)=>{
    if(client.sessions_left<=0) return notify("Sin sesiones en tu bono","err");
    const taken=allSessions.filter(s=>s.date===wtry.date&&s.time===wtry.time).length;
    if(taken>=capOfC(wtry.time)) return notify("El hueco se acaba de ocupar","err");
    setSaving(true);
    await sb.from("sessions").insert({client_id:client.id,date:wtry.date,time:wtry.time,type:"Fuerza",status:"pending",requested:true});
    await sb.from("waitlist").delete().eq("id",wtry.id);
    await loadAll(); setSaving(false);
    notify("¡Hueco reservado! Tu trainer lo confirmará 🎯");
  };
  const leaveWait=async(id)=>{ await sb.from("waitlist").delete().eq("id",id); await loadAll(); notify("Fuera de la lista de espera"); };

  return(
    <div style={{minHeight:"100vh",maxWidth:480,margin:"0 auto",padding:"22px 16px"}} className="fade">
      {saving&&<div style={{position:"fixed",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,#0284c7,#16a34a)",zIndex:500}}/>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:18}}>🏋️</span>
          <div className="mono" style={{fontSize:13,fontWeight:700,color:"#0284c7"}}>{GYM_NAME}</div>
        </div>
        <button className="btn ghost" style={{fontSize:12,padding:"6px 11px"}} onClick={onLogout}>Salir</button>
      </div>

      {/* Welcome message */}
      {client.welcome_msg&&(
        <div style={{background:"#eaf1fb",border:"1px solid #bcd3ee",borderRadius:14,padding:"12px 16px",marginBottom:16,fontSize:13,color:"#64748b"}}>
          💬 {client.welcome_msg}
        </div>
      )}

      {/* Aviso: se ha liberado un hueco de tu lista de espera */}
      {freedWaits.map(w=>(
        <div key={w.id} style={{background:"#eef8dd",border:"1px solid #cbe8a4",borderRadius:14,padding:"12px 14px",marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:700,color:"#65a30d",marginBottom:2}}>🎉 ¡Hueco libre a las {w.time}!</div>
          <div style={{fontSize:12,color:"#6b7a3f",marginBottom:10}}>Se ha liberado tu clase en espera del {fmtDate(w.date)}. ¡Corre, reserva antes de que se ocupe!</div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn grn" style={{flex:1,padding:"9px",justifyContent:"center"}} disabled={saving} onClick={()=>grabWaitlistSpot(w)}>Reservar ahora 🚀</button>
            <button className="btn ghost" style={{padding:"9px 12px"}} onClick={()=>leaveWait(w.id)}>Quitar</button>
          </div>
        </div>
      ))}
      {/* Recordatorio de esperas aún llenas */}
      {myWaits.filter(w=>!freedWaits.some(f=>f.id===w.id)).map(w=>(
        <div key={w.id} style={{background:"#fbf4e3",border:"1px solid #ecdfb0",borderRadius:12,padding:"9px 13px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
          <div style={{fontSize:12,color:"#a1873c"}}>⏳ En espera · {fmtDate(w.date)} a las {w.time}</div>
          <button className="btn ghost" style={{fontSize:11,padding:"5px 9px"}} onClick={()=>leaveWait(w.id)}>Quitar</button>
        </div>
      ))}

      {/* Hero card */}
      <div className="hero-card" style={{marginBottom:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18}}>
          <div style={{display:"flex",gap:13,alignItems:"center"}}>
            {client.avatar_url
              ? <img src={client.avatar_url} style={{width:50,height:50,borderRadius:"50%",objectFit:"cover",border:`2px solid ${client.color}`,flexShrink:0}}/>
              : <div className="ring" style={{width:50,height:50,background:client.color+"25",color:client.color,fontSize:17,border:`2px solid ${client.color}50`}}>{ini(client.name)}</div>
            }
            <div>
              <div style={{fontWeight:800,fontSize:16}}>{client.name}</div>
              <div style={{display:"flex",gap:8,marginTop:3,alignItems:"center"}}>
                {streak>0&&<span style={{fontSize:12,color:"#ea580c"}} className="streak-fire">🔥 {streak} semanas seguidas</span>}
                {streak===0&&<span style={{fontSize:11,color:"#94a3b8"}}>Miembro activo</span>}
              </div>
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <div className="mono" style={{fontSize:32,fontWeight:700,color:client.color,lineHeight:1}}>{client.sessions_left}</div>
            <div style={{fontSize:10,color:"#94a3b8",fontWeight:700}}>SESIONES</div>
          </div>
        </div>

        {/* Progress */}
        <div style={{marginBottom:14}}>
          <div className="pbar" style={{height:9,background:"#eaf1fb"}}>
            <div className="pfill" style={{width:`${pct}%`,background:`linear-gradient(90deg,${pct>40?"#0284c7,#16a34a":pct>20?"#f59e0b,#ca8a04":"#dc2626,#dc2626"})`}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:5,fontSize:10,color:"#94a3b8"}}>
            <span>{client.sessions_left} disponibles</span><span>{client.total_sessions} total</span>
          </div>
        </div>

        {/* Stats row */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
          <div style={{background:"#eaf1fb",borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
            <div className="mono" style={{fontSize:16,fontWeight:700,color:"#a78bfa"}}>{thisMonthSessions}</div>
            <div style={{fontSize:9,color:"#94a3b8",fontWeight:700}}>ESTE MES</div>
          </div>
          <div style={{background:"#eaf1fb",borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
            <div className="mono" style={{fontSize:16,fontWeight:700,color:"#16a34a"}}>{myHistory.length}</div>
            <div style={{fontSize:9,color:"#94a3b8",fontWeight:700}}>TOTAL</div>
          </div>
          <div style={{background:"#eaf1fb",borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
            <div className="mono" style={{fontSize:16,fontWeight:700,color:nextCountdown===0?"#ca8a04":nextCountdown!==null?"#0284c7":"#94a3b8"}}>
              {nextCountdown===null?"—":nextCountdown===0?"Hoy":`${nextCountdown}d`}
            </div>
            <div style={{fontSize:9,color:"#94a3b8",fontWeight:700}}>PRÓXIMA</div>
          </div>
        </div>

        {/* Payment + countdown */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:10,color:"#94a3b8",fontWeight:700}}>PRÓXIMO PAGO</div>
            <div style={{fontSize:13,color:pd<=3?"#dc2626":pd<=7?"#ca8a04":"#64748b",marginTop:2}}>
              {client.payment_amount}€ · {pd<0?`Vencido hace ${Math.abs(pd)}d`:pd===0?"¡Vence hoy!":pd<=3?`⚠️ En ${pd} días`:`En ${pd} días`}
            </div>
          </div>
          <a href={waLink(TRAINER_PHONE,`Hola! Soy ${client.name} 💪`)} target="_blank" rel="noreferrer">
            <button className="btn wa" style={{fontSize:12}}>📱 Trainer</button>
          </a>
        </div>
      </div>

      <div style={{display:"flex",gap:4,overflowX:"auto",marginBottom:16,paddingBottom:4}}>
        {[["today","⚡ Hoy"],["home","📅 Sesiones"],["calendar","🗓 Clases"],["progress","📊 Progreso"],["plan","🏋️ Mi Plan"],["forum","💬 Comunidad"],["history","📋 Historial"]].map(([id,label])=>(
          <button key={id} className={"tab"+(tab===id?" on":"")} onClick={()=>setTab(id)} style={{flexShrink:0,fontSize:11}}>{label}</button>
        ))}
      </div>

      {tab==="today"&&(
        <TodaySession
          client={client}
          myAssignedSessions={myAssignedSessions}
          myAssignedExercises={myAssignedExercises}
          clientWeights={clientWeights}
          annualBlocks={annualBlocks}
          loadAll={loadAll}
          notify={notify}
        />
      )}

      {tab==="home"&&(
        <div>
          <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,marginBottom:10}}>PRÓXIMAS SESIONES</div>
          {mySessions.length===0
            ?<div className="card" style={{textAlign:"center",padding:34}}>
              <div style={{fontSize:26,marginBottom:8}}>📅</div>
              <div style={{color:"#64748b",fontSize:13}}>Sin sesiones agendadas</div>
              <button className="btn sky" style={{marginTop:12,padding:"9px 18px"}} onClick={()=>setTab("request")}>Solicitar sesión</button>
            </div>
            :mySessions.map(s=>(
              <div key={s.id} className="card" style={{marginBottom:9,border:`1px solid ${s.requested?"#eed7bd":"var(--border)"}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:14}}>{s.type}</div>
                    <div style={{fontSize:12,color:"#64748b",marginTop:3}}>{fmtLong(s.date)}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div className="mono" style={{fontSize:17,fontWeight:700,color:"#0284c7"}}>{s.time}</div>
                    <div style={{marginTop:4,fontSize:11,color:s.requested?"#ea580c":s.status==="confirmed"?"#16a34a":"#ca8a04"}}>
                      {s.requested?"⏳ Pendiente":s.status==="confirmed"?"✓ Confirmada":"Por confirmar"}
                    </div>
                    {!s.requested&&daysUntil(s.date)<=1&&(
                      <div style={{fontSize:10,color:"#ca8a04",marginTop:2}}>{daysUntil(s.date)===0?"¡Hoy!":"¡Mañana!"}</div>
                    )}
                  </div>
                </div>
              </div>
            ))
          }
          <a href={waLink(TRAINER_PHONE,`Hola! Soy ${client.name} 👋`)} target="_blank" rel="noreferrer" style={{display:"block",marginTop:16}}>
            <button className="btn wa" style={{width:"100%",padding:12,justifyContent:"center",fontSize:13}}>📱 Chatear con mi trainer</button>
          </a>
        </div>
      )}

      {tab==="request"&&(
        <div>
          <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,marginBottom:12}}>SOLICITAR SESIONES</div>
          {client.sessions_left===0
            ?<div className="card" style={{textAlign:"center",padding:34,border:"1px solid #f2cccc"}}>
              <div style={{fontSize:26,marginBottom:8}}>🚫</div>
              <div style={{color:"#dc2626",fontWeight:700,marginBottom:6}}>Sin sesiones disponibles</div>
              <a href={waLink(TRAINER_PHONE,`Hola! Soy ${client.name}, quisiera renovar mi paquete 💪`)} target="_blank" rel="noreferrer">
                <button className="btn wa" style={{justifyContent:"center",padding:"10px 20px"}}>📱 Renovar por WhatsApp</button>
              </a>
            </div>
            :<MultiSessionRequest client={client} allSessions={allSessions} allClients={allClients} blocked={blocked} waitlist={waitlist} config={config} loadAll={loadAll} notify={notify} saving={saving} setSaving={setSaving}/>
          }
        </div>
      )}

      {tab==="history"&&(
        <div>
          <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,marginBottom:10}}>HISTORIAL DE SESIONES</div>
          {myHistory.length===0
            ?<div className="card" style={{textAlign:"center",padding:34}}><div style={{fontSize:26,marginBottom:8}}>📋</div><div style={{color:"#64748b",fontSize:13}}>Sin sesiones completadas aún</div></div>
            :myHistory.map(s=>(
              <div key={s.id} className="card" style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div><div style={{fontWeight:700}}>{s.type}</div><div style={{fontSize:12,color:"#64748b",marginTop:2}}>{fmtLong(s.date)}</div></div>
                  <div style={{textAlign:"right"}}><div className="mono" style={{color:"#64748b",fontSize:12}}>{s.time}</div><div style={{fontSize:11,color:"#16a34a",marginTop:3}}>✓ Completada</div></div>
                </div>
              </div>
            ))
          }
          <div style={{marginTop:14,display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div style={{padding:"14px",background:"#eaf1fb",borderRadius:12,border:"1px solid #bcd3ee",textAlign:"center"}}>
              <div className="mono" style={{fontSize:22,fontWeight:700,color:"#0284c7"}}>{myHistory.length}</div>
              <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,marginTop:3}}>TOTAL</div>
            </div>
            <div style={{padding:"14px",background:"#eaf1fb",borderRadius:12,border:"1px solid #bcd3ee",textAlign:"center"}}>
              <div className="mono" style={{fontSize:22,fontWeight:700,color:"#ea580c"}}>{streak>0?`🔥${streak}`:"0"}</div>
              <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,marginTop:3}}>SEMANAS RACHA</div>
            </div>
          </div>
        </div>
      )}

      {/* CALENDAR TAB - client sees full week schedule */}
      {tab==="calendar"&&(
        <ClientCalendar client={client} allSessions={allSessions} allClients={allClients} blocked={blocked}/>
      )}

      {/* FORUM TAB */}
      {tab==="progress"&&(
        <ProgressTab client={client} myProgress={myProgress} myRecords={myRecords} myAchievements={myAchievements} exercises={exercises} loadAll={loadAll} notify={notify}/>
      )}

      {tab==="plan"&&(
        <PlanTab client={client} plans={plans} clientPlans={clientPlans} exercises={exercises}/>
      )}

      {tab==="forum"&&(
        <ForumTab client={client} forum={forum} allClients={allClients} loadAll={loadAll} notify={notify}/>
      )}
    </div>
  );
}

// ── MULTI SESSION REQUEST (selector visual de huecos) ─────────────────────
function MultiSessionRequest({client, allSessions, allClients, blocked, waitlist, config, loadAll, notify, saving, setSaving}) {
  const [date,setDate] = React.useState(TODAY);
  const [type,setType] = React.useState("Fuerza");
  const [picked,setPicked] = React.useState([]); // horas seleccionadas para esa fecha

  // Franjas y capacidad definidas por el coach.
  const workSlots=[...genSlots(config.morningFrom,config.morningTo),...genSlots(config.afternoonFrom,config.afternoonTo)];
  const capOf=(t)=>(config.capacity&&config.capacity[t]!=null)?config.capacity[t]:config.defaultCapacity;
  const dayBlocked=isWeekend(date)||blocked.some(b=>b.date===date&&b.time==="ALL");
  const slotBlocked=(t)=>dayBlocked||blocked.some(b=>b.date===date&&b.time===t);
  const takenAt=(t)=>allSessions.filter(s=>s.date===date&&s.time===t).length; // reservadas (pendientes + confirmadas)
  const freeAt=(t)=>Math.max(0,capOf(t)-takenAt(t));
  const nowHM=new Date().toTimeString().slice(0,5);
  const isPast=(t)=>date<TODAY||(date===TODAY&&t<=nowHM);
  const available=(t)=>!slotBlocked(t)&&freeAt(t)>0&&!isPast(t);

  // Lista de espera para huecos completos.
  const myWait=(t)=>waitlist.find(w=>w.client_id===client.id&&w.date===date&&w.time===t);
  const joinWaitlist=async(t)=>{
    if(myWait(t)) return;
    const {error}=await sb.from("waitlist").insert({client_id:client.id,date,time:t});
    if(error) return notify("Necesitas crear la tabla waitlist (ver docs)","err");
    await loadAll(); notify("En lista de espera ⏳ Te avisaremos si se libera");
  };
  const leaveWaitlist=async(t)=>{
    const w=myWait(t); if(!w) return;
    await sb.from("waitlist").delete().eq("id",w.id);
    await loadAll(); notify("Fuera de la lista de espera");
  };

  // Al cambiar de fecha, limpiamos la selección (los huecos cambian).
  const changeDate=(d)=>{ setDate(d); setPicked([]); };
  const toggle=(t)=>{
    if(!picked.includes(t)&&!available(t)) return;
    if(!picked.includes(t)&&picked.length>=client.sessions_left) return notify(`Solo tienes ${client.sessions_left} sesiones`,"err");
    setPicked(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);
  };

  const submit=async()=>{
    if(client.sessions_left===0) return notify("Sin sesiones. Contacta a tu trainer.","err");
    if(picked.length===0) return notify("Elige al menos una hora libre","err");
    // Revalida por si alguna se llenó justo antes de enviar.
    const lleno=picked.find(t=>freeAt(t)<=0||slotBlocked(t)||isPast(t));
    if(lleno) return notify(`La ${lleno} ya no está disponible`,"err");
    setSaving(true);
    const inserts=picked.map(t=>({client_id:client.id,date,time:t,type,status:"pending",requested:true}));
    const {error}=await sb.from("sessions").insert(inserts);
    if(error){ notify("Error al enviar","err"); setSaving(false); return; }
    await loadAll(); setSaving(false); setPicked([]);
    notify(`✓ ${inserts.length} sesión${inserts.length>1?"es":""} solicitada${inserts.length>1?"s":""}! Tu trainer la${inserts.length>1?"s":""} confirmará 🎯`);
  };

  return(
    <div className="card">
      <div style={{background:"#eaf1fb",borderRadius:10,padding:"11px 13px",border:"1px solid #bcd3ee",fontSize:13,color:"#64748b",marginBottom:16}}>
        💡 Elige un día y toca las horas libres que quieras reservar.
        <div style={{marginTop:4,fontSize:12,color:"#94a3b8"}}>Sesiones en tu bono: <span style={{color:"#0284c7",fontWeight:700}}>{client.sessions_left}</span></div>
      </div>

      <div style={{marginBottom:14}}><span className="lbl">DÍA</span>
        <input type="date" className="inp" value={date} min={TODAY} onChange={e=>changeDate(e.target.value)}/>
      </div>
      <div style={{marginBottom:16}}><span className="lbl">TIPO DE SESIÓN</span>
        <select className="inp" style={{appearance:"none"}} value={type} onChange={e=>setType(e.target.value)}>
          {SESSION_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
      </div>

      <span className="lbl">HORAS DEL DÍA</span>
      {dayBlocked
        ?<div style={{background:isWeekend(date)?"#edf7ed":"#fbecec",border:`1px solid ${isWeekend(date)?"#c9e6d1":"#f2cccc"}`,borderRadius:10,padding:14,textAlign:"center",fontSize:13,color:isWeekend(date)?"#16a34a":"#dc2626"}}>{isWeekend(date)?"🌴 Fin de semana — sin clases":"🚫 Día no disponible"}</div>
        :workSlots.length===0
          ?<div style={{fontSize:12,color:"#94a3b8"}}>No hay horario configurado.</div>
          :<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {workSlots.map(t=>{
              const sel=picked.includes(t), free=freeAt(t), ok=available(t), cap=capOf(t);
              const enrolled=allSessions.filter(s=>s.date===date&&s.time===t)
                .map(s=>({...s,c:allClients.find(x=>x.id===s.client_id)})).filter(s=>s.c);
              const estado=isPast(t)?"Pasada":slotBlocked(t)?"🚫 Bloqueada":free<=0?"Completa":`${free} libre${free>1?"s":""}`;
              const estCol=sel?"#16a34a":(free<=0||slotBlocked(t)||isPast(t))?"#dc2626":"#16a34a";
              return(
                <div key={t} onClick={()=>toggle(t)}
                  style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:12,cursor:ok||sel?"pointer":"default",
                    background:sel?"#dff3e6":ok?"#edf7ed":"#f1f4fa",border:`1px solid ${sel?"#16a34a":ok?"#14532d":"#e6ebf3"}`,opacity:(slotBlocked(t)||isPast(t))?0.55:1}}>
                  {/* Hora */}
                  <div style={{flexShrink:0,textAlign:"center",minWidth:44}}>
                    <div className="mono" style={{fontSize:15,fontWeight:700,color:sel?"#16a34a":ok?"#0f172a":"#64748b"}}>{t}</div>
                    <div style={{fontSize:9,fontWeight:700,marginTop:1,color:estCol}}>{sel?"✓ elegida":estado}</div>
                  </div>
                  {/* Personas apuntadas + huecos libres */}
                  <div style={{flex:1,display:"flex",flexWrap:"wrap",gap:6,alignItems:"center"}}>
                    {enrolled.map(s=>{
                      const yo=s.c.id===client.id;
                      // Privacidad: solo el cliente ve su propia reserva; los demás son plazas ocupadas anónimas.
                      return yo
                        ?<div key={s.id} style={{display:"flex",alignItems:"center",gap:6,background:s.c.color+"18",border:`1px solid ${s.c.color}40`,borderRadius:20,padding:"3px 9px 3px 3px"}}>
                          {s.c.avatar_url
                            ?<img src={s.c.avatar_url} style={{width:24,height:24,borderRadius:"50%",objectFit:"cover"}}/>
                            :<div className="ring" style={{width:24,height:24,background:s.c.color+"30",color:s.c.color,fontSize:9}}>{ini(s.c.name)}</div>}
                          <span style={{fontSize:12,fontWeight:700,color:s.c.color}}>Tú</span>
                        </div>
                        :<div key={s.id} title="Plaza ocupada" style={{width:26,height:26,borderRadius:"50%",background:"#cbd5e1",border:"1.5px solid #cbd5e1",display:"flex",alignItems:"center",justifyContent:"center",color:"#64748b",fontSize:14,fontWeight:700}}>•</div>;
                    })}
                    {/* Huecos libres como plazas vacías */}
                    {!slotBlocked(t)&&!isPast(t)&&Array.from({length:free}).map((_,k)=>(
                      <div key={"f"+k} style={{width:26,height:26,borderRadius:"50%",border:"1.5px dashed #c9e6d1",display:"flex",alignItems:"center",justifyContent:"center",color:"#c9e6d1",fontSize:13}}>+</div>
                    ))}
                    {enrolled.length===0&&slotBlocked(t)&&<span style={{fontSize:11,color:"#b56b6b"}}>No disponible</span>}
                  </div>
                  <div style={{flexShrink:0,display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}}>
                    <span className="mono" style={{fontSize:10,fontWeight:700,color:"#94a3b8"}}>{enrolled.length}/{cap}</span>
                    {free<=0&&!slotBlocked(t)&&!isPast(t)&&(myWait(t)
                      ?<button onClick={e=>{e.stopPropagation();leaveWaitlist(t);}} style={{background:"#fbf1d8",border:"1px solid #e4cd8c",color:"#ca8a04",borderRadius:8,fontSize:10,fontWeight:700,padding:"4px 8px",cursor:"pointer",whiteSpace:"nowrap"}}>⏳ En espera ✓</button>
                      :<button onClick={e=>{e.stopPropagation();joinWaitlist(t);}} style={{background:"#fbf1d8",border:"1px solid #e4cd8c",color:"#ca8a04",borderRadius:8,fontSize:10,fontWeight:700,padding:"4px 8px",cursor:"pointer",whiteSpace:"nowrap"}}>⏳ Espera</button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
      }

      <button className="btn sky" style={{width:"100%",padding:12,fontSize:13,marginTop:16,opacity:picked.length?1:0.5}} onClick={submit} disabled={saving||picked.length===0}>
        {saving?"Enviando...":picked.length?`Reservar ${picked.length} sesión${picked.length>1?"es":""} 🚀`:"Elige una hora libre"}
      </button>
    </div>
  );
}

// ── CLIENT CALENDAR ───────────────────────────────────────────────────────
function ClientCalendar({client, allSessions, allClients, blocked}) {
  const [calWeek, setCalWeek] = React.useState(TODAY);
  const weekDays = getWeekDays(calWeek);
  const workDays = weekDays.slice(0,5); // Mon-Fri

  // Group sessions by day
  const sessionsByDay = {};
  workDays.forEach(day => {
    sessionsByDay[day] = allSessions
      .filter(s=>s.date===day&&!s.requested)
      .sort((a,b)=>a.time.localeCompare(b.time));
  });

  const hasAnySessions = workDays.some(d=>sessionsByDay[d].length>0);

  return(
    <div>
      {/* Week nav */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <button className="btn ghost" style={{padding:"7px 12px",fontSize:13}} onClick={()=>{
          const d=new Date(calWeek+"T12:00:00"); d.setDate(d.getDate()-7);
          setCalWeek(d.toISOString().split("T")[0]);
        }}>‹ Ant.</button>
        <span style={{fontSize:13,fontWeight:600,color:"#64748b"}}>
          {new Date(workDays[0]+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"})} – {new Date(workDays[4]+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"})}
        </span>
        <button className="btn ghost" style={{padding:"7px 12px",fontSize:13}} onClick={()=>{
          const d=new Date(calWeek+"T12:00:00"); d.setDate(d.getDate()+7);
          setCalWeek(d.toISOString().split("T")[0]);
        }}>Sig. ›</button>
      </div>

      {!hasAnySessions
        ? <div className="card" style={{textAlign:"center",padding:34}}>
            <div style={{fontSize:26,marginBottom:8}}>📅</div>
            <div style={{color:"#64748b",fontSize:13}}>Sin clases esta semana</div>
          </div>
        : workDays.map(day=>{
            const daySess = sessionsByDay[day];
            const isToday = day===TODAY;
            if(daySess.length===0) return(
              <div key={day} style={{marginBottom:10,opacity:0.4}}>
                <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",marginBottom:4,textTransform:"capitalize",paddingLeft:4}}>
                  {new Date(day+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short"})}
                </div>
                <div style={{fontSize:11,color:"#cbd5e1",padding:"8px 12px",background:"#f1f4fa",borderRadius:8}}>Sin clases</div>
              </div>
            );
            return(
              <div key={day} style={{marginBottom:14}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <div style={{fontSize:11,fontWeight:700,color:isToday?"#0284c7":"#64748b",textTransform:"capitalize"}}>
                    {new Date(day+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short"})}
                  </div>
                  {isToday&&<span style={{fontSize:10,background:"#dcebfb",color:"#0284c7",padding:"2px 7px",borderRadius:10,fontWeight:700}}>Hoy</span>}
                  <span style={{fontSize:10,color:"#94a3b8"}}>{daySess.length} clase{daySess.length>1?"s":""}</span>
                </div>
                {daySess.map(s=>{
                  const c=allClients.find(x=>x.id===s.client_id);
                  if(!c) return null;
                  const isMe=c.id===client.id;
                  // Privacidad: el cliente solo ve su propia clase; las demás son plazas ocupadas anónimas.
                  return(
                    <div key={s.id} style={{
                      display:"flex",alignItems:"center",gap:10,
                      padding:"10px 12px",borderRadius:12,marginBottom:6,
                      background:isMe?"#e3eefb":"#f1f4fa",
                      border:`1px solid ${isMe?"#bcd3ee":"#dbe2ec"}`,
                    }}>
                      <div className="mono" style={{fontSize:13,fontWeight:700,color:isMe?"#0284c7":"#64748b",minWidth:46,flexShrink:0}}>{s.time}</div>
                      {isMe
                        ?(c.avatar_url
                            ?<img src={c.avatar_url} style={{width:34,height:34,borderRadius:"50%",objectFit:"cover",border:`2px solid ${c.color}80`,flexShrink:0}}/>
                            :<div className="ring" style={{width:34,height:34,background:c.color+"30",color:c.color,fontSize:11,border:`1.5px solid ${c.color}60`,flexShrink:0}}>{ini(c.name)}</div>)
                        :<div style={{width:34,height:34,borderRadius:"50%",background:"#cbd5e1",border:"1.5px solid #cbd5e1",display:"flex",alignItems:"center",justifyContent:"center",color:"#64748b",fontSize:16,fontWeight:700,flexShrink:0}}>•</div>
                      }
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:isMe?700:500,color:isMe?"#0f172a":"#64748b",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                          {isMe?"Yo (tú)":"Plaza ocupada"}
                        </div>
                        {isMe&&<div style={{fontSize:11,color:"#64748b"}}>{s.type}</div>}
                      </div>
                      {isMe&&<div style={{flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                        <span style={{fontSize:14}}>✅</span>
                        <span style={{fontSize:9,color:"#16a34a",fontWeight:700}}>Apuntado</span>
                      </div>}
                    </div>
                  );
                })}
              </div>
            );
          })
      }
    </div>
  );
}

// ── FORUM TAB ──────────────────────────────────────────────────────────────
function ForumTab({client, forum, allClients, loadAll, notify}) {
  const [text, setText] = React.useState("");
  const [imgFile, setImgFile] = React.useState(null);
  const [imgPreview, setImgPreview] = React.useState(null);
  const [posting, setPosting] = React.useState(false);

  const handleImg = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    setImgFile(file);
    const reader = new FileReader();
    reader.onload = ev => setImgPreview(ev.target.result);
    reader.readAsDataURL(file);
  };

  const submitPost = async() => {
    if(!text.trim() && !imgFile) return notify("Escribe algo primero","err");
    setPosting(true);
    let image_url = null;
    if(imgFile) {
      const ext = imgFile.name.split(".").pop();
      const path = `${client.id}_${Date.now()}.${ext}`;
      const {error:upErr} = await sb.storage.from("forum").upload(path, imgFile, {upsert:true});
      if(!upErr) {
        const {data} = sb.storage.from("forum").getPublicUrl(path);
        image_url = data.publicUrl;
      }
    }
    await sb.from("forum_posts").insert({
      client_id: client.id,
      client_name: client.name,
      content: text.trim(),
      image_url,
    });
    setText(""); setImgFile(null); setImgPreview(null);
    await loadAll();
    setPosting(false);
    notify("Publicado ✓");
  };

  const toggleLike = async(post) => {
    const liked = (post.liked_by||[]).includes(client.id);
    const newLikedBy = liked
      ? post.liked_by.filter(id=>id!==client.id)
      : [...(post.liked_by||[]), client.id];
    await sb.from("forum_posts").update({
      likes: newLikedBy.length,
      liked_by: newLikedBy,
    }).eq("id", post.id);
    await loadAll();
  };

  return(
    <div>
      {/* Post composer */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:10}}>
          {client.avatar_url
            ? <img src={client.avatar_url} style={{width:36,height:36,borderRadius:"50%",objectFit:"cover",border:`2px solid ${client.color}`,flexShrink:0}}/>
            : <div className="ring" style={{width:36,height:36,background:client.color+"20",color:client.color,fontSize:12,border:`1.5px solid ${client.color}40`,flexShrink:0}}>{ini(client.name)}</div>
          }
          <textarea className="inp" rows={3} style={{resize:"none",fontSize:13}} 
            placeholder="Comparte tu progreso, pregunta algo, motiva al equipo... 💪"
            value={text} onChange={e=>setText(e.target.value)}/>
        </div>
        {imgPreview&&(
          <div style={{position:"relative",marginBottom:10}}>
            <img src={imgPreview} style={{width:"100%",borderRadius:10,maxHeight:200,objectFit:"cover"}}/>
            <button onClick={()=>{setImgFile(null);setImgPreview(null);}} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,.7)",border:"none",borderRadius:"50%",width:24,height:24,cursor:"pointer",color:"#fff",fontSize:12}}>✕</button>
          </div>
        )}
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input type="file" accept="image/*" id="forumImg" style={{display:"none"}} onChange={handleImg}/>
          <label htmlFor="forumImg" className="btn ghost" style={{fontSize:12,padding:"7px 12px",cursor:"pointer"}}>📷 Foto</label>
          <button className="btn sky" style={{flex:1,padding:"9px"}} onClick={submitPost} disabled={posting}>
            {posting?"Publicando...":"Publicar 🚀"}
          </button>
        </div>
      </div>

      {/* Posts */}
      {forum.length===0
        ? <div className="card" style={{textAlign:"center",padding:34}}>
            <div style={{fontSize:28,marginBottom:8}}>💬</div>
            <div style={{color:"#64748b",fontSize:13}}>Sé el primero en publicar algo 💪</div>
          </div>
        : forum.map(post=>{
            const c=allClients.find(x=>x.id===post.client_id);
            const liked=(post.liked_by||[]).includes(client.id);
            const isMe=post.client_id===client.id;
            return(
              <div key={post.id} className="card" style={{marginBottom:10}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                  {c?.avatar_url
                    ? <img src={c.avatar_url} style={{width:38,height:38,borderRadius:"50%",objectFit:"cover",border:`2px solid ${c.color||"#0284c7"}`}}/>
                    : <div className="ring" style={{width:38,height:38,background:(c?.color||"#0284c7")+"20",color:c?.color||"#0284c7",fontSize:12,border:`1.5px solid ${c?.color||"#0284c7"}35`}}>{ini(post.client_name)}</div>
                  }
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13}}>{post.client_name} {isMe&&<span style={{fontSize:10,color:"#0284c7"}}>· tú</span>}</div>
                    <div style={{fontSize:11,color:"#94a3b8"}}>{new Date(post.created_at).toLocaleDateString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
                  </div>
                </div>
                {post.content&&<p style={{fontSize:13,color:"#64748b",lineHeight:1.55,marginBottom:post.image_url?10:8}}>{post.content}</p>}
                {post.image_url&&<img src={post.image_url} style={{width:"100%",borderRadius:10,maxHeight:260,objectFit:"cover",marginBottom:8}}/>}
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <button onClick={()=>toggleLike(post)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:liked?"#dc2626":"#64748b",display:"flex",alignItems:"center",gap:4,padding:"4px 8px",borderRadius:8,transition:"all .15s"}}>
                    {liked?"❤️":"🤍"} <span style={{fontWeight:600}}>{post.likes||0}</span>
                  </button>
                </div>
              </div>
            );
          })
      }
    </div>
  );
}

              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>

// ── PLANS ADMIN ────────────────────────────────────────────────────────────
function PlansAdmin({plans, exercises, clients, clientPlans, loadAll, notify}) {
  const [tab, setTab] = React.useState("plans");
  const [showNewPlan, setShowNewPlan] = React.useState(false);
  const [editPlan, setEditPlan] = React.useState(null);
  const [np, setNp] = React.useState({name:"",description:"",category:"Fuerza",duration_weeks:4});
  const [showAssign, setShowAssign] = React.useState(null);
  const [assignClient, setAssignClient] = React.useState("");

  const createPlan = async() => {
    if(!np.name) return notify("Escribe el nombre del plan","err");
    const {data,error} = await sb.from("training_plans").insert(np).select().single();
    if(error) return notify("Error: "+error.message,"err");
    setShowNewPlan(false);
    setNp({name:"",description:"",category:"Fuerza",duration_weeks:4});
    await loadAll();
    notify("Plan creado ✓");
    setEditPlan(data);
  };

  const deletePlan = async(id) => {
    await sb.from("training_plans").delete().eq("id",id);
    await loadAll();
    notify("Plan eliminado");
  };

  const assignPlan = async(planId) => {
    if(!assignClient) return notify("Selecciona un cliente","err");
    await sb.from("client_plans").insert({client_id:assignClient,plan_id:planId,start_date:TODAY,active:true});
    setShowAssign(null); setAssignClient("");
    await loadAll();
    notify("Plan asignado ✓");
  };

  const addDay = async(planId) => {
    const dayNum = (editPlan?.plan_days?.length||0)+1;
    await sb.from("plan_days").insert({plan_id:planId,day_number:dayNum,day_name:`Día ${dayNum}`});
    await loadAll();
  };

  const addExToDay = async(dayId, exId, exName) => {
    const day = editPlan?.plan_days?.find(d=>d.id===dayId);
    const order = (day?.plan_exercises?.length||0);
    await sb.from("plan_exercises").insert({plan_day_id:dayId,exercise_id:exId,exercise_name:exName,sets:3,reps:"10",rest_seconds:60,order_index:order});
    await loadAll();
  };

  const removeEx = async(exId) => {
    await sb.from("plan_exercises").delete().eq("id",exId);
    await loadAll();
  };

  // Refresh editPlan from updated plans
  React.useEffect(()=>{
    if(editPlan) {
      const updated = plans.find(p=>p.id===editPlan.id);
      if(updated) setEditPlan(updated);
    }
  },[plans]);

  return(
    <div>
      <div className="seg" style={{marginBottom:14}}>
        {[["plans","📋 Planes"],["assign","👥 Asignaciones"]].map(([id,label])=>(
          <button key={id} className={"sb"+(tab===id?" on":"")} onClick={()=>setTab(id)}>{label}</button>
