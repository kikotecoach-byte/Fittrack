// ── MULTI SESSION REQUEST (selector visual de huecos) ─────────────────────
function MultiSessionRequest({client, allSessions, allClients, blocked, config, loadAll, notify, saving, setSaving}) {
  const [date,setDate] = React.useState(TODAY);
  const [type,setType] = React.useState("Fuerza");
  const [picked,setPicked] = React.useState([]); // horas seleccionadas para esa fecha

  // Franjas y capacidad definidas por el coach.
  const workSlots=[...genSlots(config.morningFrom,config.morningTo),...genSlots(config.afternoonFrom,config.afternoonTo)];
  const capOf=(t)=>(config.capacity&&config.capacity[t]!=null)?config.capacity[t]:config.defaultCapacity;
  const dayBlocked=blocked.some(b=>b.date===date&&b.time==="ALL");
  const slotBlocked=(t)=>dayBlocked||blocked.some(b=>b.date===date&&b.time===t);
  const takenAt=(t)=>allSessions.filter(s=>s.date===date&&s.time===t).length; // reservadas (pendientes + confirmadas)
  const freeAt=(t)=>Math.max(0,capOf(t)-takenAt(t));
  const nowHM=new Date().toTimeString().slice(0,5);
  const isPast=(t)=>date<TODAY||(date===TODAY&&t<=nowHM);
  const available=(t)=>!slotBlocked(t)&&freeAt(t)>0&&!isPast(t);

  // Al cambiar de fecha, limpiamos la selección (los huecos cambian).
  const changeDate=(d)=>{ setDate(d); setPicked([]); };
  const toggle=(t)=>{
    if(!picked.includes(t)&&!available(t)) return;
    if(!picked.includes(t)&&picked.length>=client.sessions_left) return notify(`Solo tienes ${client.sessions_left} sesiones`,"err");
    setPicked(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);
  };

  const submit=async()=>{
    if(client.sessions_left===0) return notify("Sin sesiones. Contacta a tu trainer.","err");
    if(picked.length===0) return notify("Elige al menos una hora libre","err");
    // Revalida por si alguna se llenó justo antes de enviar.
    const lleno=picked.find(t=>freeAt(t)<=0||slotBlocked(t)||isPast(t));
    if(lleno) return notify(`La ${lleno} ya no está disponible`,"err");
    setSaving(true);
    const inserts=picked.map(t=>({client_id:client.id,date,time:t,type,status:"pending",requested:true}));
    const {error}=await sb.from("sessions").insert(inserts);
    if(error){ notify("Error al enviar","err"); setSaving(false); return; }
    await loadAll(); setSaving(false); setPicked([]);
    notify(`✓ ${inserts.length} sesión${inserts.length>1?"es":""} solicitada${inserts.length>1?"s":""}! Tu trainer la${inserts.length>1?"s":""} confirmará 🎯`);
  };

  return(
    <div className="card">
      <div style={{background:"#080f1e",borderRadius:10,padding:"11px 13px",border:"1px solid #1e3a5a",fontSize:13,color:"#475569",marginBottom:16}}>
        💡 Elige un día y toca las horas libres que quieras reservar.
        <div style={{marginTop:4,fontSize:12,color:"#334155"}}>Sesiones en tu bono: <span style={{color:"#38bdf8",fontWeight:700}}>{client.sessions_left}</span></div>
      </div>

      <div style={{marginBottom:14}}><span className="lbl">DÍA</span>
        <input type="date" className="inp" value={date} min={TODAY} onChange={e=>changeDate(e.target.value)}/>
      </div>
      <div style={{marginBottom:16}}><span className="lbl">TIPO DE SESIÓN</span>
        <select className="inp" style={{appearance:"none"}} value={type} onChange={e=>setType(e.target.value)}>
          {SESSION_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
      </div>

      <span className="lbl">HORAS DEL DÍA</span>
      {dayBlocked
        ?<div style={{background:"#0d0505",border:"1px solid #3f1a1a",borderRadius:10,padding:14,textAlign:"center",fontSize:13,color:"#f87171"}}>🚫 Día no disponible</div>
        :workSlots.length===0
          ?<div style={{fontSize:12,color:"#334155"}}>No hay horario configurado.</div>
          :<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {workSlots.map(t=>{
              const sel=picked.includes(t), free=freeAt(t), ok=available(t), cap=capOf(t);
              const enrolled=allSessions.filter(s=>s.date===date&&s.time===t)
                .map(s=>({...s,c:allClients.find(x=>x.id===s.client_id)})).filter(s=>s.c);
              const estado=isPast(t)?"Pasada":slotBlocked(t)?"🚫 Bloqueada":free<=0?"Completa":`${free} libre${free>1?"s":""}`;
              const estCol=sel?"#4ade80":(free<=0||slotBlocked(t)||isPast(t))?"#f87171":"#4ade80";
              return(
                <div key={t} onClick={()=>toggle(t)}
                  style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:12,cursor:ok||sel?"pointer":"default",
                    background:sel?"#0c2a1a":ok?"#050e05":"#0a0d12",border:`1px solid ${sel?"#16a34a":ok?"#14532d":"#161c28"}`,opacity:(!ok&&!sel)?0.55:1}}>
                  {/* Hora */}
                  <div style={{flexShrink:0,textAlign:"center",minWidth:44}}>
                    <div className="mono" style={{fontSize:15,fontWeight:700,color:sel?"#4ade80":ok?"#e8edf5":"#64748b"}}>{t}</div>
                    <div style={{fontSize:9,fontWeight:700,marginTop:1,color:estCol}}>{sel?"✓ elegida":estado}</div>
                  </div>
                  {/* Personas apuntadas + huecos libres */}
                  <div style={{flex:1,display:"flex",flexWrap:"wrap",gap:6,alignItems:"center"}}>
                    {enrolled.map(s=>{
                      const yo=s.c.id===client.id;
                      return(
                        <div key={s.id} style={{display:"flex",alignItems:"center",gap:6,background:s.c.color+"18",border:`1px solid ${s.c.color}40`,borderRadius:20,padding:"3px 9px 3px 3px"}}>
                          {s.c.avatar_url
                            ?<img src={s.c.avatar_url} style={{width:24,height:24,borderRadius:"50%",objectFit:"cover"}}/>
                            :<div className="ring" style={{width:24,height:24,background:s.c.color+"30",color:s.c.color,fontSize:9}}>{ini(s.c.name)}</div>}
                          <span style={{fontSize:12,fontWeight:700,color:s.c.color}}>{yo?"Tú":s.c.name.split(" ")[0]}</span>
                        </div>
                      );
                    })}
                    {/* Huecos libres como plazas vacías */}
                    {!slotBlocked(t)&&!isPast(t)&&Array.from({length:free}).map((_,k)=>(
                      <div key={"f"+k} style={{width:26,height:26,borderRadius:"50%",border:"1.5px dashed #1e3a2a",display:"flex",alignItems:"center",justifyContent:"center",color:"#1e3a2a",fontSize:13}}>+</div>
                    ))}
                    {enrolled.length===0&&slotBlocked(t)&&<span style={{fontSize:11,color:"#4a1515"}}>No disponible</span>}
                  </div>
                  <div style={{flexShrink:0,fontSize:10,fontWeight:700,color:"#334155"}} className="mono">{enrolled.length}/{cap}</div>
                </div>
              );
            })}
          </div>
      }

      <button className="btn sky" style={{width:"100%",padding:12,fontSize:13,marginTop:16,opacity:picked.length?1:0.5}} onClick={submit} disabled={saving||picked.length===0}>
        {saving?"Enviando...":picked.length?`Reservar ${picked.length} sesión${picked.length>1?"es":""} 🚀`:"Elige una hora libre"}
      </button>
    </div>
  );
}

// ── CLIENT CALENDAR ───────────────────────────────────────────────────────
function ClientCalendar({client, allSessions, allClients, blocked}) {
  const [calWeek, setCalWeek] = React.useState(TODAY);
  const weekDays = getWeekDays(calWeek);
  const workDays = weekDays.slice(0,5); // Mon-Fri

  // Group sessions by day
  const sessionsByDay = {};
  workDays.forEach(day => {
    sessionsByDay[day] = allSessions
      .filter(s=>s.date===day&&!s.requested)
      .sort((a,b)=>a.time.localeCompare(b.time));
  });

  const hasAnySessions = workDays.some(d=>sessionsByDay[d].length>0);

  return(
    <div>
      {/* Week nav */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <button className="btn ghost" style={{padding:"7px 12px",fontSize:13}} onClick={()=>{
          const d=new Date(calWeek+"T12:00:00"); d.setDate(d.getDate()-7);
          setCalWeek(d.toISOString().split("T")[0]);
        }}>‹ Ant.</button>
        <span style={{fontSize:13,fontWeight:600,color:"#94a3b8"}}>
          {new Date(workDays[0]+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"})} – {new Date(workDays[4]+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"})}
        </span>
        <button className="btn ghost" style={{padding:"7px 12px",fontSize:13}} onClick={()=>{
          const d=new Date(calWeek+"T12:00:00"); d.setDate(d.getDate()+7);
          setCalWeek(d.toISOString().split("T")[0]);
        }}>Sig. ›</button>
      </div>

      {!hasAnySessions
        ? <div className="card" style={{textAlign:"center",padding:34}}>
            <div style={{fontSize:26,marginBottom:8}}>📅</div>
            <div style={{color:"#475569",fontSize:13}}>Sin clases esta semana</div>
          </div>
        : workDays.map(day=>{
            const daySess = sessionsByDay[day];
            const isToday = day===TODAY;
            if(daySess.length===0) return(
              <div key={day} style={{marginBottom:10,opacity:0.4}}>
                <div style={{fontSize:11,fontWeight:700,color:"#334155",marginBottom:4,textTransform:"capitalize",paddingLeft:4}}>
                  {new Date(day+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short"})}
                </div>
                <div style={{fontSize:11,color:"#1e293b",padding:"8px 12px",background:"#080d14",borderRadius:8}}>Sin clases</div>
              </div>
            );
            return(
              <div key={day} style={{marginBottom:14}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <div style={{fontSize:11,fontWeight:700,color:isToday?"#38bdf8":"#475569",textTransform:"capitalize"}}>
                    {new Date(day+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short"})}
                  </div>
                  {isToday&&<span style={{fontSize:10,background:"#0c2040",color:"#38bdf8",padding:"2px 7px",borderRadius:10,fontWeight:700}}>Hoy</span>}
                  <span style={{fontSize:10,color:"#334155"}}>{daySess.length} clase{daySess.length>1?"s":""}</span>
                </div>
                {daySess.map(s=>{
                  const c=allClients.find(x=>x.id===s.client_id);
                  if(!c) return null;
                  const isMe=c.id===client.id;
                  return(
                    <div key={s.id} style={{
                      display:"flex",alignItems:"center",gap:10,
                      padding:"10px 12px",borderRadius:12,marginBottom:6,
                      background:isMe?"#0a1628":"#0a0d14",
                      border:`1px solid ${isMe?"#1e3a5a":"#1a2235"}`,
                    }}>
                      <div className="mono" style={{fontSize:13,fontWeight:700,color:isMe?"#38bdf8":"#475569",minWidth:46,flexShrink:0}}>{s.time}</div>
                      {c.avatar_url
                        ?<img src={c.avatar_url} style={{width:34,height:34,borderRadius:"50%",objectFit:"cover",border:`2px solid ${isMe?c.color+"80":c.color+"40"}`,flexShrink:0}}/>
                        :<div className="ring" style={{width:34,height:34,background:c.color+(isMe?"30":"18"),color:c.color,fontSize:11,border:`1.5px solid ${c.color}${isMe?"60":"30"}`,flexShrink:0}}>{ini(c.name)}</div>
                      }
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:isMe?700:500,color:isMe?"#e2e8f0":"#94a3b8",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                          {isMe?"Yo (tú)":c.name}
                        </div>
                        <div style={{fontSize:11,color:"#475569"}}>{s.type}</div>
                      </div>
                      {isMe&&<div style={{flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                        <span style={{fontSize:14}}>✅</span>
                        <span style={{fontSize:9,color:"#4ade80",fontWeight:700}}>Apuntado</span>
                      </div>}
                    </div>
                  );
                })}
              </div>
            );
          })
      }
    </div>
  );
}

// ── FORUM TAB ──────────────────────────────────────────────────────────────
function ForumTab({client, forum, allClients, loadAll, notify}) {
  const [text, setText] = React.useState("");
  const [imgFile, setImgFile] = React.useState(null);
  const [imgPreview, setImgPreview] = React.useState(null);
  const [posting, setPosting] = React.useState(false);

  const handleImg = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    setImgFile(file);
    const reader = new FileReader();
    reader.onload = ev => setImgPreview(ev.target.result);
    reader.readAsDataURL(file);
  };

  const submitPost = async() => {
    if(!text.trim() && !imgFile) return notify("Escribe algo primero","err");
    setPosting(true);
    let image_url = null;
    if(imgFile) {
      const ext = imgFile.name.split(".").pop();
      const path = `${client.id}_${Date.now()}.${ext}`;
      const {error:upErr} = await sb.storage.from("forum").upload(path, imgFile, {upsert:true});
      if(!upErr) {
        const {data} = sb.storage.from("forum").getPublicUrl(path);
        image_url = data.publicUrl;
      }
    }
    await sb.from("forum_posts").insert({
      client_id: client.id,
      client_name: client.name,
      content: text.trim(),
      image_url,
    });
    setText(""); setImgFile(null); setImgPreview(null);
    await loadAll();
    setPosting(false);
    notify("Publicado ✓");
  };

  const toggleLike = async(post) => {
    const liked = (post.liked_by||[]).includes(client.id);
    const newLikedBy = liked
      ? post.liked_by.filter(id=>id!==client.id)
      : [...(post.liked_by||[]), client.id];
    await sb.from("forum_posts").update({
      likes: newLikedBy.length,
      liked_by: newLikedBy,
    }).eq("id", post.id);
    await loadAll();
  };

  return(
    <div>
      {/* Post composer */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:10}}>
          {client.avatar_url
            ? <img src={client.avatar_url} style={{width:36,height:36,borderRadius:"50%",objectFit:"cover",border:`2px solid ${client.color}`,flexShrink:0}}/>
            : <div className="ring" style={{width:36,height:36,background:client.color+"20",color:client.color,fontSize:12,border:`1.5px solid ${client.color}40`,flexShrink:0}}>{ini(client.name)}</div>
          }
          <textarea className="inp" rows={3} style={{resize:"none",fontSize:13}} 
            placeholder="Comparte tu progreso, pregunta algo, motiva al equipo... 💪"
            value={text} onChange={e=>setText(e.target.value)}/>
        </div>
        {imgPreview&&(
          <div style={{position:"relative",marginBottom:10}}>
            <img src={imgPreview} style={{width:"100%",borderRadius:10,maxHeight:200,objectFit:"cover"}}/>
            <button onClick={()=>{setImgFile(null);setImgPreview(null);}} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,.7)",border:"none",borderRadius:"50%",width:24,height:24,cursor:"pointer",color:"#fff",fontSize:12}}>✕</button>
          </div>
        )}
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input type="file" accept="image/*" id="forumImg" style={{display:"none"}} onChange={handleImg}/>
          <label htmlFor="forumImg" className="btn ghost" style={{fontSize:12,padding:"7px 12px",cursor:"pointer"}}>📷 Foto</label>
          <button className="btn sky" style={{flex:1,padding:"9px"}} onClick={submitPost} disabled={posting}>
            {posting?"Publicando...":"Publicar 🚀"}
          </button>
        </div>
      </div>

      {/* Posts */}
      {forum.length===0
        ? <div className="card" style={{textAlign:"center",padding:34}}>
            <div style={{fontSize:28,marginBottom:8}}>💬</div>
            <div style={{color:"#475569",fontSize:13}}>Sé el primero en publicar algo 💪</div>
          </div>
        : forum.map(post=>{
            const c=allClients.find(x=>x.id===post.client_id);
            const liked=(post.liked_by||[]).includes(client.id);
            const isMe=post.client_id===client.id;
            return(
              <div key={post.id} className="card" style={{marginBottom:10}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                  {c?.avatar_url
                    ? <img src={c.avatar_url} style={{width:38,height:38,borderRadius:"50%",objectFit:"cover",border:`2px solid ${c.color||"#38bdf8"}`}}/>
                    : <div className="ring" style={{width:38,height:38,background:(c?.color||"#38bdf8")+"20",color:c?.color||"#38bdf8",fontSize:12,border:`1.5px solid ${c?.color||"#38bdf8"}35`}}>{ini(post.client_name)}</div>
                  }
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13}}>{post.client_name} {isMe&&<span style={{fontSize:10,color:"#38bdf8"}}>· tú</span>}</div>
                    <div style={{fontSize:11,color:"#334155"}}>{new Date(post.created_at).toLocaleDateString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
                  </div>
                </div>
                {post.content&&<p style={{fontSize:13,color:"#94a3b8",lineHeight:1.55,marginBottom:post.image_url?10:8}}>{post.content}</p>}
                {post.image_url&&<img src={post.image_url} style={{width:"100%",borderRadius:10,maxHeight:260,objectFit:"cover",marginBottom:8}}/>}
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <button onClick={()=>toggleLike(post)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:liked?"#f87171":"#475569",display:"flex",alignItems:"center",gap:4,padding:"4px 8px",borderRadius:8,transition:"all .15s"}}>
                    {liked?"❤️":"🤍"} <span style={{fontWeight:600}}>{post.likes||0}</span>
                  </button>
                </div>
              </div>
            );
          })
      }
    </div>
  );
}

// ── EXERCISES ADMIN ────────────────────────────────────────────────────────

// ── PLANS ADMIN ────────────────────────────────────────────────────────────
function PlansAdmin({plans, exercises, clients, clientPlans, loadAll, notify}) {
  const [tab, setTab] = React.useState("plans");
  const [showNewPlan, setShowNewPlan] = React.useState(false);
  const [editPlan, setEditPlan] = React.useState(null);
  const [np, setNp] = React.useState({name:"",description:"",category:"Fuerza",duration_weeks:4});
  const [showAssign, setShowAssign] = React.useState(null);
  const [assignClient, setAssignClient] = React.useState("");

  const createPlan = async() => {
    if(!np.name) return notify("Escribe el nombre del plan","err");
    const {data,error} = await sb.from("training_plans").insert(np).select().single();
    if(error) return notify("Error: "+error.message,"err");
    setShowNewPlan(false);
    setNp({name:"",description:"",category:"Fuerza",duration_weeks:4});
    await loadAll();
    notify("Plan creado ✓");
    setEditPlan(data);
  };

  const deletePlan = async(id) => {
    await sb.from("training_plans").delete().eq("id",id);
    await loadAll();
    notify("Plan eliminado");
  };

  const assignPlan = async(planId) => {
    if(!assignClient) return notify("Selecciona un cliente","err");
    await sb.from("client_plans").insert({client_id:assignClient,plan_id:planId,start_date:TODAY,active:true});
    setShowAssign(null); setAssignClient("");
    await loadAll();
    notify("Plan asignado ✓");
  };

  const addDay = async(planId) => {
    const dayNum = (editPlan?.plan_days?.length||0)+1;
    await sb.from("plan_days").insert({plan_id:planId,day_number:dayNum,day_name:`Día ${dayNum}`});
    await loadAll();
  };

  const addExToDay = async(dayId, exId, exName) => {
    const day = editPlan?.plan_days?.find(d=>d.id===dayId);
    const order = (day?.plan_exercises?.length||0);
    await sb.from("plan_exercises").insert({plan_day_id:dayId,exercise_id:exId,exercise_name:exName,sets:3,reps:"10",rest_seconds:60,order_index:order});
    await loadAll();
  };

  const removeEx = async(exId) => {
    await sb.from("plan_exercises").delete().eq("id",exId);
    await loadAll();
  };

  // Refresh editPlan from updated plans
  React.useEffect(()=>{
    if(editPlan) {
      const updated = plans.find(p=>p.id===editPlan.id);
      if(updated) setEditPlan(updated);
    }
  },[plans]);

  return(
    <div>
      <div className="seg" style={{marginBottom:14}}>
        {[["plans","📋 Planes"],["assign","👥 Asignaciones"]].map(([id,label])=>(
          <button key={id} className={"sb"+(tab===id?" on":"")} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {tab==="plans"&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <h2 style={{fontSize:15,fontWeight:700}}>Planes de entrenamiento</h2>
            <button className="btn sky" style={{fontSize:12,padding:"8px 13px"}} onClick={()=>setShowNewPlan(true)}>+ Nuevo plan</button>
          </div>

          {editPlan?(
            <div>
              <button className="btn ghost" style={{fontSize:12,padding:"7px 12px",marginBottom:14}} onClick={()=>setEditPlan(null)}>← Volver a planes</button>
              <div className="card" style={{marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:16,marginBottom:4}}>{editPlan.name}</div>
                <div style={{fontSize:12,color:"#475569"}}>{editPlan.category} · {editPlan.duration_weeks} semanas</div>
              </div>
              {(editPlan.plan_days||[]).sort((a,b)=>a.day_number-b.day_number).map(day=>(
                <div key={day.id} className="card" style={{marginBottom:10}}>
                  <div style={{fontWeight:700,fontSize:13,color:"#38bdf8",marginBottom:10}}>{day.day_name||`Día ${day.day_number}`}</div>
                  {(day.plan_exercises||[]).sort((a,b)=>a.order_index-b.order_index).map(pe=>(
                    <div key={pe.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #0d1520"}}>
                      <div>
                        <div style={{fontSize:13,fontWeight:600}}>{pe.exercise_name}</div>
                        <div style={{fontSize:11,color:"#475569"}}>{pe.sets} series × {pe.reps} · {pe.rest_seconds}s descanso</div>
                      </div>
                      <button className="btn danger" style={{fontSize:10,padding:"3px 7px"}} onClick={()=>removeEx(pe.id)}>✕</button>
                    </div>
                  ))}
                  <div style={{marginTop:10}}>
                    <select className="inp" style={{appearance:"none",fontSize:12}} onChange={e=>{
                      const ex = exercises.find(x=>x.id===e.target.value);
                      if(ex) addExToDay(day.id,ex.id,ex.name);
                      e.target.value="";
                    }}>
                      <option value="">+ Añadir ejercicio...</option>
                      {exercises.map(e=><option key={e.id} value={e.id}>{e.name} ({e.category})</option>)}
                    </select>
                  </div>
                </div>
              ))}
              <button className="btn ghost" style={{width:"100%",padding:10,fontSize:12,marginTop:4}} onClick={()=>addDay(editPlan.id)}>+ Añadir día</button>
            </div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {plans.map(plan=>(
                <div key={plan.id} className="card">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                    <div>
                      <div style={{fontWeight:700,fontSize:14}}>{plan.name}</div>
                      <div style={{fontSize:11,color:"#475569",marginTop:2}}>{plan.category} · {plan.duration_weeks} sem · {(plan.plan_days||[]).length} días</div>
                    </div>
                    <div style={{display:"flex",gap:6}}>
                      <button className="btn sky" style={{fontSize:11,padding:"5px 9px"}} onClick={()=>setEditPlan(plan)}>✏️</button>
                      <button className="btn grn" style={{fontSize:11,padding:"5px 9px"}} onClick={()=>setShowAssign(plan.id)}>👥</button>
                      <button className="btn danger" style={{fontSize:10,padding:"5px 8px"}} onClick={()=>deletePlan(plan.id)}>🗑</button>
                    </div>
                  </div>
                  {plan.description&&<div style={{fontSize:12,color:"#334155"}}>{plan.description}</div>}
                </div>
              ))}
              {plans.length===0&&<div className="card" style={{textAlign:"center",padding:32,color:"#334155"}}>Sin planes creados aún</div>}
            </div>
          )}
        </div>
      )}

      {tab==="assign"&&(
        <div>
          <h2 style={{fontSize:15,fontWeight:700,marginBottom:14}}>Planes asignados</h2>
          {clients.map(c=>{
            const cp = clientPlans.filter(x=>x.client_id===c.id&&x.active);
            return(
              <div key={c.id} className="card" style={{marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:cp.length>0?10:0}}>
                  <div className="ring" style={{width:34,height:34,background:c.color+"20",color:c.color,fontSize:11}}>{ini(c.name)}</div>
                  <div style={{flex:1,fontWeight:600,fontSize:13}}>{c.name}</div>
                  <button className="btn sky" style={{fontSize:11,padding:"5px 9px"}} onClick={()=>{setShowAssign("new");setAssignClient(c.id);}}>+ Plan</button>
                </div>
                {cp.map(a=>{
                  const plan=plans.find(p=>p.id===a.plan_id);
                  return plan?(
                    <div key={a.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderTop:"1px solid #0d1520"}}>
                      <div>
                        <div style={{fontSize:12,fontWeight:600}}>{plan.name}</div>
                        <div style={{fontSize:10,color:"#475569"}}>Desde {a.start_date}</div>
                      </div>
                      <button className="btn danger" style={{fontSize:10,padding:"3px 7px"}} onClick={async()=>{
                        await sb.from("client_plans").delete().eq("id",a.id);
                        await loadAll();
                        notify("Plan desasignado");
                      }}>✕</button>
                    </div>
                  ):null;
                })}
              </div>
            );
          })}
        </div>
      )}

      {showNewPlan&&(
        <div className="ovl" onClick={()=>setShowNewPlan(false)}>
          <div className="mdl fade" onClick={e=>e.stopPropagation()}>
            <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:18}}>Nuevo plan</h2>
            <div style={{display:"flex",flexDirection:"column",gap:13}}>
              <div><span className="lbl">NOMBRE *</span><input className="inp" placeholder="Ej. Plan Fuerza 4 semanas" value={np.name} onChange={e=>setNp(v=>({...v,name:e.target.value}))}/></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div><span className="lbl">CATEGORÍA</span>
                  <select className="inp" style={{appearance:"none"}} value={np.category} onChange={e=>setNp(v=>({...v,category:e.target.value}))}>
                    {["Fuerza","Cardio","HIIT","Funcional","Movilidad","Mixto"].map(c=><option key={c}>{c}</option>)}
                  </select>
                </div>
                <div><span className="lbl">SEMANAS</span><input type="number" className="inp" value={np.duration_weeks} onChange={e=>setNp(v=>({...v,duration_weeks:parseInt(e.target.value)}))}/></div>
              </div>
              <div><span className="lbl">DESCRIPCIÓN</span><textarea className="inp" rows={2} style={{resize:"none"}} value={np.description} onChange={e=>setNp(v=>({...v,description:e.target.value}))}/></div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn sky" style={{flex:1,padding:11}} onClick={createPlan}>Crear plan</button>
                <button className="btn ghost" style={{flex:1,padding:11}} onClick={()=>setShowNewPlan(false)}>Cancelar</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {showAssign&&showAssign!=="new"&&(
        <div className="ovl" onClick={()=>setShowAssign(null)}>
          <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:360}}>
            <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:18}}>Asignar plan</h2>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div><span className="lbl">CLIENTE</span>
                <select className="inp" style={{appearance:"none"}} value={assignClient} onChange={e=>setAssignClient(e.target.value)}>
                  <option value="">Seleccionar...</option>
                  {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn sky" style={{flex:1,padding:11}} onClick={()=>assignPlan(showAssign)}>Asignar</button>
                <button className="btn ghost" style={{flex:1,padding:11}} onClick={()=>setShowAssign(null)}>Cancelar</button>
              </div>
            </div>
          </div>
        </div>
      )}
      {showAssign==="new"&&assignClient&&(
        <div className="ovl" onClick={()=>{setShowAssign(null);setAssignClient("");}}>
          <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:360}}>
            <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:18}}>Asignar plan a {clients.find(c=>c.id===assignClient)?.name}</h2>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {plans.map(plan=>(
                <button key={plan.id} className="btn ghost" style={{textAlign:"left",padding:12}} onClick={()=>assignPlan(plan.id)}>
                  <div style={{fontWeight:700}}>{plan.name}</div>
                  <div style={{fontSize:11,color:"#475569"}}>{plan.category} · {plan.duration_weeks} semanas</div>
                </button>
              ))}
              {plans.length===0&&<p style={{fontSize:13,color:"#334155"}}>Crea un plan primero</p>}
              <button className="btn ghost" style={{padding:10}} onClick={()=>{setShowAssign(null);setAssignClient("");}}>Cancelar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── PROGRESS TAB ──────────────────────────────────────────────────────────
function ProgressTab({client, myProgress, myRecords, myAchievements, exercises, loadAll, notify}) {
  const [view, setView] = React.useState("stats");
  const [showLog, setShowLog] = React.useState(false);
  const [showPR, setShowPR] = React.useState(false);
  const [log, setLog] = React.useState({date:TODAY,weight:"",body_fat:"",waist:"",notes:""});
  const [pr, setPr] = React.useState({exercise_id:"",exercise_name:"",value:"",unit:"kg",date:TODAY,notes:""});
  const [saving, setSaving] = React.useState(false);

  const latest = myProgress[0];
  const prev = myProgress[1];

  const saveLog = async() => {
    if(!log.weight&&!log.waist) return notify("Introduce al menos un dato","err");
    setSaving(true);
    await sb.from("progress").insert({...log,client_id:client.id,weight:log.weight||null,body_fat:log.body_fat||null,waist:log.waist||null});
    // Check achievements
    if(myProgress.length===0) {
      await sb.from("achievements").insert({client_id:client.id,type:"first_log",title:"Primera medición",description:"Registraste tu primer dato de progreso",emoji:"📊"});
    }
    setLog({date:TODAY,weight:"",body_fat:"",waist:"",notes:""});
    setShowLog(false);
    await loadAll();
    setSaving(false);
    notify("Progreso registrado ✓");
  };

  const savePR = async() => {
    if(!pr.exercise_name||!pr.value) return notify("Completa los campos","err");
    setSaving(true);
    await sb.from("personal_records").insert({...pr,client_id:client.id,value:parseFloat(pr.value)});
    // Check PR achievement
    if(myRecords.length===0) {
      await sb.from("achievements").insert({client_id:client.id,type:"first_pr",title:"Primera marca personal",description:"Registraste tu primer récord personal",emoji:"🏆"});
    }
    setPr({exercise_id:"",exercise_name:"",value:"",unit:"kg",date:TODAY,notes:""});
    setShowPR(false);
    await loadAll();
    setSaving(false);
    notify("¡Nueva marca personal! 🏆");
  };

  const diff = (field) => {
    if(!latest||!prev||!latest[field]||!prev[field]) return null;
    const d = parseFloat(latest[field]) - parseFloat(prev[field]);
    return d;
  };

  const StatCard = ({label,value,unit,diffVal}) => (
    <div className="stat-box">
      <div className="mono" style={{fontSize:18,fontWeight:700,color:"#e2e8f0"}}>{value||"—"}<span style={{fontSize:11,color:"#475569",marginLeft:2}}>{value?unit:""}</span></div>
      {diffVal!==null&&diffVal!==undefined&&<div style={{fontSize:10,color:diffVal>0?"#f87171":"#4ade80",marginTop:2}}>{diffVal>0?"+":""}{diffVal?.toFixed(1)}</div>}
      <div style={{fontSize:9,color:"#334155",fontWeight:700,marginTop:3}}>{label.toUpperCase()}</div>
    </div>
  );

  const ACHIEVEMENT_LIST = [
    {type:"first_log",emoji:"📊",title:"Primera medición"},
    {type:"first_pr",emoji:"🏆",title:"Primera marca"},
    {type:"sessions_10",emoji:"💪",title:"10 sesiones"},
    {type:"sessions_25",emoji:"🔥",title:"25 sesiones"},
    {type:"streak_4",emoji:"⚡",title:"Racha 4 semanas"},
  ];

  return(
    <div>
      <div className="seg" style={{marginBottom:14}}>
        {[["stats","📊 Medidas"],["records","🏆 Marcas"],["badges","🎖 Logros"]].map(([id,label])=>(
          <button key={id} className={"sb"+(view===id?" on":"")} onClick={()=>setView(id)} style={{fontSize:12}}>{label}</button>

      {view==="stats"&&(
        <div>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <button className="btn sky" style={{flex:1,padding:10,fontSize:12}} onClick={()=>setShowLog(true)}>+ Registrar medidas</button>

              <div style={{fontSize:10,color:"#334155",fontWeight:700,marginBottom:10}}>ÚLTIMA MEDICIÓN — {latest.date}</div>

                <StatCard label="% Grasa" value={latest.body_fat} unit="%" diffVal={diff("body_fat")}/>
                <StatCard label="Cintura" value={latest.waist} unit="cm" diffVal={diff("waist")}/>

              {myProgress.map(p=>(
                <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #0d1520",fontSize:12}}>
                  <span style={{color:"#64748b"}}>{p.date}</span>
                  <span>{p.weight?`${p.weight}kg`:""} {p.body_fat?`${p.body_fat}%`:""} {p.waist?`${p.waist}cm`:""}</span>

      {view==="records"&&(
        <div>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <button className="btn sky" style={{flex:1,padding:10,fontSize:12}} onClick={()=>setShowPR(true)}>+ Nueva marca personal</button>
          </div>
          {myRecords.length===0
            ?<div className="card" style={{textAlign:"center",padding:36}}>
              <div style={{fontSize:28,marginBottom:8}}>🏆</div>
              <div style={{color:"#475569",fontSize:13}}>Aún no tienes marcas registradas</div>
            </div>
            :<div>
              {Object.entries(myRecords.reduce((acc,r)=>{
                if(!acc[r.exercise_name]) acc[r.exercise_name]=[];
                acc[r.exercise_name].push(r);
                return acc;
              },{})).map(([name,recs])=>{
                const best = recs.sort((a,b)=>b.value-a.value)[0];
                return(
                  <div key={name} className="card" style={{marginBottom:8}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:14}}>{name}</div>
                        <div style={{fontSize:11,color:"#475569",marginTop:2}}>{recs.length} registros · Mejor: <span style={{color:"#facc15",fontWeight:700}}>{best.value}{best.unit}</span></div>

                      <div className="mono" style={{fontSize:20,fontWeight:700,color:"#facc15"}}>{best.value}<span style={{fontSize:11}}>{best.unit}</span></div>
                    </div>
                    <div style={{marginTop:8}}>
                      {recs.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(r=>(
                        <div key={r.id} style={{display:"flex",justifyContent:"space-between",fontSize:11,padding:"4px 0",borderTop:"1px solid #0d1520",color:"#64748b"}}>

      {view==="badges"&&(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {ACHIEVEMENT_LIST.map(a=>{
              const earned = myAchievements.find(x=>x.type===a.type);
              return(
                <div key={a.type} className="card" style={{textAlign:"center",padding:16,opacity:earned?1:0.35,border:earned?"1px solid #1e3a5a":"1px solid var(--border)"}}>
                  <div style={{fontSize:30,marginBottom:6}}>{a.emoji}</div>
                  <div style={{fontSize:12,fontWeight:700,color:earned?"#e2e8f0":"#334155"}}>{a.title}</div>
                  {earned&&<div style={{fontSize:10,color:"#334155",marginTop:4}}>{new Date(earned.earned_at).toLocaleDateString("es-ES",{day:"numeric",month:"short"})}</div>}
                  {!earned&&<div style={{fontSize:10,color:"#1e293b",marginTop:4}}>Por conseguir</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {showLog&&(
        <div className="ovl" onClick={()=>setShowLog(false)}>
          <div className="mdl fade" onClick={e=>e.stopPropagation()}>
            <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:18}}>Registrar medidas</h2>
            <div style={{display:"flex",flexDirection:"column",gap:13}}>
              <div><span className="lbl">FECHA</span><input type="date" className="inp" value={log.date} onChange={e=>setLog(v=>({...v,date:e.target.value}))}/></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div><span className="lbl">PESO (kg)</span><input type="number" className="inp" placeholder="75.5" value={log.weight} onChange={e=>setLog(v=>({...v,weight:e.target.value}))}/></div>
                <div><span className="lbl">% GRASA</span><input type="number" className="inp" placeholder="18.5" value={log.body_fat} onChange={e=>setLog(v=>({...v,body_fat:e.target.value}))}/></div>
                <div><span className="lbl">CINTURA (cm)</span><input type="number" className="inp" placeholder="80" value={log.waist} onChange={e=>setLog(v=>({...v,waist:e.target.value}))}/></div>
                <div><span className="lbl">MASA MUSCULAR (kg)</span><input type="number" className="inp" placeholder="35" value={log.muscle_mass||""} onChange={e=>setLog(v=>({...v,muscle_mass:e.target.value}))}/></div>
              </div>
              <div><span className="lbl">NOTAS</span><input className="inp" placeholder="Cómo me siento..." value={log.notes} onChange={e=>setLog(v=>({...v,notes:e.target.value}))}/></div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn sky" style={{flex:1,padding:11}} onClick={saveLog} disabled={saving}>{saving?"Guardando...":"Guardar"}</button>
                <button className="btn ghost" style={{flex:1,padding:11}} onClick={()=>setShowLog(false)}>Cancelar</button>
