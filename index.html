<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#eef1f7;--card:#ffffff;--border:#dbe2ec;--border2:#cfd8e6;--text:#0f172a;--muted:#64748b;
  --sky:#0284c7;--green:#059669;--amber:#f59e0b;--red:#dc2626;}
html{background:#eef1f7;}body{background:#eef1f7;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}
.fade{animation:fadeUp .25s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ─ Barrido suave al cambiar de vista + tacto en los toques ─ */
.swipe{animation:swipeIn .3s cubic-bezier(.22,.61,.36,1) both;}
@keyframes swipeIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.btn,.sb,.tab,.bnav-btn,.card{transition:transform .12s ease,background .18s ease,border-color .18s ease,color .18s ease,opacity .18s ease;}
.btn:active,.sb:active,.tab:active{transform:scale(.96);}
.bnav-btn:active{transform:scale(.9);}
@media(prefers-reduced-motion:reduce){.swipe,.fade{animation:none;}.btn,.sb,.tab,.bnav-btn{transition:none;}}

/* ─ NAV sidebar → bottom on mobile ─ */
.nav{display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:11px;cursor:pointer;
  font-size:13px;font-weight:600;color:#64748b;border:none;background:none;width:100%;text-align:left;
  font-family:'Plus Jakarta Sans',sans-serif;transition:all .18s;}
.nav:hover,.nav:active{background:#ffffff;color:#64748b;}
.nav.on{background:linear-gradient(135deg,#dcebfb,#dcebfb);color:var(--sky);border:1px solid #bcd3ee;}

/* ─ Sidebar: hidden on mobile, visible on desktop ─ */
.sidebar{width:200px;flex-shrink:0;padding:22px 10px;display:flex;flex-direction:column;
  gap:3px;border-right:1px solid #e6ebf3;position:sticky;top:0;height:100vh;overflow:auto;}

/* ─ Bottom nav: visible on mobile only ─ */
.bottom-nav{display:none;}

@media(max-width:640px){
  /* Hide sidebar */
  .sidebar{display:none !important;}

  /* Show bottom nav */
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;
    background:rgba(255,255,255,.9);border-top:1px solid #dbe2ec;
    align-items:center;justify-content:space-around;
    padding:9px 0 calc(16px + env(safe-area-inset-bottom));
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 -2px 14px rgba(16,24,40,.06);
  }
  .bnav-btn{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 10px;border:none;background:none;cursor:pointer;
    color:#64748b;font-family:'Plus Jakarta Sans',sans-serif;
    font-size:11px;font-weight:600;border-radius:10px;
    -webkit-tap-highlight-color:transparent;min-width:56px;
  }
  .bnav-btn.on{color:var(--sky);}
  .bnav-icon{font-size:22px;line-height:1.2;position:relative;display:inline-block;}
  .bnav-badge{position:absolute;top:-3px;right:-6px;background:#dc2626;color:#fff;
    border-radius:10px;font-size:9px;font-weight:700;padding:1px 4px;min-width:15px;text-align:center;}

  /* Main content padding for bottom nav */
  .admin-content{

  .ovl{align-items:flex-end !important;}

    padding:12px 14px;border-bottom:1px solid #e6ebf3;
    background:var(--bg);position:sticky;top:0;z-index:50;
  }
}

@media(min-width:641px){

  .bottom-nav{display:none;}

.mono{font-family:'JetBrains Mono',monospace;}
.lbl{font-size:11px;color:#64748b;display:block;margin-bottom:5px;font-weight:700;letter-spacing:.8px;}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}

.hero-card::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;
  border-radius:50%;background:radial-gradient(circle,#0284c712,transparent 70%);}

.streak-fire{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
</style>

function saveSession(type, data) {

function getMonthDays(year, month) {
  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month+1, 0).getDate();
  const prev = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=(first===0?6:first-1); i>0; i--) cells.push({day:prev-i+1,cur:false});
  for(let i=1; i<=days; i++) cells.push({day:i,cur:true});
  while(cells.length%7!==0) cells.push({day:cells.length-days-(first===0?6:first-1)+1,cur:false});
  return cells;
}

function calcStreak(history) {
  if(!history.length) return 0;
  const dates = [...new Set(history.map(h=>h.date))].sort((a,b)=>b.localeCompare(a));
  let streak = 0, prev = null;
  for(const d of dates) {
    if(!prev) { streak=1; prev=d; continue; }
    const diff = Math.round((new Date(prev+"T12:00:00") - new Date(d+"T12:00:00")) / 86400000);
    if(diff<=7) { streak++; prev=d; } else break;
  }
  return streak;
}

function App() {

  const [clientWeights, setClientWeights] = React.useState([]);

  const notify = React.useCallback((msg, type="ok") => {

  const loadAll = React.useCallback(async () => {
    try {
      const [c,s,h,p,b,f,ex,pl,cp,pr,rec,ach,ab,st,te,cw,as_,ae,wh,wl] = await Promise.all([

        sb.from("blocked_slots").select("*"),

        sb.from("training_plans").select("*, plan_days(*, plan_exercises(*))").order("created_at",{ascending:false}),

        sb.from("personal_records").select("*").order("date",{ascending:false}),

        sb.from("template_exercises").select("*").order("order_index"),

    <div>
      {toast&&<div className="notif" style={{background:toast.type==="err"?"#fbe6e6":toast.type==="wa"?"#dff3e6":"#eaf1fb",color:toast.type==="err"?"#dc2626":toast.type==="wa"?"#16a34a":"#0284c7",border:`1px solid ${toast.type==="err"?"#f2cccc":toast.type==="wa"?"#14532d":"#bcd3ee"}`}}>{toast.msg}</div>}
      {mode==="login"&&<LoginScreen {...{loginTab,setLoginTab,loginName,setLoginName,loginCode,setLoginCode,adminPass,setAdminPass,loginErr,setLoginErr,handleClientLogin,handleAdminLogin}}/>}
      {mode==="admin"&&<AdminPanel {...{clients,sessions,history,payments,blocked,waitlist,forum,exercises,plans,clientPlans,progress,records,achievements,annualBlocks,sessionTemplates,templateExercises,clientWeights,assignedSessions,assignedExercises,weightHistory,loadAll,notify}} onLogout={()=>{clearSession();setMode("login");}}/>}
      {mode==="client"&&loggedClient&&<ClientPortal client={loggedClient} allSessions={sessions} allHistory={history} allClients={clients} blocked={blocked} waitlist={waitlist} forum={forum} exercises={exercises} plans={plans} clientPlans={clientPlans} myProgress={progress.filter(p=>p.client_id===loggedClient.id)} myRecords={records.filter(r=>r.client_id===loggedClient.id)} myAchievements={achievements.filter(a=>a.client_id===loggedClient.id)} myAssignedSessions={assignedSessions.filter(s=>s.client_id===loggedClient.id)} myAssignedExercises={assignedExercises} clientWeights={clientWeights.filter(w=>w.client_id===loggedClient.id)} annualBlocks={annualBlocks} loadAll={loadAll} notify={notify} onLogout={()=>{clearSession();setLoggedClient(null);setMode("login");}}/>}
    </div>
  );
}

// ── LOGIN ──────────────────────────────────────────────────────────────────
function LoginScreen({loginTab,setLoginTab,loginName,setLoginName,loginCode,setLoginCode,adminPass,setAdminPass,loginErr,setLoginErr,handleClientLogin,handleAdminLogin}) {
  const [remember, setRemember] = React.useState(true);
  const RememberBox = ({id}) => (
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"2px 0"}}>
      <input type="checkbox" id={id} checked={remember} onChange={e=>setRemember(e.target.checked)} style={{accentColor:"#0284c7",width:18,height:18,cursor:"pointer"}}/>
      <label htmlFor={id} style={{fontSize:13,color:"#64748b",cursor:"pointer"}}>Recordarme en este dispositivo</label>
    </div>
  );
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"radial-gradient(ellipse at 50% 0%,#dcebfb,#eef1f7 60%)"}}>
      <div style={{width:"100%",maxWidth:380}} className="fade">
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:38,marginBottom:8}}>🏋️</div>
          <div className="mono" style={{fontSize:28,fontWeight:700,color:"#0284c7",letterSpacing:-1}}>{GYM_NAME}</div>
          <div style={{color:"#94a3b8",fontSize:13,marginTop:5}}>Tu centro de entrenamiento personal</div>
        </div>
        <div className="seg" style={{marginBottom:20}}>
          <button className={`sb ${loginTab==="client"?"on":""}`} onClick={()=>{setLoginTab("client");setLoginErr("");}}>Soy cliente</button>
          <button className={`sb ${loginTab==="admin"?"on":""}`} onClick={()=>{setLoginTab("admin");setLoginErr("");}}>Admin</button>
        </div>
        <div className="card" style={{padding:26}}>
          {loginTab==="client"?(
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <p style={{fontSize:13,color:"#64748b",marginBottom:4}}>Ingresa tu nombre y el código de acceso.</p>
              <div><span className="lbl">NOMBRE COMPLETO</span>
                <input className="inp" placeholder="Ej. Carlos Mendoza" value={loginName} onChange={e=>setLoginName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleClientLogin(remember)}/>
              </div>
              <div><span className="lbl">CÓDIGO</span>
                <input className="inp mono" placeholder="••••" maxLength={4} value={loginCode} onChange={e=>setLoginCode(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleClientLogin(remember)} style={{letterSpacing:8,fontSize:20,textAlign:"center"}}/>
              </div>
              {loginErr&&<p style={{fontSize:12,color:"#dc2626"}}>{loginErr}</p>}
              <RememberBox id="remC"/>
              <button className="btn sky" style={{width:"100%",padding:13,fontSize:14}} onClick={()=>handleClientLogin(remember)}>Entrar a mi portal</button>
              <p style={{fontSize:11,color:"#bcd3ee",textAlign:"center"}}>¿Sin código? Escribe a tu trainer 📱</p>
            </div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div><span className="lbl">CONTRASEÑA</span>
                <input className="inp" type="password" placeholder="••••••••" value={adminPass} onChange={e=>setAdminPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleAdminLogin(remember)}/>
              </div>
              {loginErr&&<p style={{fontSize:12,color:"#dc2626"}}>{loginErr}</p>}
              <RememberBox id="remA"/>
              <button className="btn sky" style={{width:"100%",padding:13,fontSize:14}} onClick={()=>handleAdminLogin(remember)}>Entrar al panel</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── ADMIN ──────────────────────────────────────────────────────────────────
function AdminPanel({clients,sessions,history,payments,blocked,waitlist,forum,exercises,plans,clientPlans,progress,records,achievements,annualBlocks,sessionTemplates,templateExercises,clientWeights,assignedSessions,assignedExercises,weightHistory,loadAll,notify,onLogout}) {
  const [view,setView] = React.useState("dashboard");
  const [schedView,setSchedView] = React.useState("day");
  const [showVacation,setShowVacation] = React.useState(false);
  const [expanded,setExpanded] = React.useState(null);
  const [waClient,setWaClient] = React.useState(null);
  const [showBulkWA,setShowBulkWA] = React.useState(false);
  const [showNC,setShowNC] = React.useState(false);
  const [showNS,setShowNS] = React.useState(false);
  const [showPay,setShowPay] = React.useState(null);
  const [saving,setSaving] = React.useState(false);
  const [calDate,setCalDate] = React.useState(new Date());
  const [activeDay,setActiveDay] = React.useState(TODAY);
  const [nc,setNc] = React.useState({name:"",code:"",phone:"",email:"",sessions:10,cost:100,nextPayment:"",welcome:"",notes:"",goal:"salud"});
  const [ns,setNs] = React.useState({clientId:"",date:TODAY,time:"07:00",type:"Fuerza",confirmed:true});
  const [config,setConfig] = React.useState(DEFAULT_SCHEDULE);
  const [showSched,setShowSched] = React.useState(false);
  const [moveSess,setMoveSess] = React.useState(null);
  const [quickView,setQuickView] = React.useState(null);
  const [execData,setExecData] = React.useState(null);
  const [assignData,setAssignData] = React.useState(null);
  const [progData,setProgData] = React.useState(null);

  // Carga la configuración de horario (si la tabla existe; si no, usa los valores por defecto).
  React.useEffect(()=>{
    sb.from("app_settings").select("config").eq("id",1).then(({data})=>{
      if(data&&data[0]&&data[0].config) setConfig({...DEFAULT_SCHEDULE,...data[0].config});
    });
  },[]);
  const saveConfig = (cfg) => w(async()=>{
    setConfig(cfg);
    const {error}=await sb.from("app_settings").upsert({id:1,config:cfg});
    if(error) return notify("Guarda la tabla app_settings (ver docs)","err");
    notify("Horario guardado ✓");
  });

  // Franjas de trabajo derivadas de la config y capacidad (atletas) por hora.
  const workSlots = [...genSlots(config.morningFrom,config.morningTo),...genSlots(config.afternoonFrom,config.afternoonTo)];
  const capOf = (t) => (config.capacity&&config.capacity[t]!=null)?config.capacity[t]:config.defaultCapacity;
  // Franjas visibles del día: las de trabajo + cualquier hora con sesión (para no ocultar nada).
  const daySlots = Array.from(new Set([...workSlots,...sessions.filter(s=>s.date===activeDay).map(s=>s.time)])).sort();

  const reminders = [];
  clients.forEach(c=>{
    const d=daysUntil(c.next_payment);
    if(d<=5) reminders.push({c,type:"payment",days:d,urgent:d<=2});
    if(c.sessions_left<=2&&c.sessions_left>0) reminders.push({c,type:"sessions",urgent:c.sessions_left<=1});
    if(c.sessions_left===0) reminders.push({c,type:"expired",urgent:true});
  });
  const requests = sessions.filter(s=>s.requested);
  const todaySessions = sessions.filter(s=>s.date===TODAY&&!s.requested);
  // Lista de espera con hueco libre (para avisar al cliente).
  const freedWaitlist = (waitlist||[]).filter(x=>x.date>=TODAY).map(x=>{
    const taken=sessions.filter(s=>s.date===x.date&&s.time===x.time).length;
    const blk=blocked.some(b=>b.date===x.date&&(b.time===x.time||b.time==="ALL"));
    const c=clients.find(cl=>cl.id===x.client_id);
    return {wl:x,c,free:!blk&&taken<capOf(x.time)};
  }).filter(o=>o.c&&o.free);
  const alertCount = reminders.filter(r=>r.urgent).length+requests.length+freedWaitlist.length;

  // Income stats
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthIncome = payments.filter(p=>p.paid_at&&p.paid_at.startsWith(thisMonth)).reduce((a,p)=>a+parseFloat(p.amount||0),0);
  const totalIncome = payments.reduce((a,p)=>a+parseFloat(p.amount||0),0);

  const w = async (fn) => { setSaving(true); await fn(); await loadAll(); setSaving(false); };

  const addClient = () => w(async()=>{
    if(!nc.name||!nc.code||!nc.nextPayment) return notify("Completa los campos requeridos","err");
    if(nc.code.length!==4) return notify("El código debe tener 4 dígitos","err");
    if(clients.find(c=>c.code===nc.code)) return notify("Ese código ya existe","err");
    const color=COLORS[clients.length%COLORS.length];
    const {error}=await sb.from("clients").insert({name:nc.name,code:nc.code,phone:nc.phone,email:nc.email,color,sessions_left:parseInt(nc.sessions),total_sessions:parseInt(nc.sessions),next_payment:nc.nextPayment,payment_amount:parseFloat(nc.cost),welcome_msg:nc.welcome,notes:nc.notes,goal:nc.goal});
    if(error) return notify("Error: "+error.message,"err");
    setShowNC(false); setNc({name:"",code:"",phone:"",email:"",sessions:10,cost:100,nextPayment:"",welcome:"",notes:"",goal:"salud"});
    notify("Cliente añadido ✓");
  });

  const saveNotes = (clientId, notes) => w(async()=>{
    await sb.from("clients").update({notes}).eq("id",clientId);
    notify("Notas guardadas ✓");
  });

  const addSession = () => w(async()=>{
    if(!ns.clientId) return notify("Selecciona un cliente","err");
    const {error}=await sb.from("sessions").insert({client_id:ns.clientId,date:ns.date,time:ns.time,type:ns.type,status:ns.confirmed?"confirmed":"pending",requested:false});
    if(error) return notify("Error: "+error.message,"err");
    setShowNS(false); setNs({clientId:"",date:TODAY,time:"07:00",type:"Fuerza",confirmed:true});
    notify("Sesión agendada ✓");
  });

  const completeSession = (sess) => w(async()=>{
    await sb.from("sessions").delete().eq("id",sess.id);
    await sb.from("history").insert({client_id:sess.client_id,date:sess.date,time:sess.time,type:sess.type});
    const client=clients.find(c=>c.id===sess.client_id);
    if(client) await sb.from("clients").update({sessions_left:Math.max(0,client.sessions_left-1)}).eq("id",client.id);
    notify("Sesión completada ✓");
  });

  // Cuenta una sesión suelta (cliente que entrena sin cita previa): la registra
  // hoy en el historial y descuenta 1 del bono.
  const countWalkin = (client) => w(async()=>{
    const now=new Date().toTimeString().slice(0,5);
    await sb.from("history").insert({client_id:client.id,date:TODAY,time:now,type:"Sesión"});
    await sb.from("clients").update({sessions_left:Math.max(0,client.sessions_left-1)}).eq("id",client.id);
    notify("Sesión contada ✓");
  });

  const deleteSession = (id) => w(async()=>{ await sb.from("sessions").delete().eq("id",id); notify("Sesión eliminada"); });

  // Aprobar una solicitud avisa si la clase ya está completa (permite forzar).
  const approveRequest = (id) => {
    const req=sessions.find(s=>s.id===id); if(!req) return;
    const confirmadas=sessions.filter(s=>s.date===req.date&&s.time===req.time&&!s.requested).length;
    const cap=capOf(req.time);
    if(confirmadas>=cap && !window.confirm(`⚠️ La clase de las ${req.time} ya está completa (${confirmadas}/${cap}).\n¿Aprobar de todos modos?`)) return;
    w(async()=>{ await sb.from("sessions").update({requested:false,status:"confirmed"}).eq("id",id); notify("Solicitud aprobada ✓"); });
  };
  const denyRequest = (id) => w(async()=>{ await sb.from("sessions").delete().eq("id",id); notify("Solicitud rechazada"); });

  // Mover una sesión a otro día/hora (reprogramar).
  const rescheduleSession = (sess,date,time) => w(async()=>{
    await sb.from("sessions").update({date,time}).eq("id",sess.id);
    notify("Sesión movida ✓");
  });
  const removeWaitlist = (id) => w(async()=>{ await sb.from("waitlist").delete().eq("id",id); notify("Quitado de la lista de espera"); });

  const markPayment = (client, amount) => w(async()=>{
    const next=new Date(client.next_payment+"T12:00:00"); next.setMonth(next.getMonth()+1);
    await sb.from("clients").update({next_payment:next.toISOString().split("T")[0]}).eq("id",client.id);
    await sb.from("payments").insert({client_id:client.id,client_name:client.name,amount:amount||client.payment_amount,paid_at:TODAY});
    setShowPay(null); notify("Pago registrado ✓");
  });

  const renewSessions = (client) => w(async()=>{ await sb.from("clients").update({sessions_left:client.total_sessions}).eq("id",client.id); notify("Sesiones renovadas ✓"); });
  const deleteClient = (id) => w(async()=>{ await sb.from("clients").delete().eq("id",id); setExpanded(null); notify("Cliente eliminado"); });

  const toggleBlockDay = (date) => w(async()=>{
    const ex=blocked.find(b=>b.date===date&&b.time==="ALL");
    if(ex) await sb.from("blocked_slots").delete().eq("id",ex.id);
    else await sb.from("blocked_slots").insert({date,time:"ALL",reason:"Día bloqueado"});
    notify(ex?"Día desbloqueado":"Día bloqueado 🚫");
  });

  const blockVacation = (startDate, endDate, reason="Vacaciones") => w(async()=>{
    const start=new Date(startDate+"T12:00:00");
    const end=new Date(endDate+"T12:00:00");
    const inserts=[];
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      const ds=d.toISOString().split("T")[0];
      const dow=d.getDay();
      if(dow>=1&&dow<=5) inserts.push({date:ds,time:"ALL",reason:"Vacaciones"});
    }
    if(inserts.length>0) await sb.from("blocked_slots").insert(inserts);
    setShowVacation(false);
    const emoji = reason==="Festivo"?"🎉":"🏖";
    notify(`${inserts.length} días marcados como ${reason} ${emoji}`);
  });

  const toggleBlock = (date, time) => w(async()=>{
    const ex=blocked.find(b=>b.date===date&&b.time===time);
    if(ex) await sb.from("blocked_slots").delete().eq("id",ex.id);
    else await sb.from("blocked_slots").insert({date,time});
    notify(ex?"Horario desbloqueado":"Horario bloqueado");
  });

  const isBlocked = (date,time) => blocked.some(b=>b.date===date&&b.time===time);

  // Calendar helpers
  const calYear=calDate.getFullYear(), calMonth=calDate.getMonth();
  const calDays=getMonthDays(calYear,calMonth);
  const getDayStr=(day)=>`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


  return (
    <div style={{minHeight:"100vh"}}>
      {/* Mobile top bar */}
      <div className="mobile-topbar">
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:18}}>🏋️</span>
          <span className="mono" style={{fontSize:14,fontWeight:700,color:"#0284c7"}}>{GYM_NAME}</span>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn wa" style={{fontSize:11,padding:"7px 11px"}} onClick={()=>setShowBulkWA(true)}>📱</button>
          <button className="btn ghost" style={{fontSize:11,padding:"7px 11px"}} onClick={onLogout}>⏏</button>
        </div>
      </div>

      {/* Secondary nav tabs */}
      {["forum","reminders","income"].includes(view)&&(
        <div style={{display:"flex",gap:6,padding:"8px 14px 0",overflowX:"auto"}}>
          {[["forum","💬 Foro"],["reminders","🔔 Alertas"],["income","💶 Ingresos"]].map(([id,label])=>(
            <button key={id} className={"tab"+(view===id?" on":"")} onClick={()=>setView(id)} style={{flexShrink:0,fontSize:12}}>{label}</button>
          ))}
          <button className={"tab"} onClick={()=>setView("dashboard")} style={{flexShrink:0,fontSize:12,color:"#64748b"}}>← Volver</button>
        </div>
      )}

      {/* Bottom navigation - mobile only */}
      <nav className="bottom-nav">
        {[
          {id:"dashboard",icon:"🏠",label:"Inicio"},
          {id:"clients",icon:"👥",label:"Clientes"},
          {id:"schedule",icon:"📅",label:"Agenda"},
          {id:"programming",icon:"📊",label:"Programa"},
        ].map(item=>(
          <button key={item.id} className={"bnav-btn"+(view===item.id?" on":"")} onClick={()=>setView(item.id)}>
            <span className="bnav-icon">
              {item.icon}
              {item.count>0&&<span className="bnav-badge">{item.count}</span>}
            </span>
            <span>{item.label}</span>
          </button>
        ))}
      </nav>

      {saving&&<div style={{position:"fixed",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,#0284c7,#16a34a)",zIndex:500}}/>}
      {saving&&<div style={{position:"fixed",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,#0284c7,#16a34a)",zIndex:500}}/>}


      {/* Content */}
      <div style={{padding:"14px 14px 80px",minHeight:"100vh",background:"#eef1f7"}} className="fade admin-content">

        {/* DASHBOARD */}
        {view==="dashboard"&&(
          <div>
            <div style={{marginBottom:24}}>
              <h1 className="mono" style={{fontSize:20,fontWeight:700}}>{GYM_NAME} — Dashboard</h1>
              <p style={{color:"#94a3b8",fontSize:12,marginTop:4}}>{fmtLong(TODAY)}</p>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
              {[
                {label:"Clientes",val:clients.length,color:"#0284c7"},
                {label:"Activos",val:clients.filter(c=>statusOf(c)==="active").length,color:"#16a34a"},
                {label:"Alertas",val:reminders.length,color:"#ca8a04"},
                {label:"Sesiones hoy",val:todaySessions.length,color:"#a78bfa"},
                {label:"Este mes",val:`${monthIncome}€`,color:"#16a34a"},
              ].map(s=>(
                <div key={s.label} className="card">
                  <div className="mono" style={{fontSize:22,fontWeight:700,color:s.color}}>{s.val}</div>
                  <div style={{fontSize:10,color:"#94a3b8",marginTop:5,fontWeight:700}}>{s.label.toUpperCase()}</div>
                </div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
              <div className="card">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                  <h3 style={{fontSize:13,fontWeight:700}}>Sesiones de hoy</h3>
                  <button className="btn sky" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>{setView("schedule");setShowNS(true);}}>+ Nueva</button>
                </div>
                {todaySessions.length===0?<p style={{fontSize:12,color:"#cbd5e1"}}>Sin sesiones hoy</p>
                  :todaySessions.sort((a,b)=>a.time.localeCompare(b.time)).map(s=>{
                    const c=clients.find(x=>x.id===s.client_id); if(!c) return null;
                    return(
                      <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #e6ebf3"}}>
                        <div className="ring" style={{width:32,height:32,background:c.color+"20",color:c.color,fontSize:10}}>{ini(c.name)}</div>
                        <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{c.name}</div><div style={{fontSize:11,color:"#64748b"}}>{s.type}</div></div>
                        <div style={{textAlign:"right"}}>
                          <div className="mono" style={{fontSize:13,fontWeight:600,color:"#0284c7"}}>{s.time}</div>
                          <button className="btn grn" style={{fontSize:10,padding:"3px 7px",marginTop:3}} onClick={()=>completeSession(s)}>✓ Hecha</button>
                        </div>
                      </div>
                    );
                  })
                }
              </div>
              <div className="card">
                <h3 style={{fontSize:13,fontWeight:700,marginBottom:14}}>Solicitudes pendientes</h3>
                {requests.length===0?<p style={{fontSize:12,color:"#cbd5e1"}}>Sin solicitudes ✓</p>
                  :requests.map(r=>{
                    const c=clients.find(x=>x.id===r.client_id); if(!c) return null;
                    return(
                      <div key={r.id} style={{background:"#eaf1fb",borderRadius:10,padding:10,marginBottom:8,border:"1px solid #bcd3ee"}}>
                        <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:8}}>
                          <div className="ring" style={{width:30,height:30,background:c.color+"20",color:c.color,fontSize:10}}>{ini(c.name)}</div>
                          <div><div style={{fontSize:12,fontWeight:700}}>{c.name}</div><div style={{fontSize:11,color:"#64748b"}}>{r.type} · {fmtDate(r.date)} {r.time}</div></div>
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          <button className="btn grn" style={{flex:1,fontSize:11,padding:"6px 8px"}} onClick={()=>approveRequest(r.id)}>✓ Aprobar</button>
                          <button className="btn danger" style={{flex:1,fontSize:11,padding:"6px 8px"}} onClick={()=>denyRequest(r.id)}>✕ Rechazar</button>
                        </div>
                      </div>
                    );
                  })
                }
              </div>
            </div>
          </div>
        )}

        {/* FEED — PASAR LISTA */}
        {view==="feed"&&(
          <div>
            <div style={{marginBottom:20}}>
              <h1 className="mono" style={{fontSize:20,fontWeight:700}}>Pasar lista</h1>
              <p style={{color:"#94a3b8",fontSize:12,marginTop:4}}>Marca quién entrena — se descuenta de su bono automáticamente.</p>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:12}}>
              {clients.map(c=>{
                const nextSess=sessions.filter(s=>s.client_id===c.id&&!s.requested&&s.date>=TODAY)
                  .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
                return {c,nextSess,today:!!nextSess&&nextSess.date===TODAY};
              }).sort((a,b)=>{
                if(a.today!==b.today) return a.today?-1:1;                       // sesión hoy primero
                if(a.today&&b.today) return a.nextSess.time.localeCompare(b.nextSess.time); // por hora
                return 0;
              }).map(({c,nextSess,today})=>{
                const st=statusOf(c);
                const pd=daysUntil(c.next_payment);
                const cHist=history.filter(h=>h.client_id===c.id).sort((a,b)=>(b.date+(b.time||"")).localeCompare(a.date+(a.time||"")));
                const last=cHist[0];
                return(
                  <div key={c.id} className="card" style={{border:`1px solid ${today?"#bcd3ee":"var(--border)"}`}}>
                    <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:12}}>
                      {c.avatar_url
                        ?<img src={c.avatar_url} alt={c.name} style={{width:46,height:46,borderRadius:"50%",objectFit:"cover",border:`1.5px solid ${c.color}45`}}/>
                        :<div className="ring" style={{width:46,height:46,background:c.color+"18",color:c.color,border:`1.5px solid ${c.color}35`,fontSize:14}}>{ini(c.name)}</div>}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                          <div style={{fontWeight:700,fontSize:14}}>{c.name}</div>
                          {today&&<span style={{fontSize:9,fontWeight:700,color:"#0284c7",background:"#e6f0fb",border:"1px solid #bcd3ee",borderRadius:20,padding:"2px 7px"}}>HOY {nextSess.time}</span>}
                        </div>
                        <div style={{fontSize:11,color:"#64748b",marginTop:2}}>Bono {c.total_sessions} · {c.payment_amount}€</div>
                      </div>
                      <span className="pill" style={{background:statusColor(st)+"18",color:statusColor(st),border:`1px solid ${statusColor(st)}30`,whiteSpace:"nowrap"}}>{c.sessions_left}/{c.total_sessions}</span>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
                      <div style={{background:"#f1f4fa",borderRadius:9,padding:"8px 10px"}}>
                        <div style={{color:"#94a3b8",fontWeight:700,fontSize:9,marginBottom:3,letterSpacing:.5}}>CADUCIDAD BONO</div>
                        <div style={{fontSize:12,color:pd<=3?"#dc2626":"#64748b"}}>{isNaN(pd)?"—":pd<0?`vencido hace ${-pd}d`:pd===0?"hoy":`en ${pd}d`}</div>
                      </div>
                      <div style={{background:"#f1f4fa",borderRadius:9,padding:"8px 10px"}}>
                        <div style={{color:"#94a3b8",fontWeight:700,fontSize:9,marginBottom:3,letterSpacing:.5}}>ÚLTIMA SESIÓN</div>
                        <div style={{fontSize:12,color:"#64748b"}}>{last?fmtDate(last.date):"—"}</div>
                      </div>
                      <div style={{background:"#f1f4fa",borderRadius:9,padding:"8px 10px",gridColumn:"1 / -1"}}>
                        <div style={{color:"#94a3b8",fontWeight:700,fontSize:9,marginBottom:3,letterSpacing:.5}}>SESIÓN AGENDADA</div>
                        <div style={{fontSize:12,color:nextSess?"#0284c7":"#64748b"}}>{nextSess?`${nextSess.date===TODAY?"Hoy":fmtDate(nextSess.date)} · ${nextSess.time} · ${nextSess.type}`:"Sin agendar"}</div>
                      </div>
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      <button className="btn grn" style={{flex:1,padding:"9px",justifyContent:"center"}} onClick={()=>nextSess?completeSession(nextSess):countWalkin(c)}>✓ Vino</button>
                      <button className="btn danger" style={{padding:"9px 12px",opacity:nextSess?1:0.35}} disabled={!nextSess} onClick={()=>nextSess&&deleteSession(nextSess.id)}>✗ No vino</button>
                      <button className="btn wa" style={{padding:"9px 12px"}} onClick={()=>setWaClient(c)}>📱</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* CLIENTS */}
        {view==="clients"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
              <div><h1 className="mono" style={{fontSize:20,fontWeight:700}}>Clientes</h1><p style={{color:"#94a3b8",fontSize:12,marginTop:3}}>{clients.length} registrados</p></div>
              <button className="btn sky" onClick={()=>setShowNC(true)}>+ Nuevo</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
              {clients.map(c=>{
                const st=statusOf(c),pct=Math.round(c.sessions_left/c.total_sessions*100),pd=daysUntil(c.next_payment),open=expanded===c.id;
                const cSess=sessions.filter(s=>s.client_id===c.id&&s.date>=TODAY);
                const cHist=history.filter(h=>h.client_id===c.id);
                const streak=calcStreak(cHist);
                return(
                  <div key={c.id} className="card" style={{cursor:"pointer",transition:"all .2s",border:`1px solid ${open?"#bcd3ee":"var(--border)"}`}} onClick={()=>setExpanded(open?null:c.id)}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                      <div style={{display:"flex",gap:11,alignItems:"center"}}>
                        <div className="ring" style={{width:42,height:42,background:c.color+"18",color:c.color,border:`1.5px solid ${c.color}35`,fontSize:13}}>{ini(c.name)}</div>
                        <div>
                          <div style={{fontWeight:700,fontSize:14}}>{c.name}</div>
                          <div style={{display:"flex",gap:6,alignItems:"center",marginTop:2}}>
                            <div className="mono" style={{color:"#94a3b8",fontSize:11}}>#{c.code}</div>
                            {streak>0&&<span style={{fontSize:10,color:"#ea580c"}}>🔥{streak}</span>}
                          </div>
                        </div>
                      </div>
                      <span className="pill" style={{background:statusColor(st)+"18",color:statusColor(st),border:`1px solid ${statusColor(st)}30`}}>{statusLabel(st)}</span>
                    </div>
                    <div style={{marginBottom:11}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                        <span style={{fontSize:10,color:"#64748b",fontWeight:700}}>SESIONES</span>
                        <span className="mono" style={{fontSize:11,fontWeight:700}}>{c.sessions_left}/{c.total_sessions}</span>
                      </div>
                      <div className="pbar"><div className="pfill" style={{width:`${pct}%`,background:pct>40?"#16a34a":pct>20?"#ca8a04":"#dc2626"}}/></div>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div>
                        <div style={{fontSize:10,color:"#94a3b8",fontWeight:700}}>PRÓXIMO PAGO</div>
                        <div style={{fontSize:12,color:pd<=3?"#dc2626":"#64748b"}}>{pd<0?"Vencido":pd===0?"Hoy":`${pd}d`} · {c.payment_amount}€</div>
                      </div>
                      <button className="btn wa" style={{fontSize:11}} onClick={e=>{e.stopPropagation();setWaClient(c);}}>📱 WA</button>
                    </div>
                    {open&&(
                      <div style={{marginTop:14,borderTop:"1px solid #e6ebf3",paddingTop:14}} onClick={e=>e.stopPropagation()}>
                        <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:14}}>
                          <button className="btn sky" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>setShowPay(c)}>💳 Pago</button>
                          <button className="btn grn" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>renewSessions(c)}>↺ Renovar</button>
                          <button className="btn danger" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>deleteClient(c.id)}>🗑</button>
                        </div>
                        {/* Avatar upload */}
                        <div style={{marginBottom:14}}>
                          <span className="lbl">FOTO DE PERFIL</span>
                          <div style={{display:"flex",alignItems:"center",gap:12,marginTop:4}}>
                            {c.avatar_url
                              ? <img src={c.avatar_url} style={{width:52,height:52,borderRadius:"50%",objectFit:"cover",border:`2px solid ${c.color}`}}/>
                              : <div className="ring" style={{width:52,height:52,background:c.color+"20",color:c.color,fontSize:16,border:`2px solid ${c.color}40`}}>{ini(c.name)}</div>
                            }
                            <div style={{flex:1}}>
                              <input type="file" accept="image/*" id={"av"+c.id} style={{display:"none"}}
                                onChange={async(e)=>{
                                  const file=e.target.files[0]; if(!file) return;
                                  const ext=file.name.split(".").pop();
                                  const path=`${c.id}.${ext}`;
                                  const {error:upErr}=await sb.storage.from("avatars").upload(path,file,{upsert:true});
                                  if(upErr){notify("Error subiendo foto","err");return;}
                                  const {data}=sb.storage.from("avatars").getPublicUrl(path);
                                  await sb.from("clients").update({avatar_url:data.publicUrl+"?t="+Date.now()}).eq("id",c.id);
                                  await loadAll();
                                  notify("Foto actualizada ✓");
                                }}
                              />
                              <label htmlFor={"av"+c.id} className="btn sky" style={{fontSize:11,padding:"7px 12px",cursor:"pointer",display:"inline-block"}}>
                                📷 {c.avatar_url?"Cambiar foto":"Subir foto"}
                              </label>
                              {c.avatar_url&&<button className="btn danger" style={{fontSize:11,padding:"7px 10px",marginLeft:6}} onClick={async()=>{
                                await sb.from("clients").update({avatar_url:null}).eq("id",c.id);
                                await loadAll(); notify("Foto eliminada");
                              }}>✕</button>}
                            </div>
                          </div>
                        </div>

                        {/* Private notes */}
                        <div style={{marginBottom:14}}>
                          <span className="lbl">NOTAS PRIVADAS (solo tú las ves)</span>
                          <NotesEditor initialNotes={c.notes||""} onSave={(n)=>saveNotes(c.id,n)}/>
                        </div>
                        <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,marginBottom:8}}>PRÓXIMAS SESIONES</div>
                        {cSess.length===0?<p style={{fontSize:12,color:"#cbd5e1"}}>Sin sesiones agendadas</p>
                          :cSess.sort((a,b)=>a.date.localeCompare(b.date)).map(s=>(
                            <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #f1f4fa"}}>
                              <div>
                                <div style={{fontSize:12}}>{fmtDate(s.date)} · {s.time}</div>
                                <div style={{fontSize:11,color:"#64748b"}}>{s.type}{s.requested&&<span style={{color:"#ea580c",marginLeft:6,fontWeight:700}}>· solicitud</span>}</div>
                              </div>
                              <div style={{display:"flex",gap:5}}>
                                {s.requested
                                  ?<><button className="btn grn" style={{fontSize:10,padding:"4px 7px"}} onClick={()=>approveRequest(s.id)}>✓</button>
                                    <button className="btn danger" style={{padding:"4px 7px"}} onClick={()=>denyRequest(s.id)}>✕</button></>
                                  :<><button className="btn sky" style={{fontSize:10,padding:"4px 7px"}} onClick={()=>completeSession(s)}>✓ Hecha</button>
                                    <button className="btn danger" style={{padding:"4px 7px"}} onClick={()=>deleteSession(s.id)}>✕</button></>
                                }
                              </div>
                            </div>
                          ))
                        }
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* SCHEDULE */}
        {view==="schedule"&&(
          <div>
            {/* Header */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <h1 className="mono" style={{fontSize:18,fontWeight:700}}>Agenda</h1>
              <div style={{display:"flex",gap:8}}>
                <button className="btn ghost" style={{fontSize:12,padding:"8px 12px"}} onClick={()=>setShowSched(true)}>⚙️ Horario</button>
                <button className="btn sky" style={{fontSize:12,padding:"8px 14px"}} onClick={()=>setShowNS(true)}>+ Nueva</button>
              </div>
            </div>

            {/* View switcher */}
            <div className="seg" style={{marginBottom:14}}>
              {[["day","Día"],["week","Semana"],["month","Mes"]].map(([id,label])=>(
                <button key={id} className={"sb"+(schedView===id?" on":"")} onClick={()=>setSchedView(id)}>{label}</button>
              ))}
            </div>

            {/* Day nav */}
            {(schedView==="day"||schedView==="week")&&(
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,overflowX:"auto",paddingBottom:4}}>
                <button className="btn ghost" style={{padding:"6px 10px",fontSize:13,flexShrink:0}} onClick={()=>{
                  const d=new Date(activeDay+"T12:00:00");
                  d.setDate(d.getDate()-(schedView==="week"?7:1));
                  setActiveDay(d.toISOString().split("T")[0]);
                }}>‹</button>
                {schedView==="week"
                  ? <span style={{fontSize:14,fontWeight:600,color:"#64748b",flex:1,textAlign:"center",textTransform:"capitalize"}}>{(()=>{
                      const wd=getWeekDays(activeDay).slice(0,5);
                      const a=new Date(wd[0]+"T12:00:00"), b=new Date(wd[4]+"T12:00:00");
                      const o={day:"numeric",month:"short"};
                      return `${a.toLocaleDateString("es-ES",o)} — ${b.toLocaleDateString("es-ES",o)}`;
                    })()}</span>
                  : <span style={{fontSize:14,fontWeight:600,color:"#64748b",flex:1,textAlign:"center"}}>{fmtLong(activeDay)}</span>
                }
                <button className="btn ghost" style={{padding:"6px 10px",fontSize:13,flexShrink:0}} onClick={()=>{
                  const d=new Date(activeDay+"T12:00:00");
                  d.setDate(d.getDate()+(schedView==="week"?7:1));
                  setActiveDay(d.toISOString().split("T")[0]);
                }}>›</button>
              </div>
            )}

            {/* Block day / vacation buttons */}
            <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
              <button className="btn ghost" style={{fontSize:11,padding:"7px 12px"}}
                onClick={()=>toggleBlockDay(activeDay)}>
                {blocked.some(b=>b.date===activeDay&&b.time==="ALL")?"✓ Día desbloqueado":"🚫 Bloquear día"}
              </button>
              <button className="btn ghost" style={{fontSize:11,padding:"7px 12px",color:"#ca8a04"}}
                onClick={()=>setShowVacation(true)}>🏖 Vacaciones</button>
            </div>

            {/* DAY VIEW */}
            {schedView==="day"&&(()=>{
              const dayOff=isWeekend(activeDay)||blocked.some(b=>b.date===activeDay&&b.time==="ALL");
              if(dayOff){
                const wknd=isWeekend(activeDay);
                return(
                  <div className="card swipe" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,textAlign:"center",height:"calc(100dvh - 300px)",minHeight:300,maxHeight:660}}>
                    <div style={{fontSize:42}}>{wknd?"🌴":"🚫"}</div>
                    <div style={{fontSize:16,fontWeight:700,color:wknd?"#16a34a":"#dc2626"}}>{wknd?"Fin de semana — libre":"Día no disponible"}</div>
                    <div style={{fontSize:12,color:"#64748b",maxWidth:240}}>{wknd?"No hay clases los sábados ni domingos.":"Este día está bloqueado (vacaciones)."}</div>
                    {!wknd&&<button className="btn ghost" style={{padding:"8px 14px",fontSize:12}} onClick={()=>toggleBlockDay(activeDay)}>Desbloquear día</button>}
                  </div>
                );
              }
              return(
                <div className="card swipe" style={{padding:0,overflow:"hidden",display:"flex",flexDirection:"column",height:"calc(100dvh - 300px)",minHeight:300,maxHeight:660}}>
                  <div style={{flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
                    {daySlots.map((time,i)=>{
                      const slotBlocked=isBlocked(activeDay,time);
                      const slots=!slotBlocked?sessions.filter(s=>s.date===activeDay&&s.time===time)
                        .map(s=>({...s,client:clients.find(c=>c.id===s.client_id)})).filter(s=>s.client):[];
                      const cap=capOf(time), isWork=workSlots.includes(time), free=Math.max(0,cap-slots.length), full=slots.length>=cap;
                      return(
                        <div key={time} style={{flex:1,minHeight:0,display:"flex",borderBottom:i<daySlots.length-1?"1px solid #e6ebf3":"none",background:slotBlocked?"#fbecec":isWork?"transparent":"#f1f4fa"}}>
                          <div className="mono" style={{width:48,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",borderRight:"1px solid #e6ebf3",color:slotBlocked?"#b56b6b":"#bcd3ee",fontSize:11,fontWeight:700}}>{time}</div>
                          <div style={{flex:1,minWidth:0,overflowY:"auto",padding:"6px 9px",display:"flex",flexWrap:"wrap",gap:5,alignItems:"center",alignContent:"center"}}>
                            {slotBlocked
                              ?<span style={{fontSize:11,color:"#b56b6b",cursor:"pointer"}} onClick={()=>toggleBlock(activeDay,time)}>🚫 Bloqueado · toca para desbloquear</span>
                              :<>
                                {slots.map(s=>(
                                  <div key={s.id} style={{background:s.client.color+"18",border:`1px solid ${s.client.color}40`,borderRadius:10,padding:"4px 8px 4px 4px",fontSize:12,display:"flex",alignItems:"center",gap:6}}>
                                    <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}} onClick={()=>setQuickView(s.client)} title="Ver ficha (objetivos, lesiones, entreno)">
                                      {s.client.avatar_url
                                        ?<img src={s.client.avatar_url} style={{width:24,height:24,borderRadius:"50%",objectFit:"cover",border:`1.5px solid ${s.client.color}55`}}/>
                                        :<div className="ring" style={{width:24,height:24,background:s.client.color+"30",color:s.client.color,fontSize:9,border:`1.5px solid ${s.client.color}55`}}>{ini(s.client.name)}</div>
                                      }
                                      <span style={{color:s.client.color,fontWeight:700}}>{s.client.name.split(" ")[0]}<span style={{fontSize:9,color:"#64748b"}}> ⓘ</span></span>
                                    </div>
                                    <button title="Mover a otra hora" style={{background:"none",border:"none",cursor:"pointer",color:"#0284c7",fontSize:12,padding:0}} onClick={()=>setMoveSess(s)}>🕐</button>
                                    <button title="Vino (cuenta en el bono)" style={{background:"none",border:"none",cursor:"pointer",color:"#16a34a",fontSize:13,padding:0}} onClick={()=>completeSession(s)}>✓</button>
                                    <button title="No vino (no cuenta)" style={{background:"none",border:"none",cursor:"pointer",color:"#dc2626",fontSize:12,padding:0}} onClick={()=>deleteSession(s.id)}>✗</button>
                                  </div>
                                ))}
                                {isWork&&Array.from({length:free}).map((_,k)=>(
                                  <button key={"f"+k} title="Hueco libre · toca para agendar" onClick={()=>{setNs(v=>({...v,date:activeDay,time})); setShowNS(true);}}
                                    style={{width:28,height:28,borderRadius:"50%",border:"1.5px dashed #c9e6d1",background:"none",color:"#5f9e77",fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                                ))}
                                {!isWork&&slots.length===0&&<span style={{fontSize:11,color:"#cbd5e1",cursor:"pointer"}} onClick={()=>toggleBlock(activeDay,time)}>Fuera de horario · 🔒</span>}
                                {isWork&&<span style={{marginLeft:"auto",fontSize:10,fontWeight:700,color:full?"#ca8a04":"#16a34a",background:(full?"#ca8a04":"#16a34a")+"14",border:`1px solid ${(full?"#ca8a04":"#16a34a")}30`,borderRadius:20,padding:"2px 8px",whiteSpace:"nowrap"}}>{slots.length}/{cap}</span>}
                              </>
                            }
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{flexShrink:0,borderTop:"1px solid #e6ebf3",padding:"6px 10px",fontSize:10,color:"#94a3b8"}}>
                    <b style={{color:"#16a34a"}}>✓ Vino</b> · <b style={{color:"#dc2626"}}>✗ No vino</b> · <b style={{color:"#0284c7"}}>🕐 Mover</b> · <b style={{color:"#5f9e77"}}>+ hueco libre</b>
                  </div>
                </div>
              );
            })()}

            {/* WEEK VIEW - horizontal grid */}
            {schedView==="week"&&(()=>{
              const weekDays=getWeekDays(activeDay).slice(0,5);
              const weekSlots=Array.from(new Set([...workSlots,...sessions.filter(s=>weekDays.includes(s.date)).map(s=>s.time)])).sort();
              return(
                <div className="swipe" style={{display:"flex",flexDirection:"column",height:"calc(100dvh - 296px)",minHeight:300,maxHeight:660}}>
                  {/* Header row - days */}
                  <div style={{display:"grid",gridTemplateColumns:"38px repeat(5,1fr)",gap:2}}>
                    <div/>
                    {weekDays.map(day=>{
                      const isToday=day===TODAY;
                      const isBlkDay=blocked.some(b=>b.date===day&&b.time==="ALL");
                      return(
                        <div key={day} style={{textAlign:"center",padding:"4px 2px",borderRadius:8,
                          background:isToday?"#dcebfb":isBlkDay?"#fbe6e6":"#f1f4fa",
                          border:isToday?"1px solid #bcd3ee":isBlkDay?"1px solid #f2cccc":"1px solid #e6ebf3"}}>
                          <div style={{fontSize:9,color:isBlkDay?"#b56b6b":isToday?"#0284c7":"#64748b",fontWeight:700,textTransform:"capitalize"}}>
                            {new Date(day+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short"}).replace(".","")}
                          </div>
                          <div className="mono" style={{fontSize:13,fontWeight:700,color:isBlkDay?"#b56b6b":isToday?"#0284c7":"#0f172a"}}>
                            {new Date(day+"T12:00:00").getDate()}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  {/* Time rows - fill available height */}
                  <div style={{flex:1,display:"flex",flexDirection:"column",gap:2,marginTop:3,minHeight:0}}>
                    {weekSlots.map(time=>(
                      <div key={time} style={{flex:1,display:"grid",gridTemplateColumns:"38px repeat(5,1fr)",gap:2,minHeight:0}}>
                        <div className="mono" style={{display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"#bcd3ee",fontWeight:700}}>{time}</div>
                        {weekDays.map(day=>{
                          const isBlkDay=blocked.some(b=>b.date===day&&b.time==="ALL");
                          const slotBlocked=isBlkDay||isBlocked(day,time);
                          const daySessions=sessions.filter(s=>s.date===day&&s.time===time)
                            .map(s=>({...s,client:clients.find(c=>c.id===s.client_id)})).filter(s=>s.client);
                          return(
                            <div key={day} style={{borderRadius:6,padding:2,overflow:"hidden",display:"flex",flexDirection:"column",gap:1,

// ── MOVER SESIÓN (reprogramar) ─────────────────────────────────────────────
function MoveSessionModal({sess,sessions,clients,config,onMove,onClose}) {
  const [date,setDate] = React.useState(sess.date);
  const cliente = clients.find(c=>c.id===sess.client_id);
  const workSlots = [...genSlots(config.morningFrom,config.morningTo),...genSlots(config.afternoonFrom,config.afternoonTo)];
  const capOf = (t)=>(config.capacity&&config.capacity[t]!=null)?config.capacity[t]:config.defaultCapacity;
  // Ocupación del destino sin contar la propia sesión que estamos moviendo.
  const takenAt = (t)=>sessions.filter(s=>s.date===date&&s.time===t&&s.id!==sess.id).length;
  const slots = Array.from(new Set([...workSlots, sess.date===date?sess.time:null].filter(Boolean))).sort();

  const pick = (t)=>{
    if(date===sess.date && t===sess.time) return onClose(); // sin cambios
    const free = capOf(t)-takenAt(t);
    if(free<=0 && !window.confirm(`⚠️ Las ${t} ya están completas (${takenAt(t)}/${capOf(t)}).\n¿Mover igualmente?`)) return;
    onMove(date,t);
  };

  return(
    <div className="ovl" onClick={onClose}>
      <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
        <h2 className="mono" style={{fontSize:17,fontWeight:700,marginBottom:4}}>🕐 Mover sesión</h2>
        <p style={{fontSize:12,color:"#64748b",marginBottom:16}}>{cliente?cliente.name:"Cliente"} · {sess.type} — ahora el {fmtDate(sess.date)} a las {sess.time}</p>

        <div style={{marginBottom:14}}><span className="lbl">NUEVO DÍA</span>
          <input type="date" className="inp" value={date} min={TODAY} onChange={e=>setDate(e.target.value)}/>
        </div>

        <span className="lbl">NUEVA HORA</span>
        <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:6,maxHeight:280,overflowY:"auto"}}>
          {slots.map(t=>{
            const actual = date===sess.date && t===sess.time;
            const cap=capOf(t), taken=takenAt(t), free=cap-taken, full=free<=0, isWork=workSlots.includes(t);
            return(
              <button key={t} onClick={()=>pick(t)}
                style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:11,cursor:"pointer",fontFamily:"inherit",textAlign:"left",
                  background:actual?"#dcebfb":isWork?"#edf7ed":"#f1f4fa",

// ── EJECUTAR SESIÓN (registro de cargas durante el entreno) ────────────────
function SessionExecModal({client,date,assignedSessions,assignedExercises,clientWeights,loadAll,notify,onClose}) {
  const sess=(assignedSessions||[]).find(s=>s.client_id===client.id&&s.date===date);
  const baseExs=sess?(assignedExercises||[]).filter(e=>e.session_id===sess.id).sort((a,b)=>(a.order_index||0)-(b.order_index||0)):[];
  const [rows,setRows]=React.useState(()=>baseExs.map(e=>({
    id:e.id, name:e.exercise_name, sets:e.sets, reps:e.reps, protocol:e.protocol, prescribed:e.prescribed_weight,
    w:(e.actual_weight!=null?e.actual_weight:(e.prescribed_weight!=null?e.prescribed_weight:"")),
    r:(e.actual_reps!=null?e.actual_reps:(e.reps!=null?e.reps:"")),
    done:!!e.done,
  })));
  const [saving,setSaving]=React.useState(false);
  const setField=(id,k,v)=>setRows(rs=>rs.map(x=>x.id===id?{...x,[k]:v}:x));

  const toggleDone=async(row)=>{
    const nowDone=!row.done;
    setField(row.id,"done",nowDone); setSaving(true);
    const w=row.w===""||row.w==null?null:parseFloat(String(row.w).replace(",","."));
    const {error}=await sb.from("assigned_exercises").update({
      done:nowDone, actual_weight:nowDone?w:null, actual_reps:nowDone?(row.r||null):null, done_at:nowDone?new Date().toISOString():null,
    }).eq("id",row.id);
    if(error){ notify("Ejecuta el SQL de entrenamiento (docs)","err"); setField(row.id,"done",!nowDone); setSaving(false); return; }
    // Progresión: al marcar hecho con carga, actualizar la carga del cliente y guardar historial.
    if(nowDone && w!=null){
      const cw=(clientWeights||[]).find(x=>x.client_id===client.id && (x.exercise_name||"").toLowerCase()===row.name.toLowerCase());
      const oldW=cw?cw.weight:null;
      await sb.from("client_weights").upsert({client_id:client.id,exercise_name:row.name,weight:w,updated_at:new Date().toISOString()},{onConflict:"client_id,exercise_name"});
      if(oldW!=null && Number(oldW)!==w) await sb.from("weight_history").insert({client_id:client.id,exercise_name:row.name,old_weight:oldW,new_weight:w,reason:"Sesión ejecutada"});
    }
    setSaving(false);
  };

  const finalizar=async()=>{
    setSaving(true);
    if(sess) await sb.from("assigned_sessions").update({status:"done"}).eq("id",sess.id);
    await loadAll(); setSaving(false); notify("Entreno registrado ✓"); onClose();
  };

  const hechos=rows.filter(r=>r.done).length;
  return(
    <div className="ovl" onClick={onClose}>
      <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:480}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
          {client.avatar_url
            ?<img src={client.avatar_url} style={{width:44,height:44,borderRadius:"50%",objectFit:"cover"}}/>
            :<div className="ring" style={{width:44,height:44,background:client.color+"20",color:client.color,fontSize:14}}>{ini(client.name)}</div>}
          <div style={{flex:1,minWidth:0}}>
            <h2 className="mono" style={{fontSize:16,fontWeight:700}}>Ejecutar · {client.name}</h2>
            <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{fmtDate(date)} · {hechos}/{rows.length} hechos</div>
          </div>
        </div>

        {!sess||rows.length===0
          ?<div style={{background:"#f1f4fa",border:"1px solid #dbe2ec",borderRadius:10,padding:14,fontSize:13,color:"#64748b",textAlign:"center"}}>Sin entrenamiento asignado para hoy. Asígnalo desde Programa.</div>
          :<div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:"56vh",overflowY:"auto"}}>
            {rows.map(row=>(
              <div key={row.id} style={{background:row.done?"#eef8dd":"#f8fafc",border:`1px solid ${row.done?"#cbe8a4":"#e6ebf3"}`,borderRadius:12,padding:"10px 12px"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:8}}>
                  <div style={{fontWeight:700,fontSize:13,color:"#0f172a"}}>{row.name}</div>
                  <div style={{fontSize:10,color:"#94a3b8",whiteSpace:"nowrap"}}>plan: {row.sets&&row.reps?`${row.sets}×${row.reps}`:"—"}{row.prescribed!=null?` · ${row.prescribed}kg`:""}</div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{flex:1}}>
                    <span className="lbl" style={{marginBottom:3}}>PESO (kg)</span>
                    <input type="number" inputMode="decimal" className="inp" style={{padding:"8px 10px"}} value={row.w} onChange={e=>setField(row.id,"w",e.target.value)}/>
                  </div>
                  <div style={{flex:1}}>
                    <span className="lbl" style={{marginBottom:3}}>REPS</span>
                    <input type="text" className="inp" style={{padding:"8px 10px"}} value={row.r} onChange={e=>setField(row.id,"r",e.target.value)}/>
                  </div>
                  <button className={row.done?"btn grn":"btn ghost"} style={{padding:"9px 12px",alignSelf:"flex-end",fontSize:16}} disabled={saving} onClick={()=>toggleDone(row)}>{row.done?"✓":"○"}</button>
                </div>
              </div>
            ))}
          </div>
        }

        <div style={{display:"flex",gap:8,marginTop:16}}>
          {sess&&rows.length>0&&<button className="btn sky" style={{flex:1,padding:12,justifyContent:"center"}} disabled={saving} onClick={finalizar}>Finalizar entreno</button>}
          <button className="btn ghost" style={{flex:sess&&rows.length>0?"0 0 auto":1,padding:"12px 16px"}} onClick={onClose}>Cerrar</button>
        </div>
      </div>
    </div>
  );
}

// ── ASIGNAR ENTRENO (elegir plantilla desde la agenda) ─────────────────────
function AssignTrainingModal({client,date,sessionTemplates,templateExercises,clientWeights,assignedSessions,assignedExercises,annualBlocks,loadAll,notify,onClose}) {
  const [saving,setSaving]=React.useState(false);
  const existing=(assignedSessions||[]).find(s=>s.client_id===client.id&&s.date===date);
  const goalTag=client.goal==="estetica"?"Masa":"Salud";
  const blockName=(id)=>{const b=(annualBlocks||[]).find(x=>x.id===id);return b?b.name:"";};
  const blockOrder=(id)=>{const b=(annualBlocks||[]).find(x=>x.id===id);return b?(b.order_index||0):999;};
  const matchesGoal=(t)=>String(t.name||"").endsWith("· "+goalTag);
  // Plantillas: primero las del objetivo del cliente, luego por bloque.
  const templates=(sessionTemplates||[]).slice().sort((a,b)=>{
    const am=matchesGoal(a)?0:1, bm=matchesGoal(b)?0:1;
    if(am!==bm) return am-bm;
    const ao=blockOrder(a.block_id), bo=blockOrder(b.block_id);
    if(ao!==bo) return ao-bo;
    return (a.order_index||0)-(b.order_index||0);
  });

  const asignar=async(tmpl)=>{
    setSaving(true);
    // Si ya hay un entreno ese día, lo reemplazamos.
    if(existing){
      await sb.from("assigned_exercises").delete().eq("session_id",existing.id);
      await sb.from("assigned_sessions").delete().eq("id",existing.id);
    }
    const {data:sess,error}=await sb.from("assigned_sessions")
      .insert({client_id:client.id,template_id:tmpl.id,date,status:"pending"}).select().single();
    if(error){ notify("Error al asignar","err"); setSaving(false); return; }
    const tex=(templateExercises||[]).filter(te=>te.template_id===tmpl.id).sort((a,b)=>(a.order_index||0)-(b.order_index||0));
    const wts=(clientWeights||[]).filter(w=>w.client_id===client.id);
    const rows=tex.map(ex=>{
      const cw=wts.find(w=>(w.exercise_name||"").toLowerCase()===(ex.exercise_name||"").toLowerCase());
      return {session_id:sess.id,exercise_name:ex.exercise_name,prescribed_weight:cw?cw.weight:null,
        sets:ex.sets,reps:ex.reps,protocol:ex.protocol,rest_seconds:ex.rest_seconds,notes:ex.notes,order_index:ex.order_index};
    });
    if(rows.length>0) await sb.from("assigned_exercises").insert(rows);
    await loadAll(); setSaving(false); notify("Entreno asignado ✓"); onClose();
  };

  return(
    <div className="ovl" onClick={onClose}>
      <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:440}}>
        <h2 className="mono" style={{fontSize:16,fontWeight:700,marginBottom:4}}>Asignar entreno · {client.name}</h2>
        <p style={{fontSize:12,color:"#64748b",marginBottom:6}}>{fmtDate(date)} · elige una plantilla{existing?" (reemplaza la actual)":""}.</p>
        <div style={{fontSize:11,marginBottom:14}}><span style={{color:"#94a3b8"}}>Objetivo: </span><b style={{color:client.goal==="estetica"?"#0284c7":"#16a34a"}}>{client.goal==="estetica"?"💪 Estética/Masa":"🩺 Salud"}</b> <span style={{color:"#94a3b8"}}>· sus plantillas salen primero</span></div>
        {templates.length===0
          ?<div style={{background:"#f1f4fa",border:"1px solid #dbe2ec",borderRadius:10,padding:14,fontSize:13,color:"#64748b",textAlign:"center"}}>No tienes plantillas. Créalas en <b>Programa</b>.</div>
          :<div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:"56vh",overflowY:"auto"}}>
            {templates.map(t=>{
              const n=(templateExercises||[]).filter(te=>te.template_id===t.id).length;
              const isCur=existing&&existing.template_id===t.id;
              const fit=matchesGoal(t);
              return(
                <button key={t.id} disabled={saving} onClick={()=>asignar(t)}
                  style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,padding:"11px 14px",borderRadius:12,cursor:"pointer",fontFamily:"inherit",textAlign:"left",
                    background:isCur?"#eef8dd":fit?"#f2f8ff":"#f8fafc",border:`1px solid ${isCur?"#cbe8a4":fit?"#bcd3ee":"#e6ebf3"}`}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:700,color:"#0f172a"}}>{t.name}{isCur&&<span style={{fontSize:10,color:"#16a34a"}}> · actual</span>}</div>
                    <div style={{fontSize:11,color:"#64748b",marginTop:2,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{blockName(t.block_id)} · {n} ejercicio{n===1?"":"s"}</div>
                  </div>
                  <span style={{fontSize:12,color:"#0284c7",fontWeight:700,whiteSpace:"nowrap"}}>Asignar →</span>
                </button>
              );
            })}
          </div>
        }
        <button className="btn ghost" style={{width:"100%",marginTop:16,padding:11}} onClick={onClose}>Cancelar</button>
      </div>
    </div>
  );
}

// ── PROGRESIÓN (evolución de cargas por ejercicio) ─────────────────────────
function Sparkline({pts,color}) {
  if(!pts||!pts.length) return null;
  const n=pts.length, min=Math.min(...pts), max=Math.max(...pts), rng=(max-min)||1;
  const X=i=> n===1?50:(i/(n-1))*100;
  const Y=v=> 28-((v-min)/rng)*24+2;
  const poly=pts.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  return(
    <svg viewBox="0 0 100 32" preserveAspectRatio="none" style={{width:"100%",height:36,display:"block"}}>
      <polyline points={poly} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
      <circle cx={X(n-1)} cy={Y(pts[n-1])} r="2.6" fill={color}/>
    </svg>
  );
}
function ProgressionModal({client,clientWeights,weightHistory,records,onClose}) {
  const cw=(clientWeights||[]).filter(w=>w.client_id===client.id);
  const hist=(weightHistory||[]).filter(h=>h.client_id===client.id);
  const prs=(records||[]).filter(r=>r.client_id===client.id).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  const names=[...new Set([...cw.map(w=>w.exercise_name),...hist.map(h=>h.exercise_name)].filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));
  const series=(name)=>{
    const hs=hist.filter(h=>String(h.exercise_name||"").toLowerCase()===String(name).toLowerCase())
      .sort((a,b)=>new Date(a.changed_at||0)-new Date(b.changed_at||0));
    let pts=[];
    if(hs.length){ if(hs[0].old_weight!=null) pts.push(Number(hs[0].old_weight)); hs.forEach(h=>{ if(h.new_weight!=null) pts.push(Number(h.new_weight)); }); }
    const c=cw.find(w=>String(w.exercise_name||"").toLowerCase()===String(name).toLowerCase());
    if(c&&c.weight!=null){ const v=Number(c.weight); if(!pts.length||pts[pts.length-1]!==v) pts.push(v); }
    return pts.filter(x=>!isNaN(x));
  };
  return(
    <div className="ovl" onClick={onClose}>
      <div className="mdl fade" onClick={e=>e.stopPropagation()} style={{maxWidth:460}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
          {client.avatar_url
            ?<img src={client.avatar_url} style={{width:44,height:44,borderRadius:"50%",objectFit:"cover"}}/>
            :<div className="ring" style={{width:44,height:44,background:client.color+"20",color:client.color,fontSize:14}}>{ini(client.name)}</div>}
          <div><h2 className="mono" style={{fontSize:16,fontWeight:700}}>Progresión · {client.name}</h2>
          <div style={{fontSize:11,color:"#64748b",marginTop:2}}>Evolución de cargas y marcas</div></div>
        </div>

        {names.length===0&&prs.length===0
          ?<div style={{background:"#f1f4fa",border:"1px solid #dbe2ec",borderRadius:10,padding:16,fontSize:13,color:"#64748b",textAlign:"center"}}>Aún no hay datos de cargas. Aparecerán cuando ejecutes entrenos con peso.</div>
          :<div style={{maxHeight:"64vh",overflowY:"auto"}}>
            {names.length>0&&<span className="lbl">CARGAS POR EJERCICIO</span>}
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:prs.length?16:0}}>
              {names.map(name=>{
                const pts=series(name);
                if(!pts.length) return null;
                const first=pts[0], last=pts[pts.length-1], diff=Math.round((last-first)*100)/100;
                const col=diff>0?"#16a34a":diff<0?"#dc2626":"#64748b";
                return(
                  <div key={name} style={{background:"#f8fafc",border:"1px solid #e6ebf3",borderRadius:12,padding:"10px 12px"}}>
                    <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:8}}>
                      <div style={{fontSize:13,fontWeight:700,color:"#0f172a"}}>{name}</div>
                      <div style={{whiteSpace:"nowrap"}}>
                        <span className="mono" style={{fontSize:15,fontWeight:800,color:"#0284c7"}}>{last}kg</span>
                        {pts.length>1&&<span style={{fontSize:11,fontWeight:700,color:col,marginLeft:6}}>{diff>0?"▲ +":diff<0?"▼ ":"= "}{diff!==0?Math.abs(diff)+"kg":""}</span>}
                      </div>
                    </div>
                    {pts.length>1&&<div style={{marginTop:4}}><Sparkline pts={pts} color={col}/></div>}
                  </div>
                );
              })}
            </div>
            {prs.length>0&&<>
              <span className="lbl">🏆 MARCAS PERSONALES</span>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {prs.slice(0,12).map((r,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,background:"#f8fafc",border:"1px solid #e6ebf3",borderRadius:10,padding:"8px 12px"}}>
                    <div style={{fontSize:13,fontWeight:600,color:"#0f172a"}}>{r.exercise_name}</div>
                    <div style={{whiteSpace:"nowrap"}}><span className="mono" style={{fontSize:13,fontWeight:800,color:"#ca8a04"}}>{r.value}{r.unit||"kg"}</span><span style={{fontSize:10,color:"#94a3b8",marginLeft:6}}>{r.date?fmtDate(r.date):""}</span></div>
                  </div>
                ))}
              </div>
            </>}
          </div>
        }
        <button className="btn ghost" style={{width:"100%",marginTop:16,padding:11}} onClick={onClose}>Cerrar</button>
      </div>
    </div>
  );
}

// ── SCHEDULE / HORARIO MODAL ───────────────────────────────────────────────
// Configura las franjas de mañana y tarde (sesiones de 1h) y los atletas por hora.
function ScheduleModal({config,onSave,onClose}) {
  const [cfg,setCfg] = React.useState({...DEFAULT_SCHEDULE,...config,capacity:{...(config.capacity||{})}});
  const slots = [...genSlots(cfg.morningFrom,cfg.morningTo),...genSlots(cfg.afternoonFrom,cfg.afternoonTo)];
  // Capacidad entre 1 y 5 atletas por hora.
  const capOf = (t) => cfg.capacity[t]!=null?cfg.capacity[t]:cfg.defaultCapacity;
  const setCap = (t,v) => setCfg(c=>({...c,capacity:{...c.capacity,[t]:Math.min(5,Math.max(1,parseInt(v||1,10)))}}));
